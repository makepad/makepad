workspace.resolver = "2"
#debug = true

[patch.crates-io]
bitflags = { path = "libs/bitflags" }
smallvec = { path = "libs/smallvec" }
windows-link = { path = "libs/windows/windows-link" }

# Build profiles, for every member, the private apps' crates included.
#
# dev: line tables are enough for backtraces and printf debugging (nobody
# attaches a debugger); full debuginfo cost a quarter of a clean dev build
# and doubled the Windows PDB and link time.
[profile.dev]
debug = "line-tables-only"

# release: agents build release all the time, so an edited crate recompiles
# incrementally (widgets edit 30 s -> 11 s on Mac, 45 s -> 16 s on Windows;
# a clean build is ~6% slower). cargo-makepad's packaging commands (android,
# apple, wasm, ohos, desktop build) set CARGO_PROFILE_RELEASE_INCREMENTAL=false,
# so shipped binaries are still built whole. lto = "off" drops the default
# thin-local LTO pass (release clean 63 s -> 52 s for amp, edit loop faster).
[profile.release]
incremental = true
lto = "off"

[profile.small]
inherits = "release"
incremental = false
#debug = true
opt-level = 'z'   # Optimize for size
lto = true        # Enable link-time optimization
codegen-units = 1 # Reduce number of codegen units to increase optimizations
panic = 'abort'   # Abort on panic
strip = true

[profile.profile]
inherits = "release"
debug = true

[profile.test.package.makepad-stitch]
opt-level = 1

