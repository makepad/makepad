[profile.dev]
debug = "line-tables-only"

# release: agents build release all the time, so an edited crate recompiles
# incrementally (widgets edit 30 s -> 11 s on Mac, 45 s -> 16 s on Windows;
# a clean build is ~6% slower). cargo-makepad's packaging commands (android,
# apple, wasm, desktop build) set CARGO_PROFILE_RELEASE_INCREMENTAL=false,
# so shipped binaries are still built whole. lto = "off" drops the default
# thin-local LTO pass (release clean 63 s -> 52 s for amp, edit loop faster).
[profile.release]
incremental = true
lto = "off"

# host: the `makepad` JIT binary (Relax + makepad run) built for speed on the machine that runs it.
# Output goes to target/host/ (or target/<triple>/host/), never over target/release: release stays the
# distributable build and the build every gate, A/B and timing series uses.
# local/agent_state/relax-campaign/build-host.sh adds -Ctarget-cpu=native and the PGO profile.
[profile.host]
inherits = "release"
opt-level = 3
lto = "thin"
codegen-units = 16
incremental = false

[profile.small]
inherits = "release"
incremental = false
#debug = true
opt-level = 'z'   # Optimize for size
lto = true        # Enable link-time optimization
codegen-units = 1 # Reduce number of codegen units to increase optimizations
panic = 'abort'   # Abort on panic
strip = true

[profile.profile]
inherits = "release"
debug = true

[profile.test.package.makepad-stitch]
opt-level = 1

# stitch's interpreter needs its handlers' calls to become tail calls; built
# incrementally (release has incremental = true) they are not, and the script
# math AOT overflows the stack.
[profile.release.package.makepad-stitch]
incremental = false

# The Arcade frontend: only the app crate itself (the edit-hot 100k lines of
# src/) compiles incrementally; the engine and gameplay crates stay whole
# (non-incremental, thin-local LTO), which measured 25-40 % faster scene draw.
[profile.release.package.makepad-sandbox]
incremental = true

