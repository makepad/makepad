    # Every app directory with a `src/`: the public apps above, and a private
    # app repository cloned into apps/<name> whose root Cargo.toml is a
    # package (Scope, Source Library) or a members package (Stage) naming its
    # crates as path dependencies, which makes them members too. Its crates then compile in this workspace and share its
