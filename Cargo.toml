workspace.exclude = [
    # Private app repositories cloned into apps/<name> are members through
    # apps/*/src/.. above: Scope (its deps/* come with it as path
    # dependencies), Source Library, and Stage (a members package at its
    # root).
    # Private Arcade frontend (apps/sandbox) keeps its own workspace for now:
    # its libs/* reuse the package names of Stage's libs/game/* crates
