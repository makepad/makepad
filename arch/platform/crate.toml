overview = """
Makepad platform connects an application's Cx and event handler to windows, input, graphics, media and network services on native systems and the web.
OS callbacks enter one UI event loop; Draw callbacks record retained draw lists, then the selected renderer submits dirty passes to the GPU.
Render submission lives in the inspected UI loops; the render lane marks a GPU boundary, not a universal extra thread.
Warm workers handle background jobs through light and heavy queues, while audio runs in device callbacks or a web AudioWorklet.
Signals bring results back to the UI, although legacy locks and unbounded channels remain.
Cx owns resource pools and exposes a device-adjusted memory envelope; texture accounting includes allocations awaiting GPU completion.
An optional localhost remote bridge queues inspection and input commands for UI dispatch.
This is a subsystem map; actual resident memory, throughput and callback latency are unknown."""

[lanes]
audio = { title = "Audio callbacks / AudioWorklet" }
render = { title = "Render / GPU boundary" }
ui = { title = "Main / UI event thread" }
workers = { title = "Background workers / HTTP threads" }

[nodes]

[nodes.audio]
kind = "thread"
title = "Audio callbacks"
summary = "Device callbacks exchange PCM through a shared media API."
story = """
CxMediaApi installs input and output callbacks so applications can process PCM across native devices and web AudioWorklets.
Callbacks receive device and sample-rate information; device changes return to the UI.
Failed devices are tracked for fallback selection.
The web callback still resizes buffers and uses lock_from_audio; a lock-free or allocation-free guarantee is absent.
Latency and underrun budgets are unknown."""
lane = "audio"
refs = ["platform/src/audio.rs", "platform/src/media_api.rs::CxMediaApi", "platform/src/os/apple/apple_media.rs", "platform/src/os/apple/audio_unit.rs", "platform/src/os/web/web_audio.rs::wasm_audio_output_entrypoint", "platform/src/thread.rs::lock_from_audio"]

[nodes.cx]
kind = "component"
title = "Cx application context"
summary = "Owns application state, platform requests and rendering resources."
story = """
Cx gives the application one context for windows, input state, scripts, draw resources and background work.
Native entry points hold it in Rc<RefCell<Cx>> and call the application with mutable access.
Its operation queue lets APIs request OS work during event handling.
Pool handles carry generations to distinguish reused slots; stale draw-list or texture generations log errors.
Cx is not a shared worker-thread context."""
lane = "ui"
refs = ["platform/src/cx.rs::Cx", "platform/src/cx_api.rs::CxOsOp", "platform/src/os/apple/macos/macos.rs", "platform/src/draw_list.rs::CxDrawListPool", "platform/src/texture.rs::CxTexturePool"]

[nodes.draw_graph]
kind = "store"
title = "Retained draw lists and passes"
summary = "Retains draw calls, instances and pass relationships between repaints."
story = """
Draw lists store draw calls and instance data; passes connect those lists to windows or render textures.
Retaining these records lets a repaint reuse recorded drawing.
Dirty passes are ordered before backend submission, and uniform generations distinguish reused recordings.
Stale pool generations log errors.
On web, only window zero is presented; additional window passes are marked clean without presentation."""
lane = "ui"
refs = ["platform/src/draw_list.rs::DrawList", "platform/src/draw_pass.rs::CxDrawPassParent", "platform/src/draw_vars.rs", "platform/src/os/cx_shared.rs::Cx::call_draw_event", "platform/src/os/web/web.rs::Cx::handle_repaint"]

[nodes.event_loop]
kind = "thread"
title = "UI event loop"
summary = "Turns OS input, timers and wakeups into application events and redraws."
story = """
Native event loops and the web message entry dispatch Event values to the application.
Startup initializes the memory envelope and warms the task pool; Draw asks the app to record its next visual state.
Synchronous re-entry into the event handler is rejected and logged.
Shutdown is not guaranteed on every platform, so cleanup cannot rely solely on that event."""
lane = "ui"
refs = ["platform/src/app_main.rs", "platform/src/event/mod.rs", "platform/src/event/event.rs::Event", "platform/src/os/cx_shared.rs::Cx::call_event_handler", "platform/src/os/apple/macos/macos.rs::Cx::event_loop", "platform/src/os/windows/windows.rs::Cx::event_loop", "platform/src/os/linux/windowing_backend.rs::Cx::event_loop", "platform/src/os/web/web.rs::Cx::process_to_wasm"]

[nodes.gpu]
kind = "gpu"
title = "Backend renderer"
summary = "Submits retained drawing through Metal, D3D11, OpenGL, WebGL or selected alternatives."
story = """
The selected backend uploads drawing data and textures, compiles shaders and renders passes.
The inspected desktop and web loops submit from the UI path; GPU execution and completion form a separate boundary.
Metal skips drawing after shader compilation errors, and readbacks can report device loss.
Vulkan is configuration gated; headless has a separate software renderer.
A universal render thread and GPU memory ceiling are unknown."""
lane = "render"
refs = ["platform/src/os/apple/metal.rs", "platform/src/os/windows/d3d11.rs", "platform/src/os/linux/opengl.rs", "platform/src/os/linux/mod.rs", "platform/src/os/web/web_gl.rs", "platform/src/os/headless/mod.rs", "platform/src/os/apple/macos/macos.rs", "platform/src/os/windows/windows.rs", "platform/src/os/linux/x11/linux_x11.rs", "platform/src/os/web/web.rs"]

[nodes.memory_budget]
kind = "memory"
title = "Memory envelope and reporting"
summary = "Publishes a device-adjusted cache budget and reports CPU resource usage."
story = """
Cx initializes and logs a process memory envelope for elastic caches and batches.
Native policy uses physical memory when available and a default otherwise; web supplies its envelope at startup.
This is guidance to consumers, not a hard allocator limit.
CxMemoryReport counts CPU geometry, instance, texture and script-resource bytes; GPU texture accounting is separate.
Actual process residency is unknown."""
lane = "ui"
refs = ["platform/src/cx.rs::Cx::initialize_memory_budget", "platform/src/cx.rs::Cx::memory_report", "platform/src/cx.rs::memory_budget_from_physical_memory", "platform/src/cx_api.rs::Cx::texture_pool_bytes"]
budget = "Default 1536 MiB; desktop below 8 GiB RAM uses one quarter; iOS/Android quarter RAM clamped to 384–1536 MiB; web-reported envelope, phone policy 320 MiB."

[nodes.midi]
kind = "io"
title = "MIDI ports"
summary = "Exposes backend MIDI ports and three-byte messages."
story = """
MIDI wrappers let the application select ports and send or receive messages without choosing an OS implementation.
CxMediaApi creates initialized input and output handles; their methods unwrap the backend, so using a default uninitialized handle can panic.
Port-change events describe available devices.
Message timing, queue capacity and delivery guarantees are unknown at this overview level."""
refs = ["platform/src/midi.rs::MidiInput", "platform/src/midi.rs::MidiOutput", "platform/src/midi.rs::MidiData", "platform/src/media_api.rs::CxMediaApi", "platform/src/os/apple/apple_media.rs"]

[nodes.network]
kind = "io"
title = "HTTP and WebSockets"
summary = "Routes requests to platform backends and returns identified network responses."
story = """
Cx owns a NetworkRuntime that delegates HTTP and WebSocket operations to a backend.
Responses keep request or socket IDs so the event loop can route them to scripts and application handlers.
The response channel is unbounded and receiver access uses a mutex; this is not a uniformly lock-free path.
Open/send operations return errors, and asynchronous failures become response events.
Transport worker and callback placement depends on the backend."""
refs = ["platform/src/cx.rs", "platform/src/event/network.rs", "platform/src/web_socket.rs", "platform/network/src/runtime.rs::NetworkRuntime", "platform/network/src/backend/apple/web_socket.rs::AppleWebSocket", "platform/src/os/web/web.rs"]

[nodes.os_services]
kind = "io"
title = "Windows and OS adapters"
summary = "Adapts window operations, input and lifecycle events to the selected platform."
story = """
CxOsApi and CxOsOp separate application requests from target-specific window and device APIs.
Compile-time gates select Apple, Windows, Linux-family, web or headless code.
Desktop Linux chooses Wayland or X11 from an override or environment; browser messages cross the wasm bridge.
Capabilities differ: Wayland backdrop blur is a logged no-op, and some native initialization paths can panic.
Uniform feature support is not guaranteed."""
lane = "ui"
refs = ["platform/src/lib.rs", "platform/src/cx_api.rs::CxOsApi", "platform/src/os/mod.rs", "platform/src/os/apple/mod.rs", "platform/src/os/windows/mod.rs", "platform/src/os/linux/mod.rs", "platform/src/os/linux/windowing_backend.rs", "platform/src/os/linux/wayland/linux_wayland.rs", "platform/src/os/web/mod.rs", "platform/src/os/web/from_wasm.rs", "platform/src/os/web/to_wasm.rs"]

[nodes.remote]
kind = "io"
title = "Optional remote control"
summary = "Queues localhost inspection, capture and input commands for the application's UI."
story = """
With remote control enabled, localhost HTTP threads accept commands and wait for replies while the UI polls its command queue.
HTTP handlers never receive Cx; injected input uses the normal event dispatch path.
The UI defers a contested command-queue lock, and capture encoding runs on a bounded long-lived worker.
Busy or stopped event loops cause request timeouts; readback and capture admission can fail.
This bridge is optional and platform gated."""
lane = "workers"
refs = ["platform/src/remote.rs", "platform/src/os/cx_shared.rs::Cx::poll_control_channel", "platform/src/texture.rs::ReadbackRequest"]

[nodes.resources]
kind = "store"
title = "Script and font assets"
summary = "Shares resource bytes while keeping script handles local to their owning heaps."
story = """
CxScriptResources tracks lazy assets through not-loaded, loading, loaded and error states.
Resource data is shared at Cx level, but each script heap gets its own handle and path cache.
Reusing a handle from another heap would corrupt its garbage-collection walk.
Native file loading and web HTTP requests populate the same resource state.
Failed loads retain an error; total asset residency and cache eviction policy are unknown."""
lane = "ui"
refs = ["platform/src/script/res.rs::CxScriptResources", "platform/src/script/res.rs::CxScriptResourceData", "platform/src/cx_api.rs::Cx::get_resource_font_bytes", "platform/src/cx.rs::Cx::memory_report"]

[nodes.script]
kind = "component"
title = "Splash and script integration"
summary = "Connects script heaps, resources and live reapplication to the application context."
story = """
Cx holds script VM state and platform modules that expose context, drawing, resources and timers.
Live reapplication lets existing widget state respond to edited script values.
ScriptReapply preserves runtime mutations without rerunning script_mod; LiveEdit reruns definitions and can overwrite those values.
The platform owns this integration; parsing and VM internals live in the nested script crates.
VM recovery guarantees are unknown here."""
lane = "ui"
refs = ["platform/src/cx.rs", "platform/src/script/mod.rs", "platform/src/script/cx.rs", "platform/src/script/script.rs::CxScriptData", "platform/src/event/event.rs::Event", "platform/src/cx_api.rs::Cx::request_script_reapply"]

[nodes.task_pool]
kind = "thread"
title = "Background worker runtime"
summary = "Keeps pool workers warm and supports dedicated long-lived worker loops."
story = """
The runtime starts pool workers at Startup so small background jobs avoid thread startup costs.
Light and heavy work use separate lanes; ThreadSpawner also supports dedicated long-lived loops.
Callers poll TaskHandle results, and blocking join rejects the UI thread.
Failures include unsupported spawning, cancellation, panic and lost workers.
Legacy lock wrappers still block natively or spin on wasm; the whole runtime is not lock-free."""
lane = "workers"
refs = ["platform/src/thread.rs::TaskPool", "platform/src/thread.rs::ThreadSpawner", "platform/src/thread.rs::TaskHandle", "platform/src/os/cx_shared.rs::Cx::call_event_handler"]

[nodes.task_queues]
kind = "queue"
title = "Light and heavy job queues"
summary = "Bounds queued work and returns refused jobs so callers can retry."
story = """
TaskPool reserves bounded queue slots before accepting work, with capacity and counters per lane.
Worker-only receiver locks keep queue consumption off the UI.
try_submit returns the original closure on QueueFull or Closed, so callers can retain it for another frame.
TaskQueue can stage keyed work and limit how much enters the pool.
Pool jobs must not wait for sibling pool jobs, which can starve the workers."""
lane = "workers"
refs = ["platform/src/thread.rs::LaneQueue", "platform/src/thread.rs::TaskPool::try_submit", "platform/src/thread.rs::TaskQueue"]

[nodes.textures]
kind = "memory"
title = "Texture pool and readbacks"
summary = "Reuses texture slots and retains released GPU allocations until completion."
story = """
CxTexturePool owns texture handles and compatible reusable slots.
Supported backends retire released allocations against renderer serials instead of freeing resources still in flight.
texture_pool_bytes includes free slots and pending releases, but omits unknown external allocations.
Readback requests reserve bounded bytes and can fail under backpressure or device loss.
Some backends return unknown accounting or leave release unsupported; no total pool cap is established."""
lane = "ui"
refs = ["platform/src/texture.rs::CxTexturePool", "platform/src/texture.rs::Texture", "platform/src/cx_api.rs::Cx::texture_pool_bytes", "platform/src/cx_api.rs::Cx::frame_completion_serial", "platform/src/os/apple/metal.rs"]
budget = "Total pool cap unknown; readback staging/results reserve at most 32 MiB across at most 256 requests."

[nodes.ui_signals]
kind = "queue"
title = "UI messages and wakeups"
summary = "Carries worker results and coalesces notifications for the event loop."
story = """
SignalToUI uses atomic flags to coalesce wakes; ToUIReceiver exposes try_recv for UI polling.
Bounded channels are available explicitly, while the default ToUIReceiver is unbounded.
try_send reports Full or Disconnected with the value; send on a bounded channel can block.
The wake callback registry uses a mutex.
Applications must choose a suitable channel and retry policy; no universal capacity or nonblocking guarantee applies."""
lane = "ui"
refs = ["platform/src/thread.rs", "platform/network/src/ui_signal.rs::SignalToUI", "platform/network/src/ui_signal.rs::ToUIReceiver", "platform/network/src/ui_signal.rs::to_ui_bounded"]

[nodes.video]
kind = "component"
title = "Video and camera sessions"
summary = "Connects capture and playback backends to frame events, textures and audio."
story = """
The media APIs coordinate camera capture, encoding and playback without exposing each OS player to widgets.
MediaTextureBridge allocates external or YUV textures, and MediaEventBridge emits prepared, updated, completed and error events.
Registered frame sessions transfer ownership once into playback plumbing.
Codec, source and texture support vary; unsupported encoding or decoding reports errors.
Decode-worker counts and frame-buffer budgets are unknown."""
lane = "ui"
refs = ["platform/src/video.rs::VideoEncodeError", "platform/src/media_api.rs::CxMediaApi", "platform/src/media_host.rs::MediaTextureBridge", "platform/src/media_host.rs::MediaEventBridge", "platform/src/video_session.rs::take_registered_video_frame_session", "platform/src/playback_session.rs", "platform/src/video_decode/software_video.rs"]

