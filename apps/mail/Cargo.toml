# mail — part of the Makepad app family: standalone window, and a module
# (src/module.rs) the window manager seats in-process. Spec of record:
# local/agent_state/wm-all/apps/mail-spec.md; contract: .../CONTRACT.md.

[package]
name = "makepad-mail"
version = "0.1.0"
edition = "2021"
default-run = "mail"

[lib]
name = "makepad_mail"
path = "src/lib.rs"

[[bin]]
name = "mail"
path = "src/main.rs"
required-features = ["standalone"]

[features]
dynamic-module = []
default = ["standalone"]
# The standalone window (src/main.rs); a host that links the module leaves it off.
standalone = []

[dependencies]
makepad-widgets = { path = "../../widgets" }
makepad-wm-theme = { path = "../../libs/wm_theme" }
makepad-ai-services = { path = "../../libs/ai/services" }
makepad-app-module = { path = "../../libs/app_module" }
makepad-strict-json = { path = "../../libs/strict_json" }
makepad-civil-time = { path = "../../libs/civil_time" }

makepad-search = { path = "../../libs/search" }
makepad-sqlite = { path = "../../libs/sqlite_query" }
makepad-base64 = { path = "../../libs/base64" }
makepad-html = { path = "../../libs/html" }

[[bin]]
name = "mail-index"
path = "src/index_main.rs"
required-features = ["standalone"]
