# terminal — a first-class terminal emulator as a plain full-window Makepad app.
#
# The VT core under src/term/ is a clean Rust port of Ghostty's terminal
# subsystem (github.com/ghostty-org/ghostty, MIT license — see
# src/term/mod.rs for attribution). The PTY layer is carried over from
# makepad-terminal-core, which had already solved spawn/resize/controlling-tty
# on macOS, Linux and Windows (ConPTY).
#
# terminal runs standalone, and unmodified inside makepad-app-wm / Studio tiles via
# the shared --stdin-loop client runtime every Makepad app has.

[package]
name = "makepad-app-terminal"
version = "0.1.0"
edition = "2021"
license = "MIT AND Unicode-3.0"
default-run = "makepad-app-terminal"

[lib]
name = "makepad_app_terminal"
path = "src/lib.rs"

[[bin]]
name = "makepad-app-terminal"
path = "src/main.rs"

[features]
default = ["tweaker"]
# The design overlay (Shift+F10 with the dev overlays on). On for development
# builds; the Builder's releases build without it (--no-default-features).
tweaker = ["dep:makepad-widgets-tweaker", "makepad-widgets/data", "makepad-widgets/dock", "makepad-widgets/fab"]

[dependencies]
makepad-widgets = { path = "../../widgets", default-features = false }
makepad-widgets-tweaker = { path = "../../widgets/families/tweaker", optional = true }
makepad-ai-services = { path = "../../libs/ai/services" }
makepad-strict-json = { path = "../../libs/strict_json" }
makepad-wm-theme = { path = "../../libs/wm_theme" }
makepad-wm-api = { path = "../../libs/wm_api" }

[target.'cfg(windows)'.dependencies.windows]
package = "makepad-windows-sys"
path = "../../libs/windows/sys"
version = "0.1.0"
