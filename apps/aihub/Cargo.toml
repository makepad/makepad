[package]
name = "makepad-app-aihub"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
publish = false
description = "AI Hub: serves this machine's AI (the sandboxed Claude backend, local models) to the fleet while it runs, with its control panel and tray icon"

[[bin]]
name = "makepad-app-aihub"
path = "src/main.rs"

[features]
# The local model runtime (chat models on Metal / CPU). Speech is left out: it would
# reach for the OS speech engines.
default = ["localai"]
localai = ["makepad-ai-hub/localai"]
# A makepad WM node's hub (the WM starts the app with `--features node`): every local model
# backend the headless node hub (apps/ai-hub) builds by default, CUDA kernels included where
# MAKEPAD_CUDA_ROOT names a toolkit. A Mac keeps the lean default.
node = ["localai", "makepad-ai-hub/flux", "makepad-ai-hub/paint", "makepad-ai-hub/paint-cuda", "makepad-ai-hub/llm",
    "makepad-ai-hub/tts", "makepad-ai-hub/indextts", "makepad-ai-hub/speech", "makepad-ai-hub/stt", "makepad-ai-hub/video",
    "makepad-ai-hub/interpolate", "makepad-ai-hub/audio", "makepad-ai-hub/mesh", "makepad-ai-hub/matte-native",
    "makepad-ai-hub/depth-native", "makepad-ai-hub/segment-native", "makepad-ai-hub/body-native", "makepad-ai-hub/upscale-native",
    "makepad-ai-hub/motion-native", "makepad-ai-hub/rig-native", "makepad-ai-hub/splat-native", "makepad-ai-hub/stems-native",
    "makepad-ai-hub/beats-native", "makepad-ai-hub/notes-native", "makepad-ai-hub/kernel"]
# TEST BUILDS ONLY: MAKEPAD_AI_HUB_CLAUDE_STUB=<fake claude> serves that fake CLI as the
# Claude backend (pool-node tests without anyone's login). Never in a shipped build.
claude-stub = ["makepad-ai-hub/claude-stub"]

[dependencies]
makepad-widgets = { path = "../../widgets", default-features = false }
makepad-shell-kit = { path = "../../libs/shell_kit" }
makepad-ai-hub-panel = { path = "../../libs/ai/hub_panel" }
makepad-ai-hub = { path = "../../libs/ai/hub", default-features = false }
makepad-network = { path = "../../platform/network" }
makepad-strict-json = { path = "../../libs/strict_json" }
