# Director: AI accounts, agent lanes with their terminals, editors and the disk map.

[package]
name = "makepad-director"
version = "2.0.0"
edition = "2021"
default-run = "director"

[lib]
name = "makepad_director"
path = "src/lib.rs"

[[bin]]
name = "director"
path = "src/main.rs"

[[bin]]
name = "director-git-guard"
path = "src/bin/director_git_guard.rs"
test = false
bench = false

[[bin]]
name = "director-rustc-guard"
path = "src/bin/director_rustc_guard.rs"
test = false
bench = false

[[bin]]
name = "director-flow"
path = "src/bin/director_flow.rs"
test = false
bench = false

[features]
default = ["tweaker"]
# The design overlay (Shift+F10 with the dev overlays on). On for development
# builds; the Builder's releases build without it (--no-default-features).
tweaker = ["makepad-widgets/tweaker"]
# The machine's own model in this window's chat (Qwen on the local
# runtime). Off by default: the chat offers the Claude Code / Codex CLIs,
# Claude Desktop (MCP) and the Claude API. `--features localai` adds it.
localai = ["makepad-aichat/localai"]

[dependencies]
makepad-widgets = { path = "../../widgets", default-features = false, features = ["data", "dock"] }
makepad-diskmap = { path = "../../libs/diskmap" }
makepad-workspace = { path = "../../libs/workspace" }
# Without the terminal app's defaults: the design overlay is this app's own
# `tweaker` feature.
makepad-terminal = { path = "../terminal", default-features = false }
makepad-wm-theme = { path = "../../libs/wm_theme" }
makepad-wm-api = { path = "../../libs/wm_api" }
makepad-aichat = { path = "../aichat", default-features = false, features = ["engine"] }
makepad-ai-services = { path = "../../libs/ai/services" }
makepad-strict-json = { path = "../../libs/strict_json" }

makepad-code-editor = { path = "../../code_editor" }
makepad-code-arch = { path = "../../libs/code_arch" }
makepad-git = { path = "../../libs/git" }

[target.'cfg(any(target_os = "macos", target_os = "linux", windows))'.dependencies]
makepad-agents = { path = "../../tools/agents" }

[dev-dependencies]
makepad-draw = { path = "../../draw" }
