# amp (Makepad Amp) — one music player for the music systems installed on this
# machine (README.md). Each system is a `MusicSource` (src/source): Spotify is
# driven through the CLI Spotify.app ships (or its desktop player's own
# protocol) and plays in Spotify.app itself; local files play in Amp. The
# screen shows a spectrum or the visualizer (libs/milkdrop).

[package]
name = "makepad-app-amp"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
description = "Makepad Amp: a music player for Spotify and local files, with an equalizer and a visualizer"
default-run = "makepad-app-amp"

[[bin]]
name = "makepad-app-amp"
path = "src/main.rs"

[features]
default = ["tweaker"]
# The design overlay (Shift+F10 with the dev overlays on). On for development
# builds; the Builder's releases build without it (--no-default-features).
tweaker = ["dep:makepad-widgets-tweaker", "makepad-widgets/data", "makepad-widgets/dock", "makepad-widgets/fab"]

[dependencies]
makepad-widgets = { path = "../../widgets", default-features = false, features = ["charts", "color", "data"] }
makepad-widgets-tweaker = { path = "../../widgets/families/tweaker", optional = true }
makepad-widgets-feedback = { path = "../../widgets/feedback" }
makepad-micro-serde = { path = "../../libs/micro_serde" }
makepad-audio-route = { path = "../../libs/audio_route" }
makepad-audio-picture = { path = "../../libs/audio_picture" }
makepad-audio-decode = { path = "../../libs/audio_decode" }
makepad-search = { path = "../../libs/search" }
makepad-milkdrop = { path = "../../libs/milkdrop" }
# The AI stylist: the chat panel (the person's own Claude Code / Codex through
# the hub's CLI providers) and the service its tools ride on.
makepad-app-aichat = { path = "../aichat", default-features = false, features = ["engine"] }
makepad-ai-services = { path = "../../libs/ai/services" }
makepad-strict-json = { path = "../../libs/strict_json" }

[dev-dependencies]
makepad-script-test = { path = "../../platform/script/test" }

# Writes the small tagged Ogg files the local-files tests scan.
makepad-audio-encode = { path = "../../libs/audio_encode" }

[package.metadata.makepad.desktop]
name = "Makepad Amp"
identifier = "nl.makepad.amp"
icon = "resources/amp-icon.png"

# The equalizer taps Spotify.app's output; macOS asks once.
[package.metadata.makepad.desktop.usage]
audio_capture = "Makepad Amp plays Spotify's sound through its equalizer and shows it as a spectrum."
