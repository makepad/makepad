# fal — a window onto Fal, the hosted generative-media service: paste an API
# key, run any Fal model through its queue API, and sweep every text-to-image
# model once to see which answer fastest.
#
# Everything goes through the platform's own HTTP requests; the key lives in
# ~/.makepad/fal/key (or FAL_KEY) and only ever travels in the Authorization
# header to Fal's own hosts.

[package]
name = "makepad-app-fal"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
default-run = "makepad-app-fal"

[[bin]]
name = "makepad-app-fal"
path = "src/main.rs"

[features]
default = ["tweaker", "standalone"]
# The design overlay (Shift+F10 with the dev overlays on). On for development
# builds; the Runner's releases build without it (--no-default-features).
tweaker = ["dep:makepad-widgets-tweaker", "makepad-widgets/data", "makepad-widgets/dock", "makepad-widgets/fab"]
# The standalone window (src/main.rs).
standalone = []

[dependencies]
makepad-widgets = { path = "../../widgets", default-features = false }
makepad-widgets-tweaker = { path = "../../widgets/families/tweaker", optional = true }
# Fal's replies, the model catalog's OpenAPI documents and the request bodies.
makepad-strict-json = { path = "../../libs/strict_json" }
# `sync_mode` results carry their files as base64 data URIs.
makepad-base64 = { path = "../../libs/base64" }
