# Studio: one live workspace presented as structured tabs or a zoomable canvas.

[package]
name = "makepad-studio"
version = "2.0.0"
edition = "2021"
default-run = "studio"

[lib]
name = "makepad_studio"
path = "src/lib.rs"

[[bin]]
name = "studio"
path = "src/main.rs"

[[bin]]
name = "studio-git-guard"
path = "src/bin/studio_git_guard.rs"
test = false
bench = false

[[bin]]
name = "studio-rustc-guard"
path = "src/bin/studio_rustc_guard.rs"
test = false
bench = false

[[bin]]
name = "studio-flow"
path = "src/bin/studio_flow.rs"
test = false
bench = false

[dependencies]
makepad-widgets = { path = "../../widgets" }
makepad-diskmap = { path = "../../libs/diskmap" }
makepad-terminal = { path = "../terminal" }
makepad-wm-theme = { path = "../../libs/wm_theme" }
makepad-wm-api = { path = "../../libs/wm_api" }
makepad-aichat = { path = "../aichat", default-features = false, features = ["engine"] }
makepad-ai-services = { path = "../../libs/ai/services" }
makepad-strict-json = { path = "../../libs/strict_json" }
makepad-bounded-http = { path = "../../libs/bounded_http" }

makepad-code-editor = { path = "../../code_editor" }
makepad-code-graph = { path = "../../libs/code_graph" }
makepad-code-atlas = { path = "../../libs/code_atlas" }
makepad-code-arch = { path = "../../libs/code_arch" }
makepad-git = { path = "../../libs/git" }

[target.'cfg(windows)'.dependencies]
makepad-screen = { path = "../../tools/screen" }

[dev-dependencies]
makepad-draw = { path = "../../draw" }
