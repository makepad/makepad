# wm-all — the window manager with its apps linked in: one process,
# every app an in-process module in a splash isolate of its own, drawn
# into the desk's own texture. The build for a platform that has no
# child processes (iOS), and the way to test that build on a desktop in
# the iOS skin. Nothing of the desk lives here: this crate is the
# `WmBuild` (which app crates, no processes, the iOS style, the assistant
# in-process) around `makepad-app-wm`'s App.
#
# iOS simulator: cargo makepad apple ios --org=nl.makepad --app=wmall
#   run-sim -p makepad-app-wm-all --release
# macOS (the iOS skin): cargo build --release -p makepad-app-wm-all, then
#   target/release/makepad-app-wm-all from the repo root.

[package]
name = "makepad-app-wm-all"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
default-run = "makepad-app-wm-all"

[[bin]]
name = "makepad-app-wm-all"
path = "src/main.rs"

[features]
default = ["tweaker"]
# The design overlay (Shift+F10 with the dev overlays on). On for development
# builds; the Builder's releases build without it (--no-default-features).
tweaker = ["makepad-app-wm/tweaker"]
# The pane's chat with the machine's own model (Qwen on the local runtime)
# and the chat backends. Off by default: the in-process pane has no model
# (NoModel and the tool console). `--features localai` adds both.
localai = ["makepad-app-aichat/localai"]

[dependencies]
# Without the window manager's defaults: the design overlay is this app's
# own `tweaker` feature.
makepad-app-wm = { path = "../wm", default-features = false }
makepad-widgets = { path = "../../widgets", default-features = false }
makepad-app-module = { path = "../../libs/app_module" }
# The apps, as modules only: no standalone window, no model runtime.
makepad-app-sheets = { path = "../sheets", default-features = false }
makepad-app-photos = { path = "../photos", default-features = false }
makepad-app-files = { path = "../files", default-features = false }
makepad-app-route = { path = "../route", default-features = false }
makepad-app-finance = { path = "../finance", default-features = false }
makepad-app-clock = { path = "../clock", default-features = false }
makepad-app-weather = { path = "../weather", default-features = false }
makepad-app-mail = { path = "../mail", default-features = false }
makepad-app-notes = { path = "../notes", default-features = false }
makepad-app-calendar = { path = "../calendar", default-features = false }
makepad-app-reminders = { path = "../reminders", default-features = false }
makepad-app-calculator = { path = "../calculator", default-features = false }
# The assistant seated in the pane in-process. Without the engine: no
# model runtime in this build — NoModel and the tool console.
makepad-app-aichat = { path = "../aichat", default-features = false }
