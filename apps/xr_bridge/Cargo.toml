[package]
name = "makepad-app-xr-bridge"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"

[dependencies]
makepad-widgets = { path = "../../widgets", default-features = false }
makepad-xr-stream = { path = "../../libs/xr_stream" }

# the bridge and its IPC (src/bridge.rs, src/ipc.rs) run on Linux only
[target.'cfg(target_os = "linux")'.dependencies]
makepad-xr-runtime = { path = "../../libs/xr_runtime" }
