[package]
name = "makepad-app-score"
version = "0.1.0"
edition = "2021"
description = "Makepad Score professional notation editor and pianist viewer"
license = "MIT OR Apache-2.0"

[features]
default = ["tweaker"]
# The design overlay (Shift+F10 with the dev overlays on). On for development
# builds; the Builder's releases build without it (--no-default-features).
tweaker = ["makepad-widgets/tweaker"]

[dependencies]
makepad-widgets = { path = "../../widgets", version = "2.0.0", default-features = false }
makepad-score-ui = { path = "../../libs/score_ui", version = "0.1.0" }

