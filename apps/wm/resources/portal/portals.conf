# The makepad WM's portal backend (apps/wm/src/portal.rs) answers Settings (dark mode) and
# FileChooser (browsers' open/save dialogs show the WM's picker);
# everything else keeps the gtk backend. Install as ~/.config/xdg-desktop-portal/portals.conf
# and as ~/.config/xdg-desktop-portal/<XDG_CURRENT_DESKTOP>-portals.conf (a desktop-specific
# file is read before the generic one).
[preferred]
default=gtk
org.freedesktop.impl.portal.Settings=makepad
org.freedesktop.impl.portal.FileChooser=makepad
