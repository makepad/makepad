# video — a dumb video player, part of the Makepad app family (terminal, wm,
# files, image, task, sheets, route, mixer...).
#
# `video <path>` opens one clip fit-to-window on a system theme
# background and plays it, sound and all. Space pauses, Left/Right seek
# ±5s (Shift ±30s), Up/Down set the volume, M mutes, F hides the chrome,
# Escape/Q quits; the glass controls (makepad-widgets' PlayerControls) do
# the same by pointer, and a double tap on a side skips 10 s. `--preview <path>` sizes the window as a
# popup — that is files' Quick Look. `--mute` (or MAKEPAD_VIDEO_MUTE=1, or a
# hidden window) starts silent, so a test run never talks at whoever is
# sitting at the machine.
#
# Playback is makepad-widgets' VideoPlayer: the platform's own player
# (AVFoundation, GStreamer, Media Foundation, Android MediaPlayer) plays the
# file, sound included, so the same app runs on the phone; the app adds its
# keyboard, the status line and the Quick Look warm viewer.

[package]
name = "makepad-app-video"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
default-run = "makepad-app-video"

[lib]
name = "makepad_app_video"
path = "src/lib.rs"

[[bin]]
name = "makepad-app-video"
path = "src/main.rs"

[features]
default = ["tweaker"]
# The design overlay (Shift+F10 with the dev overlays on). On for development
# builds; the Builder's releases build without it (--no-default-features).
tweaker = ["dep:makepad-widgets-tweaker", "makepad-widgets/data", "makepad-widgets/dock", "makepad-widgets/fab"]

[dependencies]
makepad-widgets = { path = "../../widgets", default-features = false, features = ["media"] }
makepad-widgets-tweaker = { path = "../../widgets/families/tweaker", optional = true }
makepad-wm-api = { path = "../../libs/wm_api" }
