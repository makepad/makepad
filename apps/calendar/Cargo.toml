# calendar — part of the Makepad app family: standalone window, and a module
# (src/module.rs) the window manager seats in-process. Spec of record:
# local/agent_state/wm-all/apps/calendar-redesign.md; contract: .../CONTRACT.md.

[package]
name = "makepad-calendar"
version = "0.1.0"
edition = "2021"
default-run = "calendar"

[lib]
name = "makepad_calendar"
path = "src/lib.rs"

[[bin]]
name = "calendar"
path = "src/main.rs"
required-features = ["standalone"]

[features]
dynamic-module = []
default = ["tweaker", "standalone"]
# The design overlay (Shift+F10 with the dev overlays on). On for development
# builds; the Builder's releases build without it (--no-default-features).
tweaker = ["makepad-widgets/tweaker"]
# The standalone window (src/main.rs); a host that links the module leaves it off.
standalone = []

[dependencies]
makepad-widgets = { path = "../../widgets", default-features = false, features = ["glass"] }
makepad-wm-theme = { path = "../../libs/wm_theme" }
makepad-ai-services = { path = "../../libs/ai/services" }
makepad-app-module = { path = "../../libs/app_module" }
makepad-strict-json = { path = "../../libs/strict_json" }
makepad-civil-time = { path = "../../libs/civil_time" }
