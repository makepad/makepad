# mpimage — a dumb picture viewer, part of the mp* app family (mpterm,
# mpwm, mpfiles, mptask, mpsheets, route, mixer...).
#
# Opens one image fit-to-window, centered on a dark mp_theme background.
# Left/Right walks the sorted sibling images in the same folder, +/-/wheel
# zoom around the cursor, 0 fits, 1 shows 100%, drag pans when zoomed,
# Escape/Q/Space quits. `--preview <path>` sizes the window as a popup.

[package]
name = "mpimage"
version = "0.1.0"
edition = "2021"
default-run = "mpimage"

[lib]
name = "mpimage"
path = "src/lib.rs"

[[bin]]
name = "mpimage"
path = "src/main.rs"

[dependencies]
makepad-widgets = { path = "../../widgets" }
mp-theme = { path = "../../libs/mp_theme" }
mp-wm-api = { path = "../../libs/mp_wm_api" }
