# makepad-code: Makepad Code in a terminal. A plain Rust binary on the agent
# core (makepad-code-agent): std, termios and ANSI only, no window, no GPU,
# so it runs over ssh or on a bare console.

[package]
name = "makepad-code"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
description = "Makepad Code in the terminal: an interactive coding agent, or one task with -p"

# On Windows the binary is a stub that says it is not supported there (no termios); the
# windows bucket keeps that stub building with no warnings.
[package.metadata.makepad.platform-gaps]
windows = {}

[[bin]]
name = "makepad-code"
path = "src/main.rs"

# (Unix only: the Windows stub uses none of them)
[target.'cfg(unix)'.dependencies]
makepad-code-agent = { path = "../agent" }
makepad-cell-width = { path = "../../../libs/cell_width" }
