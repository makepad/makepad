# Desk Host — Desk Link's server for a plain macOS or Windows desktop (the logged-in user's
# session): the screen as hardware H.264, input as local events, the same protocol, TLS and
# fleet credentials as the window manager's server. No window; off unless configured.

[package]
name = "makepad-app-deskhost"
version = "0.1.0"
edition = "2021"
license = "MIT"

[[bin]]
name = "makepad-app-deskhost"
path = "src/main.rs"

[dependencies]
makepad-desk-link = { path = "../../libs/desk_link", features = ["server"] }
makepad-platform-video = { path = "../../platform/video" }
makepad-key-code = { path = "../../platform/key_code" }

[target.'cfg(target_os = "macos")'.dependencies]
makepad-apple-sys = { path = "../../libs/apple_sys" }
makepad-objc-sys = { path = "../../libs/objc-sys" }

[target.'cfg(target_os = "windows")'.dependencies]
makepad-hal = { path = "../../platform/hal" }
makepad-windows-sys = { path = "../../libs/windows/sys" }
