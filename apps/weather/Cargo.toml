# weather — a small Makepad app with two resident faces: the full forecast
# view and a compact home-widget tile, both fed by one Open-Meteo fetch over
# the platform's HTTP API. The WM picks the face on the same window/swapchain
# via `HostedView`; one process, one model — or, hosted in-process, one
# module instance in its own isolate (src/module.rs).

[package]
name = "makepad-weather"
version = "0.1.0"
edition = "2021"
default-run = "weather"

[[bin]]
name = "weather"
path = "src/main.rs"
required-features = ["standalone"]

[lib]
name = "makepad_weather"
path = "src/lib.rs"

[features]
dynamic-module = []
default = ["tweaker", "standalone"]
# The design overlay (Shift+F10 with the dev overlays on). On for development
# builds; the Builder's releases build without it (--no-default-features).
tweaker = ["makepad-widgets/tweaker"]
# The standalone window: the F10 overlay and the port toward it. A host
# that links the MODULE (makepad-wm) leaves this off and gets the lib only.
standalone = ["dep:makepad-aichat", "dep:makepad-wm-api"]
# The machine's own model in this window's chat (Qwen on the local
# runtime). Off by default: the chat offers the Claude Code / Codex CLIs,
# Claude Desktop (MCP) and the Claude API. `--features localai` adds it.
localai = ["makepad-aichat?/localai"]

[dependencies]
makepad-widgets = { path = "../../widgets", default-features = false, features = ["glass"] }
makepad-wm-theme = { path = "../../libs/wm_theme" }
# The assistant: the F10 overlay in this window, and the forecast's one tool.
makepad-aichat = { path = "../aichat", default-features = false, features = ["engine"], optional = true }
# The window manager's vocabulary for the standalone window: the bar's
# title and the polite close (the module has no window of its own).
makepad-wm-api = { path = "../../libs/wm_api", optional = true }
makepad-ai-services = { path = "../../libs/ai/services" }
# The module contract: what the window manager seats in-process (src/module.rs).
makepad-app-module = { path = "../../libs/app_module" }
