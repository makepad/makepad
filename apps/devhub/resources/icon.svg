<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <!-- devhub: the fleet hub. A central node with five machines linked around it, a calm pulse ring
       around the hub (the live event feed), one machine lit (the one that just spoke). The tray
       glyph (libs/devhub/src/tray_glyph.rs, preview source tray.svg) is the same hub and
       satellites as a menu-bar template. The shared app icon tile (x/y 64, 896, radius 200);
       tools/app_icons/render.sh renders it to icon_1024.png. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1b3354"/>
      <stop offset="1" stop-color="#0b1627"/>
    </linearGradient>
    <linearGradient id="sheen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.10"/>
      <stop offset="0.5" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="g" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#7ef0da"/><stop offset="1" stop-color="#3fc9b0"/></linearGradient>
  </defs>
  <rect x="64" y="64" width="896" height="896" rx="200" fill="url(#bg)"/>
  <rect x="64" y="64" width="896" height="896" rx="200" fill="url(#sheen)"/>
  <rect x="66" y="66" width="892" height="892" rx="198" fill="none" stroke="#ffffff" stroke-opacity="0.08" stroke-width="4"/>
  <!-- the fleet ring, the pulse rings, and the links into the hub -->
  <circle cx="512" cy="512" r="300" fill="none" stroke="#4aa3e0" stroke-opacity="0.22" stroke-width="10"/>
  <circle cx="512" cy="512" r="190" fill="none" stroke="#7ef0da" stroke-opacity="0.16" stroke-width="12"/>
  <circle cx="512" cy="512" r="152" fill="none" stroke="#7ef0da" stroke-opacity="0.30" stroke-width="12"/>
  <path d="M512 512 L512.0 212.0 M512 512 L797.3 419.3 M512 512 L688.3 754.7 M512 512 L335.7 754.7 M512 512 L226.7 419.3" stroke="#4aa3e0" stroke-width="26" stroke-linecap="round"/>
  <!-- the machines -->
  <g fill="#4aa3e0" stroke="#0e1d33" stroke-width="14"><circle cx="512.0" cy="212.0" r="64"/><circle cx="688.3" cy="754.7" r="64"/><circle cx="335.7" cy="754.7" r="64"/><circle cx="226.7" cy="419.3" r="64"/></g>
  <circle cx="797.3" cy="419.3" r="64" fill="url(#g)" stroke="#0e1d33" stroke-width="14"/>
  <!-- the hub -->
  <circle cx="512" cy="512" r="124" fill="#0e1d33"/>
  <circle cx="512" cy="512" r="100" fill="url(#g)"/>
</svg>
