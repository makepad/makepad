<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <!-- devhub: an eye that watches the network. Three nodes link into the eye (the hub observing
       every machine's JITs), a pulse line under it (the live event feed). The tray glyph
       (apps/devhub/src/glyph.rs) is the same eye and nodes as a menu-bar template.
       The shared app icon tile (x/y 64, 896, radius 200); tools/app_icons/render.sh renders it
       to icon_1024.png. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1b3354"/>
      <stop offset="1" stop-color="#0b1627"/>
    </linearGradient>
    <linearGradient id="sheen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.10"/>
      <stop offset="0.5" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="g" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#7ef0da"/><stop offset="1" stop-color="#3fc9b0"/></linearGradient>
  </defs>
  <rect x="64" y="64" width="896" height="896" rx="200" fill="url(#bg)"/>
  <rect x="64" y="64" width="896" height="896" rx="200" fill="url(#sheen)"/>
  <rect x="66" y="66" width="892" height="892" rx="198" fill="none" stroke="#ffffff" stroke-opacity="0.08" stroke-width="4"/>
  <!-- the nodes and their links, which run into the eye -->
  <g stroke="#4aa3e0" stroke-width="30" stroke-linecap="round">
    <path d="M512 500 L280 250 M512 500 L512 196 M512 500 L744 250"/>
  </g>
  <g fill="#4aa3e0"><circle cx="280" cy="250" r="58"/><circle cx="512" cy="196" r="58"/><circle cx="744" cy="250" r="58"/></g>
  <!-- the eye -->
  <path d="M212 520 Q512 250 812 520 Q512 790 212 520 Z" fill="#0e1d33" stroke="#4aa3e0" stroke-width="36" stroke-linejoin="round"/>
  <circle cx="512" cy="520" r="112" fill="url(#g)"/>
  <circle cx="512" cy="520" r="48" fill="#0e1d33"/>
  <circle cx="546" cy="488" r="16" fill="#ffffff" fill-opacity="0.85"/>
  <!-- the pulse -->
  <path d="M232 806 L404 806 L446 742 L496 870 L540 760 L574 806 L792 806" fill="none" stroke="url(#g)" stroke-width="30" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
