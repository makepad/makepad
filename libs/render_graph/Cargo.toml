[package]
name = "makepad-render-graph"
version = "0.1.0"
edition = "2021"
description = "The render graph: post passes, HDR composite, locked-time accumulation"
license = "MIT OR Apache-2.0"

[features]
# The GPU side (passes, accumulation, the Sandbox lane's bloom and
# composite). Without it: the plan, the schedules, the locked-time rules,
# pass declarations and the kits' Splash source, for UI-free document
# readers.
default = ["gpu"]
gpu = ["dep:makepad-draw", "dep:makepad-script-compute", "dep:makepad-tween-script"]

[dependencies]
makepad-script = { path = "../../platform/script" }
makepad-draw = { path = "../../draw", version = "2.0.0", optional = true }
makepad-script-compute = { path = "../../platform/script/compute", features = ["vm"], optional = true }
makepad-tween-script = { path = "../tween/script", optional = true }
