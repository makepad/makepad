[package]
name = "makepad-wasm-strip-spec"
version = "0.1.0"
edition = "2021"
description = "The WebAssembly core spec testsuite against makepad-wasm-strip's validator and optimiser"
license = "MIT OR Apache-2.0"
publish = false

# Outside the workspace (Cargo.toml workspace.exclude): the spec scripts need a full WAT/WAST parser
# (the `wast` crate), which the repo does not carry -- run it where that crate is available:
#   cargo test --release --manifest-path libs/wasm_strip/spec/Cargo.toml
[workspace]

[dependencies]
makepad-stitch = { path = "../../stitch" }
makepad-wasm-strip = { path = ".." }

[dev-dependencies]
wast = "200.0.0"
