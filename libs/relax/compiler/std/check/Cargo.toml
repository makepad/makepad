# rustc-side half of Relax's std tests: builds the std's implementation modules against real
# std (lang items, Option, Box, closures stay real) so their behaviour is checked differentially
# before Relax can compile them. Not a workspace member.
[package]
name = "relax-std-check"
version = "0.0.0"
edition = "2021"
publish = false

[lib]
path = "src/lib.rs"
doctest = false

[[bin]]
name = "relax-std-gen"
path = "src/gen.rs"

[workspace]

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(relax_check)'] }

[profile.release]
debug = false
