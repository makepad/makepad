# rustc-side half of the std-os lane's differential tests: mounts Relax's std OS modules
# (std/std/{sys,sync,thread,time,io,fs,path,env,process,ffi,os,panic}) and the lane's core
# files (core/{time.rs,sync/atomic.rs,ffi}) over real core/alloc, so their behaviour can be
# compared with real std before Relax compiles them. Not a workspace member.
[package]
name = "relax-std-os-check"
version = "0.0.0"
edition = "2021"
publish = false

[lib]
path = "src/lib.rs"
doctest = false

[workspace]

[lints.rust]
unexpected_cfgs = { level = "allow" }

[profile.release]
debug = false
