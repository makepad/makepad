[package]
name = "relax-base"
version = "0.1.0"
edition = "2021"
description = "Relax base layer (see src/lib.rs)"
license = "MIT OR Apache-2.0"
publish = false

# files outside this crate its build reads
[package.metadata.commercial]
include = ["../self_stamp.rs"]

[package.metadata.makepad.platform-gaps]
windows = { "lib" = "4 of 204 fail there: root resolution (2), progenv, dirs" }

[dependencies]
makepad-cpu-budget = { workspace = true }
relax-lex = { workspace = true }
relax-session = { workspace = true }

[target.'cfg(windows)'.dependencies]
makepad-windows-sys = { path = "../../windows/sys", version = "0.1.0" }

[lints.rust]
# `cfg(relax)`: set when makepad run (Relax) compiles the crate
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(relax)"] }
