[package]
name = "relax-front"
version = "0.1.0"
edition = "2021"
description = "Relax front layer (see src/lib.rs)"
license = "MIT OR Apache-2.0"
publish = false

# files outside this crate its build reads (makepad-source-slice ships them in a slice or source archive)
[package.metadata.commercial]
include = ["../self_stamp.rs", "../base/src/sha256.rs"]

[package.metadata.makepad.platform-gaps]
windows = { "lib" = "9 of 129 fail there: native (4), unit-graph scripts (3), lazy preload, builtins payload" }

[dependencies]
relax-base = { workspace = true }
relax-session = { workspace = true }
