[package]
name = "makepad-ai-speech"
version = "0.1.0"
edition = "2021"
description = "IndexTTS-2.5 speech family (kokoro joins in T6d). Split out of libs/diffusion (lane T6, /aiarch.md)."
license = "MIT"

[dependencies]
makepad-ai-common = { path = "../common" }
makepad-ai-loader = { path = "../../loader" }
makepad-ggml = { path = "../../../ggml", features = ["metal-precompile"] }
makepad-ai-sfx = { path = "../sfx" }
