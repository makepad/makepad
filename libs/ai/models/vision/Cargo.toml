[package]
name = "makepad-ai-vision"
version = "0.1.0"
edition = "2021"
description = "SAM3 / BiRefNet / DA3 / Real-ESRGAN vision family. Split out of libs/diffusion (lane T6, /aiarch.md)."
license = "MIT"

[dependencies]
makepad-ai-common = { path = "../common" }
makepad-ai-loader = { path = "../../loader" }
makepad-ai-flux = { path = "../flux" }
# The multi-view stereo behind scan-mvs.
makepad-ai-geometry = { path = "../geometry", optional = true }
# The CUDA kernels (makepad-ai-cuda `cuda`), for the validator bins run on a GPU box.
makepad-ai-cuda = { path = "../../cuda", optional = true }

[features]
cuda = ["dep:makepad-ai-cuda", "makepad-ai-cuda/cuda", "dep:makepad-ai-geometry", "makepad-ai-geometry/cuda"]

[[bin]]
name = "mapanything-validate"
path = "src/bin/mapanything_validate.rs"

[[bin]]
name = "scan-eval"
path = "src/bin/scan_eval.rs"

[[bin]]
name = "scan-export"
path = "src/bin/scan_export.rs"

[[bin]]
name = "scan-mvs"
path = "src/bin/scan_mvs.rs"
required-features = ["cuda"]
