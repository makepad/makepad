[package]
name = "makepad-ai-sing"
version = "0.1.0"
edition = "2021"
description = "Cantor: a neural singing voice. Score notes + lyrics -> frames -> mel (conformer + flow refiner) -> waveform (harmonic-plus-noise source-filter vocoder). One model definition for inference and training."
license = "MIT"

[features]
default = []
# Lyrics -> phonemes with the speech family's English G2P (lexicon + rules).
g2p = ["dep:makepad-ai-speech"]
# sing_eval: held-out word error rate through our speech recogniser.
eval = ["g2p", "makepad-ai-speech/whisper"]

[dependencies]
# The matmul gateway: Metal on macOS, cuBLAS on Linux with the CUDA store,
# None elsewhere (the CPU loops in nn.rs are the reference).
makepad-ai-metal = { path = "../../metal", features = ["metal-precompile"] }
makepad-ai-speech = { path = "../speech", default-features = false, features = ["kokoro"], optional = true }

# The device-resident training backend (nn_gpu.rs): the CUDA store's
# training kernels. Linux/Windows only, like the store itself.
[target.'cfg(any(target_os = "linux", target_os = "windows"))'.dependencies]
makepad-ai-cuda = { path = "../../cuda" }

[[bin]]
name = "sing_render"
path = "src/bin/sing_render.rs"

[[bin]]
name = "sing_train"
path = "src/bin/sing_train.rs"

[[bin]]
name = "sing_prep"
path = "src/bin/sing_prep.rs"
required-features = ["g2p"]

[[bin]]
name = "sing_eval"
path = "src/bin/sing_eval.rs"
required-features = ["eval"]
