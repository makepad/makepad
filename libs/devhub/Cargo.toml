[package]
name = "makepad-devhub"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
publish = false
description = "devhub: observes every JIT on the LAN (events, explorer, full remote inspect for the master), one app with master and node roles"

# `makepad devhub <words>` is this binary (the JIT binary forwards to it through cargo): a devhub change
# never rebuilds the JIT, and a JIT change never rebuilds devhub
[[bin]]
name = "makepad-devhub"
path = "src/main.rs"
required-features = ["checkout"]

[dependencies]
relax-base = { workspace = true, optional = true }
makepad-ci-merge = { path = "../../tools/ci_merge" }
makepad-ci-judge = { path = "../ci_judge", optional = true }
makepad-network = { path = "../../platform/network" }
makepad-devhub-conf = { path = "../devhub_conf" }
makepad-remote = { workspace = true }
makepad-strict-json = { workspace = true }
makepad-toml-parser = { path = "../toml_parser" }
makepad-core-util = { path = "../core_util" }
makepad-civil-time = { path = "../civil_time" }
# sync: launches and prebuilds use the WM's own launch commands and environment
makepad-app-registry = { path = "../app_registry", optional = true }
# the worktree monitor (dirty sets without scans): FSEvents / inotify / ReadDirectoryChangesW
makepad-filesystem-watcher = { path = "../filesystem_watcher", optional = true }

[features]
# the checkout applier (desktop nodes: git, prebuild, launches, the master CLI); a JIT host with no
# checkout (tools/run/android_host) builds without it and installs its source store instead
default = ["checkout"]
checkout = ["dep:relax-base", "dep:makepad-app-registry", "dep:makepad-filesystem-watcher", "dep:makepad-ci-judge"]

# the hosted wire's fingerprint: a box's WM must speak it for gui work (caps::display)
[target.'cfg(target_os = "linux")'.dependencies]
makepad-studio-protocol = { path = "../../platform/studio" }

[target.'cfg(windows)'.dependencies.windows]
package = "makepad-windows-sys"
path = "../windows/sys"
version = "0.1.0"
