[package]
name = "makepad-ggml"
version = "0.1.0"
edition = "2021"
description = "Metal-first, backend-neutral ggml runtime for Makepad"
license = "MIT"

[features]
default = []
# Forwarded to makepad-ai-metal's own `metal-precompile` feature so
# CARGO_FEATURE_METAL_PRECOMPILE reaches ITS build.rs — the metallib build
# (build_metallib + helpers) moved there in lane T5 (/aiarch.md §1 + §8b).
metal-precompile = ["makepad-ai-metal/metal-precompile"]

[dependencies]
# Must not be target-specific: when this crate is a path dep of another
# standalone `[workspace]` (diffusion), cargo 1.92 drops target-cfg deps
# and rustc reports `no external crate makepad_cuda`.
makepad-cuda = { path = "../cuda" }
# Direct dep (in addition to the makepad-cuda facade above) so its
# `links = "makepad_ai_cuda"` metadata reaches this crate's build.rs as
# DEP_MAKEPAD_AI_CUDA_KERNELS — links-metadata only flows to IMMEDIATE
# dependents. THE CUDA store (kernels + nvcc build), absorbed lane T4,
# /aiarch.md §1 + §4. Same "must not be target-specific" reasoning as
# makepad-cuda above.
makepad-ai-cuda = { path = "../ai/cuda" }
# THE Metal shader store (ggml-metal.metal + impl headers + mlx steel_qmm +
# the metallib build), absorbed lane T5, /aiarch.md §1 + §8b. Direct dep so
# its `links = "makepad_ai_metal"` metadata reaches this crate's build.rs
# as DEP_MAKEPAD_AI_METAL_METALLIB / DEP_MAKEPAD_AI_METAL_SHADER_DIR.
# Unconditional (not target-gated): same cargo-1.92 "must not be
# target-specific" reasoning as makepad-cuda above — on non-macos targets
# makepad-ai-metal's build.rs is a clean no-op (no metallib, no shader_dir).
makepad-ai-metal = { path = "../ai/metal" }
# TensorType/GGML_TYPE_*/block_size/block_elements/MappedRegion live in the
# loader now (lane T2, /aiarch.md §1); this crate re-exports them at their
# original paths. Own `[workspace]` like ../mlx, reached via path dep.
makepad-ai-loader = { path = "../ai/loader" }

[target.'cfg(any(target_os = "macos", target_os = "ios"))'.dependencies]
makepad-objc-sys = { path = "../objc-sys", version = "1.0.0" }
smallvec = { path = "../smallvec" }

[[bin]]
name = "q4-mm-bench"
path = "src/bin/q4_mm_bench.rs"

[[bin]]
name = "flash-attn-bench"
path = "src/bin/flash_attn_bench.rs"

[[bin]]
name = "steel-qmm-bench"
path = "src/bin/steel_qmm_bench.rs"

[workspace]
