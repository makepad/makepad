[package]
name = "relax-api"
version = "1.0.0"
authors = ["Makepad <info@makepad.nl>"]
edition = "2021"
description = "Makepad #[relax_api]: the interface a provided crate offers to Relax-compiled code"
license = "MIT OR Apache-2.0"
repository = "https://github.com/makepad/makepad/"

[dependencies]
relax-api-macro = { path = "macro", version = "1.0.0" }
# the host shims' run and kept guards (run_op, host_op, process_heap)
makepad-alloc-phase = { path = "phase", version = "1.0.0", optional = true }

[target.'cfg(target_vendor = "apple")'.dependencies]
# sync's Mutex and Condvar on Apple's platforms
makepad-alloc-phase = { path = "phase", version = "1.0.0" }

[features]
# entries(): the table reader (only the `makepad` loader enables it)
host-shims = ["dep:makepad-alloc-phase"]
