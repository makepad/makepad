[package]
name = "makepad-image-decode"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
description = "Pictures decoded to RGBA (PNG, JPEG, WebP, GIF, BMP, QOI, ICO; an animation's frames; upright as their EXIF says), with no platform"
homepage = "https://github.com/makepad/makepad/"
repository = "https://github.com/makepad/makepad/"

[dependencies]
makepad-zune-png = { version = "0.5.2", path = "../zune/zune-png" }
makepad-zune-jpeg = { version = "0.5.15", path = "../zune/zune-jpeg" }
makepad-zune-bmp = { version = "0.5.2", path = "../zune/zune-bmp" }
makepad-zune-qoi = { version = "0.5.2", path = "../zune/zune-qoi" }
makepad-webp = { version = "0.2.4", path = "../webp" }
makepad-gif = { version = "0.1.0", path = "../gif" }

[dev-dependencies]
jpeg-encoder = { path = "../jpeg-encoder" }
makepad-webp = { path = "../webp", features = ["encoder"] }
