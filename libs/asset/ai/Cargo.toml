[package]
name = "makepad-asset-ai"
version = "0.2.0"
edition = "2021"
description = "AI content generation service: wraps local GPU model runtimes (image/mesh/video/audio) behind an HTTP port, with on-demand HuggingFace model download"
license = "MIT OR Apache-2.0"

# Standalone workspace, same pattern as libs/diffusion: this crate pulls in
# platform/network and (optionally) libs/diffusion which is its own workspace,
# so it stays out of the root workspace member list.
[workspace]

[features]
# Native backends only. Python/Torch oracles stay off unless a box
# explicitly enables `python-backends`.
default = [
    "flux",
    "paint",
    "paint-cuda",
    "llm",
    "tts",
    "indextts",
    "video",
    "audio",
    "mesh",
    "matte-native",
    "depth-native",
    "segment-native",
    "motion-native",
    "rig-native",
]
# Box-provisioned Python/Torch reference backends (FlashWorld, Music3,
# Depth-Anything-3, and the rig/motion oracles). Not in default: a native
# service must not advertise or instantiate a Python runtime.
python-backends = []
# Real Flux image generation via libs/diffusion. Off by default so the service
# scaffold builds/tests everywhere without the ggml/mlx toolchain.
flux = ["dep:makepad-diffusion"]
# The generative-PBR paint domain: mesh GLB + reference image -> PBR-textured
# GLB + semantic maps + provenance manifest. Ships the deterministic
# "paint-test" tier everywhere. Default also enables `paint-cuda`, so a
# Windows/Linux fleet box advertises Hunyuan Paint and downloads weights
# like any other registry model.
paint = ["dep:makepad-ai-paint", "dep:makepad-gltf", "dep:makepad-remesh", "dep:makepad-xatlas"]
# Windows/Linux CUDA Hunyuan executor (in default).
paint-cuda = ["paint", "makepad-ai-paint/cuda-taps"]
# Real LLM prompt expansion via libs/llama (Qwen3.5/3.6 family GGUF on
# makepad-ggml). Off by default: the prompt assembly + artifact shaping in
# llm_backend.rs compiles and tests everywhere with a stubbed generation fn.
llm = ["dep:makepad-ai-llm"]
# Real Kokoro speech synthesis via libs/tts. Off by default: the WAV encoding
# and request handling in kokoro_backend.rs test everywhere with a stub synth.
tts = ["dep:makepad-ai-speech"]
# Real IndexTTS-2.5 character-voice TTS (voice cloning + 8-dim emotion
# vector) via libs/diffusion (indextts_pipeline, CPU f32 today). Off by
# default: reference-voice resolution, emotion validation and WAV shaping in
# indextts_backend.rs compile and test everywhere with a stub synth.
indextts = ["dep:makepad-diffusion"]
# Real MiniMax H3 video generation via libs/diffusion (h3_pipeline on the
# makepad-ggml CUDA stack) plus the hardware video file encoder
# (makepad-video: Media Foundation / NVENC on Windows, VideoToolbox on
# macOS) for the mp4 mux. Does NOT pull the UI platform crate.
video = ["dep:makepad-diffusion", "dep:makepad-video"]
# Real Stable Audio 3 Small SFX sound-effect generation via libs/diffusion
# (sa3_pipeline: T5Gemma TE + 20-block DiT + SAME-S AE, CPU f32 today, CUDA
# device path pending). Off by default: request handling and WAV encoding in
# sa3_backend.rs compile and test everywhere with a stubbed generator.
audio = ["dep:makepad-diffusion"]
# Real TRELLIS.2 image->GLB mesh generation via libs/diffusion (trellis_*
# on the makepad-ggml CUDA stack) plus the in-repo FaithC remesher
# (libs/remesh) for optional retopo of the raw decode mesh. Off by default:
# request handling, PNG input decode and artifact shaping in
# trellis_backend.rs compile and test everywhere with a stubbed generator.
mesh = ["matte-native", "depth-native", "dep:makepad-diffusion", "dep:makepad-remesh", "dep:makepad-gltf", "dep:makepad-xatlas"]
# Native BiRefNet image matting through libs/diffusion on the Makepad CUDA
# stack. This is separate from `mesh` so a matte-only service does not pull
# the TRELLIS/remesh surface area.
matte-native = ["dep:makepad-diffusion"]
# Native DA3METRIC-LARGE metric depth through libs/diffusion on the Makepad
# CUDA stack. Independent of `mesh` so a depth-only service does not pull
# TRELLIS/remesh. `mesh` enables it so the existing fleet boxes serve both.
depth-native = ["dep:makepad-diffusion"]
# Native SAM 3.1 multiplex image segmentation through libs/diffusion.
# Independent of `mesh` so a segment-only service does not pull TRELLIS.
segment-native = ["dep:makepad-diffusion"]
# Native HY-Motion decode -> rig retarget -> animated GLB. The heavyweight
# prompt/DiT runtime remains optional; request/service code still builds on
# machines that only route motion jobs to another box.
motion-native = ["dep:makepad-diffusion", "dep:makepad-gltf", "dep:makepad-render"]
# Native SkinTokens checkpoint conversion, inference, surface transfer and
# lossless skinned-GLB augmentation. The reference Torch/bpy backend remains
# separately available as `rig-oracle` through `python-backends`.
rig-native = ["dep:makepad-diffusion", "dep:makepad-gltf"]

[dependencies]
makepad-micro-serde = { path = "../../micro_serde" }
makepad-base64 = { path = "../../base64" }
makepad-network = { path = "../../../platform/network" }
makepad-zune-core = { path = "../../zune/zune-core" }
makepad-zune-png = { path = "../../zune/zune-png" }
makepad-zip-file = { path = "../../zip_file" }
makepad-diffusion = { path = "../../diffusion", optional = true }
makepad-ai-paint = { path = "../../ai/models/paint", optional = true }
makepad-remesh = { path = "../../remesh", optional = true }
makepad-gltf = { path = "../../gltf", optional = true }
makepad-xatlas = { path = "../../xatlas", optional = true }
makepad-render = { path = "../../render", optional = true }
makepad-ai-llm = { path = "../../ai/llm", optional = true }
makepad-ai-speech = { path = "../../ai/models/speech", optional = true }
makepad-video = { path = "../../../platform/video", optional = true }

[[bin]]
name = "makepad-asset-ai"
path = "src/main.rs"
