[package]
name = "makepad-asset-ai"
version = "0.2.0"
edition = "2021"
description = "AI content generation service: wraps local GPU model runtimes (image/mesh/video/audio) behind an HTTP port, with on-demand HuggingFace model download"
license = "MIT OR Apache-2.0"

# Standalone workspace: this crate pulls in platform/network and the
# per-family model crates under libs/ai, so it stays out of the root
# workspace member list.
[workspace]

[features]
# Native backends only. Python/Torch oracles stay off unless a box
# explicitly enables `python-backends`.
default = [
    "flux",
    "paint",
    "paint-cuda",
    "llm",
    "tts",
    "indextts",
    "video",
    "audio",
    "mesh",
    "matte-native",
    "depth-native",
    "segment-native",
    "motion-native",
    "rig-native",
]
# Box-provisioned Python/Torch reference backends (FlashWorld, Music3,
# Depth-Anything-3, and the rig/motion oracles). Not in default: a native
# service must not advertise or instantiate a Python runtime.
python-backends = []
# Real Flux image generation via makepad-ai-flux.
flux = ["dep:makepad-ai-flux", "dep:makepad-ai-common"]
# The generative-PBR paint domain: mesh GLB + reference image -> PBR-textured
# GLB + semantic maps + provenance manifest. Ships the deterministic
# "paint-test" tier everywhere. Default also enables `paint-cuda`, so a
# Windows/Linux fleet box advertises Hunyuan Paint and downloads weights
# like any other registry model.
paint = ["dep:makepad-ai-paint", "dep:makepad-gltf", "dep:makepad-remesh", "dep:makepad-xatlas"]
# Windows/Linux CUDA Hunyuan executor (in default).
paint-cuda = ["paint", "makepad-ai-paint/cuda-taps"]
# Real LLM prompt expansion via makepad-ai-llm (Qwen3.5/3.6 GGUF).
llm = ["dep:makepad-ai-llm"]
# Real Kokoro speech synthesis via makepad-ai-speech.
tts = ["dep:makepad-ai-speech"]
# Real IndexTTS-2.5 character-voice TTS via makepad-ai-speech.
indextts = ["dep:makepad-ai-speech", "dep:makepad-ai-common"]
# Real MiniMax H3 video generation via makepad-ai-h3 plus the hardware
# video file encoder (makepad-video). Does NOT pull the UI platform crate.
video = ["dep:makepad-ai-h3", "dep:makepad-ai-common", "dep:makepad-video"]
# Real SA3 / MOSS / Woosh / ACE / Music3 audio via the sfx + music crates.
audio = ["dep:makepad-ai-sfx", "dep:makepad-ai-music", "dep:makepad-ai-common"]
# Real TRELLIS.2 image->GLB via makepad-ai-trellis plus the in-repo remesher.
# Also needs H3's noise helper and BiRefNet (via matte-native).
mesh = ["matte-native", "depth-native", "dep:makepad-ai-trellis", "dep:makepad-ai-h3", "dep:makepad-ai-common", "dep:makepad-remesh", "dep:makepad-gltf", "dep:makepad-xatlas"]
# Native BiRefNet image matting. Separate from `mesh` so a matte-only
# service does not pull TRELLIS/remesh.
matte-native = ["dep:makepad-ai-vision", "dep:makepad-ai-common"]
# Native DA3METRIC-LARGE metric depth. Independent of `mesh`.
depth-native = ["dep:makepad-ai-vision", "dep:makepad-ai-common"]
# Native SAM 3.1 multiplex segmentation. Independent of `mesh`.
segment-native = ["dep:makepad-ai-vision", "dep:makepad-ai-common"]
# Native HY-Motion decode -> rig retarget -> animated GLB.
motion-native = ["dep:makepad-ai-motion", "dep:makepad-ai-common", "dep:makepad-gltf", "dep:makepad-render"]
# Native SkinTokens checkpoint conversion, inference, surface transfer and
# lossless skinned-GLB augmentation. The reference Torch/bpy backend remains
# separately available as `rig-oracle` through `python-backends`.
rig-native = ["dep:makepad-ai-rig", "dep:makepad-ai-common", "dep:makepad-gltf"]

[dependencies]
makepad-micro-serde = { path = "../../micro_serde" }
makepad-base64 = { path = "../../base64" }
makepad-network = { path = "../../../platform/network" }
makepad-zune-core = { path = "../../zune/zune-core" }
makepad-zune-png = { path = "../../zune/zune-png" }
makepad-zip-file = { path = "../../zip_file" }
makepad-ai-common = { path = "../../ai/models/common", optional = true }
makepad-ai-flux = { path = "../../ai/models/flux", optional = true }
makepad-ai-h3 = { path = "../../ai/models/h3", optional = true }
makepad-ai-vision = { path = "../../ai/models/vision", optional = true }
makepad-ai-rig = { path = "../../ai/models/rig", optional = true }
makepad-ai-motion = { path = "../../ai/models/motion", optional = true }
makepad-ai-sfx = { path = "../../ai/models/sfx", optional = true }
makepad-ai-music = { path = "../../ai/models/music", optional = true }
makepad-ai-trellis = { path = "../../ai/models/trellis", optional = true }
makepad-ai-paint = { path = "../../ai/models/paint", optional = true }
makepad-remesh = { path = "../../remesh", optional = true }
makepad-gltf = { path = "../../gltf", optional = true }
makepad-xatlas = { path = "../../xatlas", optional = true }
makepad-render = { path = "../../render", optional = true }
makepad-ai-llm = { path = "../../ai/llm", optional = true }
makepad-ai-speech = { path = "../../ai/models/speech", optional = true }
makepad-video = { path = "../../../platform/video", optional = true }

[dev-dependencies]
# Test-only: tests/service_e2e.rs drives the realtime websocket endpoint
# through the in-repo plain-TCP websocket client.
makepad-live-id = { path = "../../live_id" }
# Test-only: the h264 realtime round-trip test acts as its own client,
# encoding/decoding with the same hardware codec seam the service uses
# internally (behind the crate's own optional/default `video` feature).
makepad-video = { path = "../../../platform/video" }

[[bin]]
name = "makepad-asset-ai"
path = "src/main.rs"
