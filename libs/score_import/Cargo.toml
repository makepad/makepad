[package]
name = "makepad-score-import"
version = "1.0.0"
edition = "2021"
description = "Headless MusicXML and MIDI conversion for the Makepad score model"
license = "MIT OR Apache-2.0"

[dependencies]
makepad-score = { path = "../score", version = "1.0.0" }
