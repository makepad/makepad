[package]
name = "makepad-csg-brep-model"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
description = "Builder operations over the exact B-rep kernel: bodies from sketches, booleans, fillets, shells, exact queries, adaptive tessellation, a guarded worker"

[dependencies]
makepad-csg-brep = { path = "../csg_brep" }
makepad-csg-boolean = { path = "../csg_boolean" }
makepad-csg-cad = { path = "../csg_cad" }
makepad-csg-graph = { path = "../csg_graph" }
makepad-csg-math = { path = "../csg_math" }
makepad-csg-mesh = { path = "../csg_mesh" }
# Steps report on the caller's job (the status bar's "fillets 3/7").
makepad-jobs = { path = "../../jobs" }
