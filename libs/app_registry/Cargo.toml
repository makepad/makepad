# makepad-app-registry — the one table of Makepad's apps.
#
# `apps.json` holds every app the WM hosts, Builder builds and Stage runs:
# id, label, package, directory, binary, launch policy, menu visibility and
# Builder features. table.rs embeds it (include_str!) and reads it once, at
# first use, into the static table; a bad row panics there with the row and
# the reason, and the crate's tests read the table.
# (strict_json's errors carry no position: a syntax error names only the
# reason, which is fine for a table this size.)

[package]
name = "makepad-app-registry"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
publish = false

[lib]
name = "makepad_app_registry"
path = "src/lib.rs"

[dependencies]
makepad-strict-json = { path = "../strict_json" }

# cargo with the launchers' exact command and environment, for deploy scripts
[[bin]]
name = "makepad-cargo"
path = "src/bin/makepad_cargo.rs"
