[package]
name = "makepad-remote"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
description = "Remote file-sync and cargo runner for Makepad"
default-run = "makepad-remote"

[dependencies]
makepad-network = { path = "../../platform/network" }
makepad-toml-parser = { path = "../toml_parser", version = "1.0.0" }
makepad-strict-json = { path = "../strict_json", version = "0.1.0" }


[lib]
name = "makepad_remote"
path = "src/lib.rs"

[[bin]]
name = "makepad-remote"
path = "src/main.rs"

[[bin]]
name = "mapfleet"
path = "src/bin/mapfleet.rs"
