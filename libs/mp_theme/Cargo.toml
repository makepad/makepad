# mp_theme — the one-line theme bridge for every mp* app (mpwm, mpterm,
# mpbrowser, mpfiles, mptask, mpsheets, route, mixer...).
#
# mpwm evaluates the active theme.splash (an omarchy import) and exports its
# path as MPWM_THEME_SPLASH to every child. An app calls
# `mp_theme::apply(vm)` right after `makepad_widgets::script_mod(vm)`, and
# the widgets theme (`mod.theme`) is retinted from that palette: base
# black/white, app bg/fg, accent, selection, text. Standalone runs without
# the env var are untouched.

[package]
name = "mp-theme"
version = "0.1.0"
edition = "2021"

[lib]
name = "mp_theme"
path = "src/lib.rs"

[dependencies]
makepad-widgets = { path = "../../widgets" }
