[package]
name = "makepad-game-script"
version = "0.1.0"
edition = "2021"
description = "The game.* script binding layer for Makepad Arcade (see game.md)"
license = "MIT OR Apache-2.0"

[dependencies]
makepad-widgets = { path = "../../../widgets", version = "2.0.0" }
makepad-game-sim = { path = "../sim" }
makepad-game-blocks = { path = "../blocks" }
# The library and the layout generators. Both are pure CPU and Cx-free, so a
# verb can search and compose synchronously; only the GLB load and the draw
# need a host, and those go through the model queue like audio and particles.
makepad-game-assets = { path = "../assets" }
makepad-game-gen = { path = "../gen" }

[dev-dependencies]
makepad-test = { path = "../../makepad_test", version = "0.1.0" }
