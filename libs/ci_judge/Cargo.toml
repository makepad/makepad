[package]
name = "makepad-ci-judge"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
publish = false
description = "Shared CI vision judge on the AI fleet"

[dependencies]
# Fleet client only: discovery, routing and generation; no local model runtime.
makepad-ai-hub = { path = "../ai/hub", default-features = false }
makepad-network = { path = "../../platform/network" }
makepad-strict-json = { path = "../strict_json" }
