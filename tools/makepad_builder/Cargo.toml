[package]
name = "makepad-loader"
version = "0.1.0"
edition = "2021"
publish = false
description = "Makepad Builder: compile and customize commercial Makepad apps from source"

[lib]
name = "makepad_loader"
path = "src/lib.rs"

# The Builder: a console program with its TUI. On Windows it ships as source
# (windows/makepad-builder.bat compiles it with Rust's GNU toolchain); on
# macOS and Linux the same Builder is the shell script makepad.sh.
[[bin]]
name = "makepad-builder"
path = "src/bin/makepad-loader-cli.rs"

[dependencies]
makepad-loader-bundle = { path = "../../libs/loader_bundle" }
makepad-zip-file = { path = "../../libs/zip_file" }
makepad-git = { path = "../../libs/git" }
makepad-fast-inflate = { path = "../../libs/fast_inflate" }
makepad-strict-json = { path = "../../libs/strict_json" }

[target.'cfg(windows)'.dependencies]
makepad-win-resource = { path = "../../libs/win_resource" }

[build-dependencies]
makepad-win-resource = { path = "../../libs/win_resource" }
