[package]
name = "relax-light-http"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
description = "One blocking HTTPS request on the operating system's own TLS stack"
publish = false

# apple.rs's waits
[target.'cfg(target_vendor = "apple")'.dependencies]
relax-session = { workspace = true }

# the process's one OpenSSL setup (makepad_network::tls::init_openssl)
[target.'cfg(target_os = "linux")'.dependencies]
makepad-network = { path = "../../../platform/network" }
