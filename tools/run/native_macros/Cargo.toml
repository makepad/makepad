[package]
name = "makepad-run-native-macros"
version = "0.1.0"
edition = "2021"
description = "Makepad's native proc-macro set for the makepad binary: the script and widget derives, source-matched (relax-native-macros gen.rs), registered into Relax through relax_runner::Host"
license = "MIT OR Apache-2.0"
publish = false

# files outside this crate its build reads (makepad-source-slice ships them in a slice or source archive)
[package.metadata.commercial]
include = ["../../../libs/relax/native_macros/gen.rs", "../../../libs/relax/native_macros/src/native_cfg.rs", "../../../libs/relax/build_sources.rs", "../../../libs/relax/self_stamp.rs", "../../../libs/relax/base/src/sha256.rs", "../../../libs/relax/base/src/toml/parser.rs", "../../../platform/script/derive", "../../../widgets/derive_widget"]

[dependencies]
relax-native-macros = { workspace = true }
makepad-micro-proc-macro = { workspace = true, features = ["relax-tokens"] }
makepad-script-derive-impl = { path = "../../../platform/script/derive_impl" }
makepad-derive-widget-impl = { workspace = true }

[build-dependencies]
relax-lex = { workspace = true }
