# The AI Hub app the window manager starts and keeps running (apps/wm/src/hub_app.rs,
# keys: libs/ai/hub/src/node_conf.rs),
# installed as /home/arch/.makepad/wm/ai-hub.conf. The WM starts the app with `cargo run`; its
# build is the deploy's (provision.sh, wm-session.sh, the fleet deploy: `makepad-wm-build -- hub`, the
# WM's start as a build). Defaults: `features = node` (every local model backend) and the CUDA
# toolkit installed here (/opt/cuda, /usr/local/cuda) as MAKEPAD_CUDA_ROOT; NVCC_CCBIN from the
# WM's environment (/etc/environment), for the deploy's build and the WM's run alike.
port = 8785
host = 0.0.0.0
nice = 0
