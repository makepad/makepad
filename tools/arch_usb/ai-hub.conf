# The AI Hub app the window manager starts and keeps running (apps/wm/src/hub_app.rs,
# keys: libs/ai/hub/src/node_conf.rs),
# installed as /home/arch/.makepad/wm/ai-hub.conf. The WM starts the app with `cargo run`; its
# build is the deploy's (provision.sh, wm-session.sh: `makepad-cargo build --features node aihub`).
# The CUDA build settings come from the WM's environment (/etc/environment: MAKEPAD_CUDA_ROOT,
# NVCC_CCBIN), for the deploy's build and the WM's run alike.
port = 8785
