[package]
name = "makepad-platform"
version = "2.0.0"
authors = ["Makepad <info@makepad.nl>"]
edition = "2021"
description = "Makepad platform layer"
license = "MIT OR Apache-2.0"
homepage = "https://github.com/makepad/makepad/"
repository = "https://github.com/makepad/makepad/"
metadata.makepad-auto-version = "ue5pTU0e_KaMiNqLQpo2CaD-WeQ="

# Measure wake-up latency on the process main thread, without a UI backend.
[[test]]
name = "pool_latency"
harness = false

# Exercise the production watchdog on the process main thread without a GPU.
[[test]]
name = "ui_hang"
harness = false

[dependencies]
makepad-relax = { workspace = true }
makepad-alloc-epoch = { path = "../libs/alloc_epoch", version = "1.0.0" }
makepad-studio-protocol = { path = "./studio", version = "0.1.0" }
makepad-futures = { path = "../libs/futures", version = "1.0.0" }
makepad-shared-bytes = { path = "../libs/shared_bytes", version = "1.0.0" }
makepad-script-std = { path = "./script/std", version = "1.0.0" }
# Collect runs: which script modules and definitions the app used.
makepad-script-census = { path = "./script/census", version = "1.0.0" }
makepad-network = { path = "./network", version = "1.0.0" }
makepad-video = { package = "makepad-platform-video", path = "./video", version = "1.0.0" }
makepad-script = { path="./script", version="1.0.0"}
makepad-live-reload-core = { path = "../libs/live_reload_core", version = "0.1.0" }
makepad-zune-png = { path = "../libs/zune/zune-png", version = "0.5.2" }
# Camera frames that arrive as MJPEG.
makepad-zune-jpeg = { path = "../libs/zune/zune-jpeg", version = "0.5.15" }
makepad-tsdf = { path = "../libs/tsdf", version = "0.1.0" }
smallvec = { version = "1.15", path = "../libs/smallvec" }
bitflags = { version = "2.10", path = "../libs/bitflags" }
foldhash = { version = "0.2", path = "../libs/vulkan/foldhash" }

# The process's remote endpoint (`--remote`, `makepad inspect <pid> gpu`); it does not exist on
# these targets.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
makepad-remote = { path = "../libs/remote", version = "0.1.0" }
# The collect-web run mode writes its manifest in this format.
makepad-web-manifest = { path = "../libs/web_manifest", version = "0.1.0" }
# Every native target uses the HAL; web retains its browser backend.
makepad-hal = { path = "./hal", version = "1.0.0" }
# the web backend's messages for a host that plays the page (feature web-protocol)
makepad-wasm-bridge = { path = "../libs/wasm_bridge", version = "1.0.0", optional = true }

[target.wasm32-unknown-unknown.dependencies]
makepad-wasm-bridge = { path = "../libs/wasm_bridge", version = "1.0.0" }

[target.aarch64-apple-darwin.dependencies]
makepad-objc-sys = { path = "../libs/objc-sys", version = "1.0.0" }

[target.x86_64-apple-darwin.dependencies]
makepad-objc-sys = { path = "../libs/objc-sys", version = "1.0.0" }

[target.x86_64-apple-ios.dependencies]
makepad-objc-sys = { path = "../libs/objc-sys", version = "1.0.0" }

[target.aarch64-apple-ios-sim.dependencies]
makepad-objc-sys = { path = "../libs/objc-sys", version = "1.0.0" }

[target.aarch64-apple-ios.dependencies]
makepad-objc-sys = { path = "../libs/objc-sys", version = "1.0.0" }

[target.x86_64-apple-tvos.dependencies]
makepad-objc-sys = { path = "../libs/objc-sys", version = "1.0.0" }

[target.aarch64-apple-tvos-sim.dependencies]
makepad-objc-sys = { path = "../libs/objc-sys", version = "1.0.0" }

[target.aarch64-apple-tvos.dependencies]
makepad-objc-sys = { path = "../libs/objc-sys", version = "1.0.0" }

[target.'cfg(any(target_os = "macos", target_os = "ios", target_os = "tvos"))'.dependencies]
makepad-apple-sys = { path = "../libs/apple_sys", version = "1.0.0" }

[target.'cfg(target_os = "android")'.dependencies]
makepad-key-code = { path = "key_code", version = "0.1.0" }
makepad-jni-sys = { path = "../libs/jni-sys", version = "0.4.0" }
makepad-android-state = { path = "../libs/android_state", version = "0.1.0" }
makepad-vulkan = { path = "../libs/vulkan", version = "0.1.0" }

[target.'cfg(windows)'.dependencies.windows]
package = "makepad-windows-sys"
path = "../libs/windows/sys"
version = "0.1.0"

[features]
# The web backend's message types built for this machine (src/web_protocol.rs): the web trace
# host (tools/web_trace) plays the page's side of them.
web-protocol = ["dep:makepad-wasm-bridge"]
