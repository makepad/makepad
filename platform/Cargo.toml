[package]
name = "makepad-platform"
version = "2.0.0"
authors = ["Makepad <info@makepad.nl>"]
edition = "2021"
description = "Makepad platform layer"
license = "MIT OR Apache-2.0"
homepage = "https://github.com/makepad/makepad/"
repository = "https://github.com/makepad/makepad/"
metadata.makepad-auto-version = "ue5pTU0e_KaMiNqLQpo2CaD-WeQ="

[features]
# Desktop Linux binaries carry both renderers and choose when they start:
# Vulkan when a hardware device answers, OpenGL ES otherwise (no driver, only
# a software rasterizer, an X11 session). `MAKEPAD_GPU=auto|gl|vulkan`
# overrides that at run time; see os/linux/gpu_preference.rs. On by default so
# a distributed binary gets the faster API wherever one exists, without the
# app or its user configuring anything.
#
# The feature only takes effect on the windowed desktop Linux backend, which is
# the one with that fallback (see build.rs); OpenHarmony, Android, the direct
# (DRM/KMS) renderer and other Linux triples keep OpenGL ES. `MAKEPAD=gl` at
# build time produces an OpenGL-only binary, which an app needs today if it
# uses the Video widget or `Texture::read_back`: neither is implemented on the
# Vulkan renderer yet (`MAKEPAD_GPU=gl` does the same at run time).
default = ["vulkan"]
vulkan = []

# AppKit cursor creation must run on the process main thread.
[[test]]
name = "macos_cursors"
harness = false

# Measure wake-up latency on the process main thread, without a UI backend.
[[test]]
name = "pool_latency"
harness = false

# Exercise the production watchdog on the process main thread without a GPU.
[[test]]
name = "ui_hang"
harness = false

[[test]]
name = "metal_alloc_probe"
harness = false

[dependencies]
makepad-studio-protocol = { path = "./studio", version = "0.1.0" }
makepad-futures = { path = "../libs/futures", version = "1.0.0" }
makepad-shared-bytes = { path = "../libs/shared_bytes", version = "1.0.0" }
makepad-script-std = { path = "./script/std", version = "1.0.0" }
# Collect runs: which script modules and definitions the app used.
makepad-script-census = { path = "./script/census", version = "1.0.0" }
makepad-network = { path = "./network", version = "1.0.0" }
makepad-video = { package = "makepad-platform-video", path = "./video", version = "1.0.0" }
makepad-script = { path="./script", version="1.0.0"}
makepad-live-reload-core = { path = "../libs/live_reload_core", version = "0.1.0" }
makepad-zune-png = { path = "../libs/zune/zune-png", version = "0.5.2" }
makepad-tsdf = { path = "../libs/tsdf", version = "0.1.0" }
smallvec = { version = "1.15", path = "../libs/smallvec" }
bitflags = { version = "2.10", path = "../libs/bitflags" }

# The Cx-free half of --remote (HTTP, routes, grab encoding); the bridge
# does not exist on these targets.
[target.'cfg(not(any(target_arch = "wasm32", target_os = "android", target_env = "ohos")))'.dependencies]
makepad-remote-core = { path = "./remote_core", version = "1.0.0" }
# The collect-web run mode writes its manifest in this format.
makepad-web-manifest = { path = "../libs/web_manifest", version = "0.1.0" }

[target.wasm32-unknown-unknown.dependencies]
makepad-wasm-bridge = { path = "../libs/wasm_bridge", version = "1.0.0" }

[target.aarch64-apple-darwin.dependencies]
makepad-objc-sys = { path = "../libs/objc-sys", version = "1.0.0" }

[target.x86_64-apple-darwin.dependencies]
makepad-objc-sys = { path = "../libs/objc-sys", version = "1.0.0" }

[target.x86_64-apple-ios.dependencies]
makepad-objc-sys = { path = "../libs/objc-sys", version = "1.0.0" }

[target.aarch64-apple-ios-sim.dependencies]
makepad-objc-sys = { path = "../libs/objc-sys", version = "1.0.0" }

[target.aarch64-apple-ios.dependencies]
makepad-objc-sys = { path = "../libs/objc-sys", version = "1.0.0" }

[target.x86_64-apple-tvos.dependencies]
makepad-objc-sys = { path = "../libs/objc-sys", version = "1.0.0" }

[target.aarch64-apple-tvos-sim.dependencies]
makepad-objc-sys = { path = "../libs/objc-sys", version = "1.0.0" }

[target.aarch64-apple-tvos.dependencies]
makepad-objc-sys = { path = "../libs/objc-sys", version = "1.0.0" }

[target.'cfg(any(target_os = "macos", target_os = "ios", target_os = "tvos"))'.dependencies]
makepad-apple-sys = { path = "../libs/apple_sys", version = "1.0.0" }

[target.aarch64-unknown-linux-gnu.dependencies]
wayland-client = { path = "../libs/linux/wayland-client" }
wayland-protocols = { path = "../libs/linux/wayland-protocols", features = ["client", "unstable", "staging"] }
wayland-egl = { path = "../libs/linux/wayland-egl" }

[target.x86_64-unknown-linux-gnu.dependencies]
wayland-client = { path = "../libs/linux/wayland-client" }
wayland-protocols = { path = "../libs/linux/wayland-protocols", features = ["client", "unstable", "staging"] }
wayland-egl = { path = "../libs/linux/wayland-egl" }

[target.'cfg(target_os = "linux")'.dependencies]
ash = { path = "../libs/vulkan/ash", version = "0.38" }

[target.'cfg(target_os = "android")'.dependencies]
## Note: we must not use local 'path' dependencies on `makepad-jni-sys` or `makepad-android-state`
## in order to guarantee that only one instance of each crate exists in the app binary.
makepad-jni-sys = {version = "0.4.0"}
makepad-android-state = {version = "0.1.0"}
ash = { path = "../libs/vulkan/ash", version = "0.38" }
# A hosted child process (android_hosted.rs) has no AssetManager: it reads
# its assets from the APK file itself.
makepad-zip-file = { path = "../libs/zip_file" }

[target.'cfg(target_env = "ohos")'.dependencies]
hilog-sys = "0.1.1"
napi-derive-ohos = "0.0.9"
napi-ohos = "0.1.3"
ohos-sys = { version = "0.2.1", features = ["xcomponent"] }

[target.'cfg(windows)'.dependencies.windows]
package = "makepad-windows-sys"
path = "../libs/windows/sys"
version = "0.1.0"
