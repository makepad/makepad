[package]
name = "makepad-platform"
version = "2.0.0"
authors = ["Makepad <info@makepad.nl>"]
edition = "2021"
description = "Makepad platform layer"
license = "MIT OR Apache-2.0"
repository = "https://github.com/makepad/makepad/"
metadata.makepad-auto-version = "ue5pTU0e_KaMiNqLQpo2CaD-WeQ="

[package.metadata.makepad.platform-gaps]
windows = { "test:resource_resolver" = "1 of 6 fails there: reading a directory gives no InvalidPath there", "test:web_js" = "its pages run in CEF on Linux only (libs/web_test)" }

# Chromium re-runs the test binary as its subprocesses, which the JIT's runner is not.
[package.metadata.makepad.native-tests]
"test:web_js" = "its pages run in CEF (libs/web_test), and Chromium re-runs the test binary as its subprocesses"

# Run by the mac bucket on a Mac: the Linux buckets run them on Vulkan, never reaching Metal.
[package.metadata.makepad.macos-tests]
"test:compute_int_remainder" = "integer remainders through Metal's shader compiler, which took a constant remainder of a word's high half with the quotient of its low half"

# The app pool leaves the process main thread its cores under a full Background load (counted;
# the main thread's wake times are printed, not gated). No UI backend.
[[test]]
name = "pool_latency"
harness = false

# Exercise the production watchdog on the process main thread without a GPU.
[[test]]
name = "ui_hang"
harness = false

# Run the app loop on the process main thread, with a hidden window.
[[test]]
name = "frame_trace"
harness = false

# The web backend's JavaScript (src/os/web/*.js) under its tests (src/os/web/*.test.mjs), as
# pages in our own CEF (libs/web_test); Linux.
[[test]]
name = "web_js"
harness = false

[dev-dependencies]
makepad-web-test = { path = "../libs/web_test" }

[dependencies]
makepad-cpu-budget = { workspace = true }
makepad-a11y = { path = "../libs/a11y", version = "0.1.0" }
relax-attr = { workspace = true }
makepad-alloc-epoch = { path = "../libs/alloc_epoch", version = "1.0.0" }
makepad-studio-protocol = { path = "./studio", version = "0.1.0" }
makepad-futures = { path = "../libs/futures", version = "1.0.0" }
makepad-shared-bytes = { path = "../libs/shared_bytes", version = "1.0.0" }
makepad-script-std = { path = "./script/std", version = "1.0.0" }
# Collect runs: which script modules and definitions the app used.
makepad-script-census = { path = "./script/census", version = "1.0.0" }
makepad-network = { path = "./network", version = "1.0.0" }
makepad-video = { package = "makepad-platform-video", path = "./video", version = "1.0.0" }
makepad-script = { path="./script", version="1.0.0"}
makepad-live-reload-core = { path = "../libs/live_reload_core", version = "0.1.0" }
makepad-zune-png = { path = "../libs/zune/zune-png", version = "0.5.2" }
# Camera frames that arrive as MJPEG.
makepad-zune-jpeg = { path = "../libs/zune/zune-jpeg", version = "0.5.15" }
makepad-tsdf = { path = "../libs/tsdf", version = "0.1.0" }
# The eases behind `event::Ease`, shared with the Animator's `Ease`.
makepad-tween = { path = "../libs/tween", version = "0.1.0" }
# The web audio entry's output slot (the worklet thread never locks).
makepad-lock-free = { path = "../libs/lock_free", version = "0.1.0" }
smallvec = { version = "1.15", path = "../libs/smallvec" }
bitflags = { version = "2.10", path = "../libs/bitflags" }
# The collect-web run mode writes its manifest in this format; a web build
# reads the export's embedded files (os/web/web_embed.rs) in it. No dependencies.
makepad-web-manifest = { path = "../libs/web_manifest", version = "0.1.0" }
foldhash = { version = "0.2", path = "../libs/vulkan/foldhash" }
# how the process ends (the same end under the JIT and natively), and a pool job's waits off the CPU
# (`blocking`, `once`) on every target
makepad-core-util = { path = "../libs/core_util", version = "0.1.0" }

# The profiler stream of a native build (src/prof_native.rs), built on the targets that serve it.
[target.'cfg(any(target_os = "macos", target_os = "linux"))'.dependencies]
makepad-prof-stream = { path = "../libs/prof_stream", version = "1.0.0" }

# The process's remote endpoint (`--remote`, `makepad inspect <pid> gpu`); it does not exist on
# these targets.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
makepad-remote = { path = "../libs/remote", version = "0.1.0" }
# Every native target uses the HAL; web retains its browser backend.
makepad-hal = { path = "./hal", version = "1.0.0" }
makepad-gpu-trace = { path = "../libs/gpu_trace", version = "1.0.0" }
# the native frame build's secondary stack (frame-scoped scratch); web has no frame build
makepad-stack = { path = "../libs/stack", version = "1.0.0" }
# the web backend's messages for a host that plays the page (feature web-protocol)
makepad-wasm-bridge = { path = "../libs/wasm_bridge", version = "1.0.0", optional = true }

[target.wasm32-unknown-unknown.dependencies]
makepad-wasm-bridge = { path = "../libs/wasm_bridge", version = "1.0.0" }
# the HAL's window_controls.rs, compiled in directly here (lib.rs), derives its wire messages
makepad-micro-serde = { path = "../libs/micro_serde", version = "1.0.0" }

[target.aarch64-apple-darwin.dependencies]
makepad-objc-sys = { path = "../libs/objc-sys", version = "1.0.0" }

[target.x86_64-apple-darwin.dependencies]
makepad-objc-sys = { path = "../libs/objc-sys", version = "1.0.0" }

[target.x86_64-apple-ios.dependencies]
makepad-objc-sys = { path = "../libs/objc-sys", version = "1.0.0" }

[target.aarch64-apple-ios-sim.dependencies]
makepad-objc-sys = { path = "../libs/objc-sys", version = "1.0.0" }

[target.aarch64-apple-ios.dependencies]
makepad-objc-sys = { path = "../libs/objc-sys", version = "1.0.0" }

[target.x86_64-apple-tvos.dependencies]
makepad-objc-sys = { path = "../libs/objc-sys", version = "1.0.0" }

[target.aarch64-apple-tvos-sim.dependencies]
makepad-objc-sys = { path = "../libs/objc-sys", version = "1.0.0" }

[target.aarch64-apple-tvos.dependencies]
makepad-objc-sys = { path = "../libs/objc-sys", version = "1.0.0" }

[target.'cfg(any(target_os = "macos", target_os = "ios", target_os = "tvos"))'.dependencies]
makepad-apple-sys = { path = "../libs/apple_sys", version = "1.0.0" }

[target.'cfg(target_os = "android")'.dependencies]
makepad-key-code = { path = "key_code", version = "0.1.0" }
makepad-jni-sys = { path = "../libs/jni-sys", version = "0.4.0" }
makepad-android-state = { path = "../libs/android_state", version = "0.1.0" }
makepad-vulkan = { path = "../libs/vulkan", version = "0.1.0" }

[target.'cfg(windows)'.dependencies.windows]
package = "makepad-windows-sys"
path = "../libs/windows/sys"
version = "0.1.0"

[features]
# The web backend's message types built for this machine (src/web_protocol.rs): the web trace
# host (apps/apps/tools/wasm-export/trace) plays the page's side of them.
web-protocol = ["dep:makepad-wasm-bridge"]

[package.metadata.relax]
# its build script stays: relax runs it as a program, the makepad host answers it natively
build-script = "keep"
# a program that links it presents frames (relax_frame_done): live edits wait for a present
presents = true
