[package]
name = "makepad-script-test"
version = "1.0.0"
authors = ["Makepad <info@makepad.nl>"]
edition = "2021"
description = "Makepad splash example"
license = "MIT OR Apache-2.0"
metadata.makepad-auto-version = "BkQvnL-yt07_4n3oopSxq7yCP_w="

[dependencies]
makepad-script = { path = "../", version = "1.0.0"}

makepad-core-util = { path = "../../../libs/core_util" }
makepad-widgets = { path = "../../../widgets", optional = true, features = ["maps", "pdf", "voice", "browser", "ai"] }

makepad-widgets-tweaker = { path = "../../../widgets/families/tweaker", optional = true }

[features]
inventory = ["dep:makepad-widgets", "dep:makepad-widgets-tweaker"]

[[bin]]
name = "shader-inventory"
path = "src/bin/shader_inventory.rs"
required-features = ["inventory"]
