[package]
name = "makepad-script-audio-aot"
version = "1.0.0"
authors = ["Makepad <info@makepad.nl>"]
edition = "2021"
description = "Splash audio shaders: compiles instruments and effects written in Splash syntax into realtime-safe code (AIR + reference interpreter + native ARM64 backend)"
license = "MIT OR Apache-2.0"
repository = "https://github.com/makepad/makepad/"

[package.metadata.makepad.platform-gaps]
windows = { "test:web_audio" = "its pages run in CEF on Linux only (libs/web_test)" }

[package.metadata.makepad.native-tests]
"test:web_audio" = "its pages run in CEF (libs/web_test), and Chromium re-runs the test binary as its subprocesses"

[[test]]
name = "web_audio"
harness = false

[dependencies]
makepad-core-util = { path = "../../../libs/core_util" }
makepad-thread-local = { path = "../../../libs/thread_local", version = "1.0.0" }
relax-api = { path = "../../../libs/relax_api", version = "1.0.0" }
makepad-script-compute = { path = "../compute", version = "1.0.0" }

[dev-dependencies]
# tests/audio_aot.rs runs the generated wasm natively (a wasm interpreter).
makepad-stitch = { path = "../../../libs/stitch" }
makepad-cef = { path = "../../../libs/cef" }
makepad-web-test = { path = "../../../libs/web_test" }

[features]
host-shims = []
