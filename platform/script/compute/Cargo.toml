[package]
name = "makepad-script-compute"
version = "1.0.0"
authors = ["Makepad <info@makepad.nl>"]
edition = "2021"
description = "The Splash compute core: a typed Splash subset with logic, compiled to a structured SSA IR with a reference interpreter and native ARM64 backends (scalar and 4-lane NEON); front ends for audio shaders and geometry kernels"
license = "MIT OR Apache-2.0"
homepage = "https://github.com/makepad/makepad/"
repository = "https://github.com/makepad/makepad/"

[features]
# `module::register_shared_std`: the shared stdlib registered in a Splash VM
# (effect and Motion documents, runtime-compiled shaders). Off by default,
# so the compiler itself stays dependency-free.
vm = ["dep:makepad-script", "dep:makepad-tween"]

[dependencies]
makepad-script = { path = "..", optional = true }
# `ease(@name, u)` in the registered stdlib reads Motion's ease table.
makepad-tween = { path = "../../../libs/tween", optional = true }

[dev-dependencies]
makepad-csg-math = { path = "../../../libs/csg/csg_math" }
# tests/wasm.rs runs the generated scalar wasm natively (a wasm interpreter).
makepad-stitch = { path = "../../../libs/stitch" }
