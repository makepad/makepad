# Host builds use the CPU they are built on (user, 2026-10-21): every native workspace build on this machine gets
# `-C target-cpu=native` (AVX2/AVX-512/FMA/BMI on x64; the exact Apple/ARM core on arm64).
#
# Only the host targets below get it: cross targets (wasm32/wasm64, Android, iOS, other OSes) keep their own
# baselines. A RUSTFLAGS environment variable replaces these flags entirely, so a build for distribution or a
# benchmark baseline that must stay generic sets RUSTFLAGS explicitly (rwbench's "shipping rustc" baseline does).
#
# Host builds also run rustc's parallel frontend (user, 2026-11-05): `-Z threads=8`, which stable rustc takes
# under RUSTC_BOOTSTRAP=1 ([env] below; cargo hands it to every rustc it runs). For the JIT on a 16-CPU box a clean
# build goes from 74 to 68-71 s, a relax-compiler edit from 33 to 25 s and a relax-types edit from 47 to 35 s; the
# binary and its speed are unchanged. `-Z allow-features=` (an empty list) keeps the bootstrap from letting a
# `#![feature]` through: one fails with E0725, as it would on stable (tools/run/src/build_flags.rs tests both).
# Every host build here (cargo run/build/test/check by hand, devhub, CI and the land gate) gets this one flag set;
# a different set builds and stores its own copy of every crate. A rustc without `-Z threads` stops at cargo's first
# call: "unknown unstable option: `threads`".
#
# The bootstrap reaches every rustc cargo runs here, cross targets too, so every target gets `-Z allow-features=`:
# the host tables below with the frontend flags, every other target through [build] (a target without a table of
# its own). Builds that set RUSTFLAGS replace both and add the flag themselves (Runner, cargo-makepad's Android
# build, the CI's stable cross checks, tools/run/host/build.sh). Two kinds stay without it, as they must:
# a nightly `-Z build-std` build (it compiles std, whose crates need their features) sets RUSTFLAGS itself (empty
# is enough: cargo-makepad's tvOS and build-std checks, the CI's std shard, the wasm build); and the build scripts
# and proc macros of a `--target` build, which cargo gives no rustflags at all (they are the host build's crates,
# where a feature fails).
[env]
RUSTC_BOOTSTRAP = "1"

# PGO data for makepad-box3d is trained by libs/box3d/pgo.sh (not checked in).
# Do not enable it here with a relative -Cprofile-use path:
# Cargo applies rustflags to every crate in the graph, and rustc resolves
# that path relative to each crate being compiled. That breaks builds for
# dependencies and tools such as `cargo install --path=./tools/cargo_makepad`.
#
# For local PGO experiments, pass an absolute path explicitly, for example:
# RUSTFLAGS="-Cprofile-use=/tmp/box3d-pgo/merged.profdata" cargo build --release -p makepad-box3d
[build]
rustflags = ["-Z", "allow-features="]

[target.x86_64-unknown-linux-gnu]
rustflags = ["-C", "target-cpu=native", "-Z", "threads=8", "-Z", "allow-features="]

[target.aarch64-unknown-linux-gnu]
rustflags = ["-C", "target-cpu=native", "-Z", "threads=8", "-Z", "allow-features="]

[target.aarch64-apple-darwin]
rustflags = ["-C", "target-cpu=native", "-Z", "threads=8", "-Z", "allow-features="]

[target.x86_64-apple-darwin]
rustflags = ["-C", "target-cpu=native", "-Z", "threads=8", "-Z", "allow-features="]

[target.x86_64-pc-windows-msvc]
rustflags = ["-C", "target-cpu=native", "-Z", "threads=8", "-Z", "allow-features="]

[target.aarch64-pc-windows-msvc]
rustflags = ["-C", "target-cpu=native", "-Z", "threads=8", "-Z", "allow-features="]
