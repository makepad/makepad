[package]
name = "makepad-example-teamtalk"
version = "1.0.0"
authors = ["Makepad <info@makepad.nl>"]
edition = "2021"
description = "Makepad teamtalk"
license = "MIT OR Apache-2.0"
homepage = "https://github.com/makepad/makepad/"
repository = "https://github.com/makepad/makepad/"
metadata.makepad-auto-version = "Ywx5y_Q1A52NaelyQCiYcZ6m0Po="

[features]
default = ["tweaker"]
# The design overlay (Shift+F10 with the dev overlays on). On for development
# builds; the Builder's releases build without it (--no-default-features).
tweaker = ["makepad-widgets/tweaker"]

[dependencies]
makepad-widgets = { path = "../../widgets", version = "2.0.0", default-features = false }
makepad-teamtalk = { path = "../../libs/teamtalk" }

[[bin]]
name = "makepad-example-teamtalk"
path = "src/main.rs"

[[bin]]
name = "teamtalk-bench"
path = "src/bench.rs"
