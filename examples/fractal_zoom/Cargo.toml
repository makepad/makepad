[package]
name = "makepad-example-fractal-zoom"
version = "1.0.0"
edition = "2021"
description = "Makepad fractal zoom: tiled parallel SIMD rendering with a palette and fractal type panel"
license = "MIT OR Apache-2.0"

[features]
default = ["tweaker"]
# The design overlay (Shift+F10 with the dev overlays on). On for development
# builds; the Builder's releases build without it (--no-default-features).
tweaker = ["dep:makepad-widgets-tweaker", "makepad-widgets/data", "makepad-widgets/dock", "makepad-widgets/fab"]

[dependencies]
makepad-widgets = { path = "../../widgets", version = "2.0.0", default-features = false }
makepad-widgets-tweaker = { path = "../../widgets/families/tweaker", version = "2.0.0", optional = true }
# Network rendering (src/remote.rs): the fractal program's sessions on AI hub
# nodes (the hub's program client; no models, no node side).
makepad-ai-hub = { path = "../../libs/ai/hub", default-features = false, features = ["program"] }
makepad-compute-program = { path = "../../libs/compute_program", version = "1.0.0" }
# Fleet credentials (makepad_network::fleet).
makepad-network = { path = "../../platform/network" }

