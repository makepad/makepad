[package]
name = "makepad-example-app-host-probe"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
publish = false

# Hosts makepad-example-counter with makepad-app-host's HostedApp: waits for a
# presented frame, reads the semantic mirror, presses the button through its
# action path and waits for the label to change. Run the release binary hidden:
#   MAKEPAD_HIDE_WINDOWS=1 SANDBOX_MUTE=1 target/release/makepad-example-app-host-probe --remote
# (the counter binary must be built: cargo build --release -p makepad-example-counter).

[dependencies]
makepad-widgets = { path = "../../widgets", default-features = false }
makepad-app-host = { path = "../../libs/app_host" }
makepad-studio-protocol = { path = "../../platform/studio" }
makepad-remote = { path = "../../libs/remote" }
