[package]
name = "makepad-example-map"
version = "1.0.0"
edition = "2021"

[features]
default = ["tweaker"]
# The design overlay (Shift+F10 with the dev overlays on). On for development
# builds; the Builder's releases build without it (--no-default-features).
tweaker = ["makepad-widgets/tweaker"]

[dependencies]
makepad-widgets = { path = "../../widgets", version = "2.0.0", default-features = false, features = ["maps"] }
makepad-map-nav = { path = "../../libs/map_nav" }
makepad-geodata = { path = "../../libs/geodata" }
makepad-mbtile-reader = { path = "../../libs/mbtile_reader" }
makepad-fast-inflate = { path = "../../libs/fast_inflate" }

[dev-dependencies]
makepad-test = { path = "../../libs/makepad_test", version = "0.1.0" }
