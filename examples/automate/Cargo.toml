[package]
name = "makepad-example-automate"
version = "1.0.0"
authors = ["Makepad <info@makepad.nl>"]
edition = "2021"
description = "Home automation MIDI + DMX controller dashboard example"
license = "MIT OR Apache-2.0"

[features]
default = ["tweaker"]
# The design overlay (Shift+F10 with the dev overlays on). On for development
# builds; the Builder's releases build without it (--no-default-features).
tweaker = ["makepad-widgets/tweaker"]

[dependencies]
makepad-widgets = { path = "../../widgets", version = "2.0.0", default-features = false }
makepad-micro-serde = { path = "../../libs/micro_serde", version = "1.0.0" }
makepad-show-control = { path = "../../libs/show_control" }
