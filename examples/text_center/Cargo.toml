[package]
name = "makepad-example-text-center"
version = "1.0.0"
edition = "2021"
description = "Specimen page for the vertical text-centering contract of boxed labels"
license = "MIT OR Apache-2.0"

[features]
default = ["tweaker"]
# The design overlay (Shift+F10 with the dev overlays on). On for development
# builds; the Builder's releases build without it (--no-default-features).
tweaker = ["makepad-widgets/tweaker"]

[dependencies]
makepad-widgets = { path = "../../widgets", version = "2.0.0", default-features = false, features = ["dock"] }

[dev-dependencies]
makepad-test = { path = "../../libs/makepad_test", version = "0.1.0" }
makepad-zune-png = { path = "../../libs/zune/zune-png", version = "0.5.2" }
makepad-zune-core = { path = "../../libs/zune/zune-core", version = "0.5.1" }
