[package]
name = "makepad-example-sdf-bake"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
description = "The SDF engine's brick bake checked end to end: lowering vs csg_sdf, GPU vs CPU twin bit for bit, dirty re-bake vs full"

