[package]
name = "makepad-example-material-lab"
version = "0.1.0"
edition = "2021"
description = "Material pixel tests: a row of cubes, one per Splash material hook, on the real renderer"
license = "MIT OR Apache-2.0"

[dependencies]
makepad-widgets = { path = "../../widgets", version = "2.0.0" }
makepad-draw = { path = "../../draw", version = "2.0.0" }
makepad-render = { path = "../../libs/render", version = "0.1.0" }
makepad-render-graph = { path = "../../libs/render_graph", version = "0.1.0" }
makepad-gltf = { path = "../../libs/gltf" }

[dev-dependencies]
makepad-test = { path = "../../libs/makepad_test", version = "0.1.0" }
makepad-zune-png = { path = "../../libs/zune/zune-png", version = "0.5.2" }
