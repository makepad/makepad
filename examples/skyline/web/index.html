const CRC=(()=>{const t=new Uint32Array(256);for(let n=0;n<256;n++){let c=n;for(let k=0;k<8;k++)c=c&1?0xEDB88320^(c>>>1):c>>>1;t[n]=c>>>0;}return t;})();
function crc32(b){let c=0xFFFFFFFF;for(let i=0;i<b.length;i++)c=CRC[(c^b[i])&255]^(c>>>8);return (c^0xFFFFFFFF)>>>0;}
function buildZip(name,data){
  const n=new TextEncoder().encode(name),crc=crc32(data);
  const total=30+n.length+data.length+46+n.length+22;
  const out=new Uint8Array(total);const dv=new DataView(out.buffer);let p=0;
  const u32=x=>{dv.setUint32(p,x,true);p+=4},u16=x=>{dv.setUint16(p,x,true);p+=2};
  u32(0x04034b50);u16(20);u16(0);u16(0);u16(0);u16(0x21);u32(crc);u32(data.length);u32(data.length);u16(n.length);u16(0);
  out.set(n,p);p+=n.length;out.set(data,p);p+=data.length;
  const cd=p;
  u32(0x02014b50);u16(20);u16(20);u16(0);u16(0);u16(0);u16(0x21);u32(crc);u32(data.length);u32(data.length);u16(n.length);u16(0);u16(0);u16(0);u16(0);u32(0);u32(0);
  out.set(n,p);p+=n.length;
  const cdSize=p-cd;
  u32(0x06054b50);u16(0);u16(0);u16(1);u16(1);u32(cdSize);u32(cd);u16(0);
  return out;
}
async function saveFile(name,data){
  let d=null;try{d=window.claude&&window.claude.use?await window.claude.use('downloads'):null;}catch(e){}
  if(d){
    try{await d.save({filename:name,data});say('Saved '+name);}
    catch(e){say(e&&e.code==='declined'?'Save cancelled.':'Could not save: '+((e&&(e.message||e.code))||e));}
  }else{
    const a=document.createElement('a');a.href=URL.createObjectURL(data instanceof Blob?data:new Blob([data]));a.download=name;a.click();say('Downloaded '+name);
  }
}
document.getElementById('savePng').addEventListener('click',async()=>{
  try{const [w,h]=expSize();say('Rendering '+w+' x '+h+' ...');await new Promise(r=>setTimeout(r,30));
    const b=await renderPngBlob(w,h);await saveFile(`skyline_${w}x${h}.png`,b);}catch(e){say('Export failed: '+e.message);}
});
document.getElementById('saveExr').addEventListener('click',async()=>{
  try{const [w,h]=expSize();say('Rendering HDR '+w+' x '+h+' ...');await new Promise(r=>setTimeout(r,30));
    const f=renderFloat(w,h);const exr=exrBytes(f,w,h);const name=`skyline_${w}x${h}.exr`;
    await saveFile(name.replace('.exr','_exr.zip'),buildZip(name,exr));}catch(e){say('Export failed: '+e.message);}
});
window.__exp={renderPngBlob,renderFloat,exrBytes,buildZip};

// ---------- randomize / save / load parameters ----------
const RANGE={};for(const [,rows] of GROUPS)for(const [k,,mn,mx,st] of rows)RANGE[k]=[mn,mx,st];
const RANDOMIZE={ // sensible random ranges (view settings are left alone)
  land:[.45,1],landC:[0,1],horizon:[.74,.86],
  mtH:[.08,.4],mtW:[.15,1],mtC:[0,1],mtRug:[.15,1],
  ctH:[.7,1.6],ctD:[.3,1],ctW:[.12,.6],ctC:[0,1],ctR:[.7,1.5],
  trD:[.2,1],trH:[.02,.06],trCon:[0,1],trW:[.2,1],trC:[0,1],treeline:[.02,.2],
  lights:[1.5,6],winD:[.2,.8],glow:[.1,1.2],haze:[.15,.8],temp:[2200,6500],sharp:[.3,1],off:[0,.5],offDir:[0,1],
  prPyl:[0,1],prTurb:[0,1],prCrane:[0,1],prInd:[0,1],prChurch:[0,1],prTown:[0,1],prLamp:[0,1],prBridge:[0,1],prFair:[0,1],prRefl:[.2,1],prRipple:[0,1],prMast:[0,1],prFar:[0,1],prFarm:[0,1],prCoast:[0,1]};
function snap(k,v){const [mn,mx,st]=RANGE[k];v=Math.min(mx,Math.max(mn,v));const n=Math.round((v-mn)/st);return +(mn+n*st).toFixed(4);}
document.getElementById('randAll').addEventListener('click',()=>{
  const o={seed:Math.floor(Math.random()*100000)};
  for(const k in RANDOMIZE){const [a,b]=RANDOMIZE[k];o[k]=snap(k,a+Math.random()*(b-a));}
  window.setP(o);say('Randomized every setting. Press it again for another.');
});
document.getElementById('randAt').addEventListener('click',()=>{   // only where things stand on the circle (every 'at'): land, mountains, city, trees, the camera's near side
  const o={};for(const k of ['landC','mtC','ctC','trC','offDir'])o[k]=snap(k,Math.random());
  window.setP(o);say('Randomized where land, mountains, city and trees stand. Press it again for another.');
});
document.getElementById('saveP').addEventListener('click',()=>{
  const out={format:'skyline-params',version:1,params:{...P}};
  saveFile('skyline_params.json',JSON.stringify(out,null,2));
});
document.getElementById('loadP').addEventListener('click',()=>document.getElementById('fileP').click());
document.getElementById('fileP').addEventListener('change',async e=>{
  const f=e.target.files&&e.target.files[0];e.target.value='';if(!f)return;
  try{
    const j=JSON.parse(await f.text());const src=j&&j.params?j.params:j;
    if(!src||typeof src!=='object')throw new Error('not a parameter file');
    const o={};let n=0;
    for(const k in src){
      if(!(k in P)||typeof src[k]!=='number'||!isFinite(src[k]))continue;
      o[k]=RANGE[k]?snap(k,src[k]):src[k];n++;
    }
    if(!n)throw new Error('no known settings found');
    window.setP(o);say('Loaded '+n+' settings from '+f.name+'.');
  }catch(err){say('Could not load: '+err.message);}
});

</script>
