<title>Skyline Strip</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
:root{
  --bg:#eceef2; --fg:#1b2030; --mut:#5b6377; --line:#cdd2de; --panel:#f7f8fb; --accent:#c4561f;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0c1018; --fg:#dde2ee; --mut:#8c95aa; --line:#252c3d; --panel:#131825; --accent:#f08a4b; color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0c1018; --fg:#dde2ee; --mut:#8c95aa; --line:#252c3d; --panel:#131825; --accent:#f08a4b; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font:14px/1.4 "IBM Plex Sans",system-ui,sans-serif;
  padding-block:16px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
h1{font:600 20px/1.2 "IBM Plex Sans",system-ui,sans-serif;margin:0 0 2px}
.sub{color:var(--mut);margin:0 0 14px}
.wrap{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:16px;align-items:start}
@media (max-width:860px){.wrap{grid-template-columns:minmax(0,1fr)}}
.views{display:flex;flex-direction:column;gap:10px;min-width:0}
.cv{position:relative;border:1px solid var(--line);border-radius:6px;overflow:hidden;background:#05070d}
.cv .sky{position:absolute;inset:0}
.cv canvas{position:relative;display:block;width:100%;height:auto}
.lab{font:11px/1 "IBM Plex Mono",ui-monospace,monospace;letter-spacing:.06em;text-transform:uppercase;color:var(--mut);margin:4px 0 4px}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:12px;min-width:0}
.grp{font:11px/1 "IBM Plex Mono",ui-monospace,monospace;letter-spacing:.06em;text-transform:uppercase;color:var(--mut);margin:14px 0 6px}
.grp:first-child{margin-top:0}
.row{display:grid;grid-template-columns:104px minmax(0,1fr) 38px;align-items:center;gap:8px;margin:3px 0}
.row label{color:var(--fg);font-size:12.5px}
.row output{font:11px "IBM Plex Mono",ui-monospace,monospace;color:var(--mut);text-align:right}
select{font:13px 'IBM Plex Sans',system-ui,sans-serif;background:var(--bg);color:var(--fg);border:1px solid var(--line);border-radius:5px;padding:5px;min-width:0}
input[type=range]{width:100%;accent-color:var(--accent);min-width:0}
button{font:600 13px "IBM Plex Sans",system-ui,sans-serif;border:1px solid var(--line);background:var(--bg);color:var(--fg);padding:7px 10px;border-radius:5px;cursor:pointer}

.btns{display:flex;gap:8px;flex-wrap:wrap}
input[type=number]{font:13px "IBM Plex Mono",ui-monospace,monospace;background:var(--bg);color:var(--fg);border:1px solid var(--line);border-radius:5px;padding:5px 6px;min-width:0;width:100%}
.ib{padding:0;width:32px;height:30px;display:grid;place-items:center}
.ib svg{width:18px;height:18px}

<h1>Skyline Strip</h1>
<p class="sub">Night silhouettes on a transparent, horizontally tiling 360&deg; band. Lights are emissive, so they can exceed 1.0 in an HDR export.</p>
<div class="wrap">
  <div class="views">
    <div><div class="lab">Full 360&deg; strip</div>
      <div class="cv"><div class="sky" id="sky0"></div><canvas id="c0" width="1600" height="400"></canvas></div></div>
    <div><div class="lab" id="detailLab">Detail</div>
      <div class="cv"><div class="sky" id="sky1"></div><canvas id="c1" width="1600" height="520"></canvas></div></div>
  </div>
  <div class="panel" id="panel"></div>
</div>

<script>
const TAU=6.2831853;
const VS=`#version 300 es
in vec2 p;void main(){gl_Position=vec4(p,0.,1.);}`;
const FS=`#version 300 es
precision highp float;
precision highp int;
uniform vec2 uRes;
uniform vec2 uView;      // u0, span (fraction of 360 deg shown)
uniform float uSeed,uHorizon;
uniform float uMtH,uMtW,uMtC,uMtRug;   // uMtRug: 0 rolling hills .. 1 alpine peaks
uniform float uCtH,uCtD,uCtW,uCtC;
uniform float uCtR;           // city distance factor (downtown stands uCtR*28 blocks away)
uniform float uTrD,uTrH,uTrCon,uTrW,uTrC,uTreeline;   // uTrD: tree density, sparse .. closed forest
uniform float uLand,uLandC;
uniform float uLights,uWinD,uGlow,uHaze;
uniform vec3 uSil,uHazeCol;
uniform float uRaw;
uniform float uOff,uOffDir;   // off-centre camera: distance from the ring's centre (0..1), azimuth of the near side (0..1)
uniform int uZero;   // always 0: loops start from a uniform so ANGLE/D3D (FXC) cannot unroll them, which keeps compile times short
uniform float uOut;   // 0 = silhouettes only, 1 = lights only, 2 = both
uniform float uTemp,uSharp;   // light colour temperature (K); edge sharpness 0 (soft) .. 1 (crisp)
uniform vec4 uPropA;   // props, 0 = none .. 1 = many: x power lines, y wind turbines, z cranes, w industry
uniform vec4 uPropB;   // x churches, y town, z street lamps, w bridge
uniform vec4 uPropC;   // x fairground, y water reflections (strength), z ripple, w radio masts
uniform vec4 uPropD;   // x distant lights, y farms, z coast (lighthouse, ships), w unused (0)
#if defined(PASS_M)
layout(location=0) out vec4 o0;
layout(location=1) out vec4 o1;
layout(location=2) out vec4 o2;
#elif defined(PASS_C)||defined(PASS_P)
layout(location=0) out vec4 o0;
layout(location=1) out vec4 o1;
#else
layout(location=0) out vec4 fragColor;
#endif
const float TAU=6.2831853;

uint hu(uint x){x^=x>>16;x*=0x7feb352du;x^=x>>15;x*=0x846ca68bu;x^=x>>16;return x;}
float rnd(float id,float st,float ly){
  uint h=hu(uint(int(id)+4096)*0x9E3779B1u ^ (uint(int(st))*0x85ebca6bu + uint(int(ly))*0xc2b2ae35u + uint(int(uSeed))*0x27d4eb2fu));   // one round: hashing was a third of the compiled shader
  return float(h>>8)/16777216.;
}
float cover(float d,float px){return clamp(d/px+.5,0.,1.);}


#ifdef PASS_M
float mtScale(float k){return k<.5?.85:(k<1.5?1.15:(k<2.5?1.25:(k<3.5?.85:.50)));}   // relative height of the range
#endif

// Colour of a black-body-like light at k Kelvin, brightest channel = 1.
vec3 kelvin(float k){
  float t=clamp(k,1000.,12000.)/100.;
  float r=t<=66.?1.:clamp(1.292936*pow(t-60.,-.1332047592),0.,1.);
  float g=t<=66.?clamp(.39008158*log(t)-.63184144,0.,1.):clamp(1.129891*pow(t-60.,-.0755148492),0.,1.);
  float b=t>=66.?1.:(t<=19.?0.:clamp(.54320679*log(t-10.)-1.19625409,0.,1.));
  return vec3(r,g,b);
}

// ---- 3D city -----------------------------------------------------------------------------------------
// A voxel-grid city seen from the street. World: 1 block = 1 unit = 20 floors of CF; the camera stands at CEY above the
// street, azimuth = u*TAU, elevation = ang (the strip is equirectangular, so every ray is periodic in u and the strip
// tiles by construction). A ray walks the block grid front to back (2D DDA); each block holds one hashed building
// made of boxes / a cylinder / a dome / a mast, intersected analytically. Anti-aliasing comes from signed edge distances
// (no derivatives): every primitive reports a pixel coverage, the two nearest surfaces of a block are composited, and the
// walk continues behind a partly covered edge. Output: premultiplied body colour + alpha; window / beacon light goes
// to the global gEm (main puts it on the emissive layer, which Sharpness blurs).
const float CF=.05;      // floor height (world units)
const float CEY=.09;     // eye height above the street
const int CNS=120;       // block-walk steps (a ray crosses at most ~120 blocks of the city band)
vec3 gO=vec3(0.),gD=vec3(1.,0.,0.),gI=vec3(1.),gG=vec3(0.);   // ray origin, direction (never exactly 0), 1/direction, edge-distance factors
float gTd=1.;            // depth of the block being tested (middle of the ray's passage through its cell)
float gPx=1e-3;          // true radians per pixel
vec3 gEm=vec3(0.);       // window / beacon light of the last shaded surface
float gCityT=1e9;        // horizontal distance (m, from cityCam) of the nearest city surface in this pixel (1e9: none); set by city3
vec3 gSA=vec3(1e9,0.,0.),gSB=vec3(1e9,0.,0.),gSC=vec3(1e9,0.,0.);   // three nearest surfaces of the current block: t, coverage, part id
float gAx=0.;            // entry axis of the last box hit (xbox): 1 a z-facing wall, 0 an x-facing one

float cityD(){return 28.*uCtR;}                        // distance of downtown (blocks)
vec2 cityDir(){return vec2(cos(uCtC*TAU),sin(uCtC*TAU));}
vec2 cityCam(){return .8*uOff*cityD()*vec2(cos(uOffDir*TAU),sin(uOffDir*TAU));}   // real camera offset (replaces the 2D warp for the city)

uint hcell(vec2 c,float k){
  return hu(uint(int(c.x)+8192)*0x9E3779B1u ^ (uint(int(c.y)+8192)*0x85ebca6bu + uint(int(k))*0xc2b2ae35u + uint(int(uSeed))*0x27d4eb2fu));
}
vec4 hb4(uint h){return vec4(uvec4(h)>>uvec4(0u,8u,16u,24u)&255u)*.003921569;}   // a hash's four bytes as 0..1: one unpack feeds four random values
float box1(float f,float a,float b,float w){            // box-filtered 1D pulse on [a,b]; wide footprints fall back to its mean
  w=max(w,.004);
  float c=clamp((f-a)/w+.5,0.,1.)*clamp((b-f)/w+.5,0.,1.);
  return mix(c,b-a,smoothstep(.7,1.6,w));
}

#ifdef PASS_C
// Primitives: each returns vec2(t of the first surface, pixel coverage). Coverage = .5 + signed distance of the ray to the
// nearest silhouette edge / pixel footprint. The edge between the entry plane of axis a and the exit plane of axis b is a
// line; the ray's distance to it is (t2b-t1a)*|da*db|/hypot(da,db) (gG holds the three factors). The footprint is taken
// at gTd, the depth of the block (a building stands inside its cell, so every edge is about that far away; the entry t
// would be huge for rays grazing a wall).
vec2 xbox(vec3 c,vec3 h){
  vec3 q=(gO-c)*gI,k=abs(gI)*h;
  vec3 t1=-q-k,t2=-q+k;
  float tN=max(max(t1.x,t1.y),t1.z),tF=min(min(t2.x,t2.y),t2.z);
  gAx=step(max(t1.x,t1.y),t1.z);                          // entered through a z-facing wall (1) or an x-facing one (0)
  vec3 e=min((t2.yzx-t1)*gG.xzy,(t2.zxy-t1)*gG.yxz);      // the six edge distances, two per entry axis
  return vec2(tN,clamp(.5+min(min(e.x,e.y),e.z)/(gTd*gPx),0.,1.)*step(0.,tF));
}
vec2 xcyl(vec3 c,float R,float y0,float y1){             // vertical cylinder, axis through c.xz
  vec2 oc=gO.xz-c.xz,d=gD.xz;
  float a=dot(d,d),b=dot(oc,d);
  float hd2=max(dot(oc,oc)-b*b/a,0.),hd=sqrt(hd2);
  float tc=-b/a,sq=sqrt(max(R*R-hd2,0.)/a);
  float s1=tc-sq,s2=tc+sq;
  float ya=(y0-gO.y)*gI.y,yb=(y1-gO.y)*gI.y;
  float yn=min(ya,yb),yf=max(ya,yb);
  float dy=abs(gD.y);
  vec2 dn=abs(vec2(dot(d,oc+d*s1),dot(d,oc+d*s2)))/R,g=max(dn/(sqrt(dn*dn+dy*dy)+1e-6),.35);   // |d . outward normal| at entry / exit
  float m=min(R-hd,min((yf-s1)*dy*g.x,(s2-yn)*dy*g.y));  // floored: a grazing ray must not leave a half-covered line above the top
  return vec2(max(s1,yn),clamp(.5+m/(gTd*gPx),0.,1.)*step(0.,min(s2,yf)));
}
vec2 xdome(vec3 c,float R){                              // upper half of a sphere resting at c
  vec3 oc=gO-c;
  vec3 cx=cross(oc,gD);
  float b=dot(oc,gD),hd2=dot(cx,cx),hd=sqrt(hd2);
  float t=-b-sqrt(max(R*R-hd2,0.));
  float m=min(R-hd,(gO.y+gD.y*t-c.y)*.8);
  return vec2(t,clamp(.5+m/(gTd*gPx),0.,1.)*step(0.,t));
}
vec2 xmast(vec3 p,float H,float w){                      // thin vertical mast of width w and height H on p
  vec2 oc=p.xz-gO.xz,d=gD.xz;
  float a=dot(d,d),tc=dot(oc,d)/a;
  float hd=abs(oc.x*d.y-oc.y*d.x)/sqrt(a);
  float y=gO.y+gD.y*tc-p.y,tp=max(tc,.01)*gPx;
  float wm=min(w,tp),wM=max(w,tp);
  float cv=clamp(((wM+wm)*.5-hd)/max(wm,1e-5),0.,1.)*min(1.,w/tp);
  return vec2(tc,cv*(clamp(y/tp+.5,0.,1.)*clamp((H-y)/tp+.5,0.,1.)*step(0.,tc)));
}
void ins(vec2 v,float id){                               // keep the three nearest surfaces of the block (a roof-line pixel can need a third)
  if(v.y>.012){
    vec3 s=vec3(v,id);
    if(v.x<gSA.x){gSC=gSB;gSB=gSA;gSA=s;}
    else if(v.x<gSB.x){gSC=gSB;gSB=s;}
    else if(v.x<gSC.x)gSC=s;
  }
}

// Body colour of one surface sl=(t,coverage,id) (ids: 0 body, 1 upper section, 2 crown, 3/4 roof boxes, 5 dome, 6 mast);
// light -> gEm. B0=(cx,cz,bx,bz) B1=(floors body, floors upper, cylinder?, upper scale) B2=(floors crown, crown scale,
// roof height, floors); HS/H2 = bytes of the block's style hashes, hcl = its cell hash. A box wall facing z carries id + 8:
// its windows run along x (along z on an x-facing wall).
vec3 shadeCity(vec3 sl,vec4 B0,vec4 B1,vec4 B2,vec4 HS,vec4 H2,uint hcl,vec3 hz,vec3 sil,vec2 gd){
  float t=min(sl.x,1e3),zf=step(7.5,sl.z),id=sl.z-8.*zf;
  vec3 p=gO+gD*t;
  float n0=B1.x,n1=B1.y,s1=B1.w,n2=B2.x,ytop=B2.z;
  vec2 cxz=B0.xy,bxz=B0.zw;
  float cyl=step(.5,id)*step(id,1.5)*step(.5,B1.z);
  vec2 rn=normalize(p.xz-cxz+1e-6);
  vec3 n=mix(zf>.5?vec3(0.,0.,-sign(gD.z)):vec3(-sign(gD.x),0.,0.),vec3(rn.x,0.,rn.y),cyl);
  if(id>4.5&&id<5.5)n=normalize(p-vec3(cxz.x,ytop,cxz.y));
  if(id>5.5)n=-gD;
  float y=p.y;
  float fog=1.-exp(-t*(.0015+.0075*uHaze));                           // night haze by distance only: a tower's base is never lighter than its top
  vec3 fogC=hz*.7;
  float alb=.55+.95*HS.z;
  vec3 tnt=vec3(.92,.96,1.04)*(1.+(H2.xyz-.5)*.35);
  float y0=id>2.5?ytop:(id>1.5?(n0+n1)*CF:(id>.5?n0*CF:0.));
  vec3 sy=smoothstep(vec3(0.,0.,.05),vec3(.45,.12,1.8),vec3(y,y-y0,y));
  float aoG=mix(.5,1.,sy.x);                                          // street canyon: darker toward the ground
  float aoS=mix(1.,mix(.62,1.,sy.y),step(.5,id));                     // dark crease where a setback / roof box meets what it stands on
  float face=mix(.8,1.,.5+.5*dot(n.xz,gd));                           // walls toward downtown catch a little more of the glow
  float skyv=mix(.72,1.,sy.z);
  vec3 wall=tnt*alb*(hz*.17*face*skyv*aoS*aoG+vec3(1.,.62,.32)*uGlow*.012/(1.+8.*y*y)*aoS);   // only a faint street-light bounce on the lowest floors: a base must never be lighter than the tower
  vec3 body=wall;
  vec3 em=vec3(0.);
  if(id<2.5){
    // facade: whole window cells only (columns divide the wall exactly, half a pier at each corner, blank top floor and lobby)
    float W,sc;
    vec2 hv=id>1.5?bxz*s1*B2.y:(id>.5?bxz*s1:bxz);float hf=zf>.5?hv.x:hv.y;   // half the facade's width
    if(cyl>.5){W=TAU*(min(bxz.x,bxz.y)*s1);sc=(atan(p.z-cxz.y,p.x-cxz.x)/TAU+.5)*W;}
    else{W=2.*hf;sc=zf>.5?p.x-(cxz.x-hf):p.z-(cxz.y-hf);}
    float curt=step(HS.w,.3);                                          // curtain-wall tower: wide glass, thin mullions
    float cw0=mix(.034,.062,HS.y)*mix(1.,.8,curt);
    float mg=clamp(W*.11,.9*cw0,.22*W);                                // solid wall at both ends of the facade (never less than most of a window)
    float Wi=max(W-2.*mg,cw0*.5);
    float ncol=max(1.,floor(Wi/cw0+.5)),cw=Wi/ncol;
    float cs=(sc-mg)/cw,ci=clamp(floor(cs),0.,ncol-1.),fx=cs-ci;
    float inW=step(mg,sc)*step(sc,W-mg);                              // outside the margins there is only wall
    float yf=y/CF,fi=floor(yf),fy=yf-fi;
    float fs=t*gPx/(cw*max(abs(dot(n.xz,normalize(gD.xz))),.12)),fv=t*gPx/CF;   // pixel footprint in window cells
    float wfx=mix(mix(.50,.70,H2.w),.90,curt),wfy=mix(mix(.46,.58,HS.y),.70,curt);
    float gm=inW;
    for(int k=uZero;k<2;k++){   // the glass: a pulse across the cell times one up it (one call site); the piers between windows never blur away into a band
      float wf=k==0?wfx:wfy,o=k==0?0.:.03;
      gm*=box1(k==0?fx:fy,.5-.5*wf+o,.5+.5*wf+o,min(k==0?fs:fv,.45));
    }
    // on buildings of 8+ floors the section that carries the roof has a blank top floor, and the lobby (ground floor) stays dark
    if(B2.w>=7.5&&(id==(n2>.5?2.:(n1>.5?1.:0.))&&fi>=B2.w-1.5||id<.5&&fi<.5))gm=0.;
    // light: floors come in lit zones, rooms of 1-3 windows share a state, colours vary per floor
    uint wk=uint(id*8.+step(0.,n.x+n.z)+2.*zf),hf_=0u;   // one window pattern per face
    float gsz=(1.+floor(2.99*H2.w))*max(1.,floor(fs*.9));   // rooms of 1-3 windows; when windows are sub-pixel, rooms grow to about a pixel so the pattern stays broken, never a flat band
    vec4 HF,HR;float zone,wing;
    for(int k=uZero;k<4;k++){   // four hashes through one call site: the floor, its lit zone (3 floors), the room, the wing (a third of the facade)
      uint hh=hu(k==0?hcl^(uint(fi+64.)*0x9E3779B1u)^(wk*0x85ebca6bu):(k==1?hcl+uint(floor(fi/3.)+64.)*0x27d4eb2fu+wk:
                 hf_+(k==2?uint(floor(ci/gsz)+16.)*0xC2B2AE35u:uint(floor(clamp(sc/W,0.,.999)*3.)+1.)*0x6C8E9CF5u)));
      vec4 b=hb4(hh);
      if(k==0){hf_=hh;HF=b;}else if(k==1)zone=b.x;else if(k==2)HR=b;else wing=b.x;
    }
    float pf=clamp(uWinD*(.3+1.4*HS.x),0.,1.);
    float pfl=clamp(pf*mix(.35,1.5,step(zone,.5)),0.,1.);
    float floorLit=step(HF.x+1e-4,pfl*.95);
    float occ=.3+.7*HF.z;                                              // how many of this floor's rooms are lit
    float roomLit=step(HR.x,occ);
    float wingLit=step(wing,.5+.5*occ);                                // a floor is often lit in one wing only
    float bright=.4+.8*HR.y;
    // A wall whose window columns cannot be resolved (foreshortened side faces, or just too far) shows NO
    // lit windows at all: a lit floor there would only turn into a line along the wall. Only when the
    // floors are unresolvable too does the whole tower fade to one even, faint glow (far-away towers).
    vec2 rf=smoothstep(vec2(.6,1.5),vec2(1.2,4.),vec2(fs,fv));
    float resX=1.-rf.x, farY=rf.y;
    float lit=mix(floorLit*wingLit*roomLit*resX,pfl*.54*occ,farY);
    float ft=HF.y;
    // windows are recessed: seen at a grazing angle the piers hide the glass, so a lit floor fades out
    // instead of collapsing into a bright line along the wall
    float cosv=abs(dot(n,gD)), reveal=clamp(1.-mix(.3,.12,curt)*sqrt(max(1.-cosv*cosv,0.))/max(cosv,1e-3),0.,1.);
    float ea=gm*lit*bright*uLights*.55*mix(.55,1.,cosv)*mix(1.,.8,curt)*reveal;
    if(ea>.003){   // the light colour (a Kelvin curve with log / pow) only where a window is actually lit
      vec3 lc=mix(kelvin(mix(uTemp,min(uTemp*1.9,12000.),step(.62,ft))),vec3(.78,1.,.8)*.85,step(.86,ft));
      em=lc*ea;
    }
    float fc1=max(1.-cosv,0.);
    float fres=.15+.85*fc1*fc1*fc1;
    float refl=1./(1.+7.*max(gD.y,0.));                                 // the glass mirrors the glow band at the horizon: brighter low, fading upward
    vec3 glass=hz*(.04+.34*fres)*mix(.35,1.,refl)*(.8+.4*HR.z)*mix(.6,1.,aoG)*vec3(.85+.3*H2.y,1.,.85+.3*H2.z);   // glass tint differs per tower
    float sw=clamp(sc,0.,W);
    float gwall=1.+.1*(2.*sw/W-1.)*sign(gd.y+1e-4)*(1.-cyl);           // soft light fall-off across the wall
    vec2 cq=vec2(sw,W-sw),co=1./(1.+cq*cq*200.);
    float cao=1.-.1*(co.x+co.y)*(1.-cyl);                              // faint occlusion toward the wall's corners
    body=mix(wall,glass,gm*mix(.5,1.,reveal))*gwall*cao;
  }
  if(id>2.5&&id<5.5)body*=.8;
  if(id>5.5)body=sil*3.;
  gEm=em*(1.-.6*fog);
  return mix(body,fogC,fog);
}

vec4 city3(float u,float ang,float px,vec3 hz,vec3 sil){
  gEm=vec3(0.);gCityT=1e9;
  float D=cityD(),r0=.5*D,r1=1.55*D;
  // Real proportions: 1 block = 70 m, 1 floor = 3.5 m. TF is a ceiling, not the tallest building: Tower height 1 gives TF = 50
  // floors and a tallest building of about 42 floors (35-48 by seed, about 150 m); most lots stay low.
  float TF=6.+44.*uCtH,TF2=TF-2.,Hcap=TF*CF+.9;   // floor ceiling of the tallest tower, (less the 2 floors every lot has), tallest anything (+ mast)

// =====================================================================================================================
// PROPS FRAME: power lines, wind turbines, cranes, industry, churches, town, street lamps, bridge, fairground and water
// reflections. Shared here: world-scale helpers, the tonal rule, light helpers, placement zones. Each prop owns one stub
// between "==== PROP <name> BEGIN ====" and "==== PROP <name> END ====" (its helpers go there too, prefixed with its name).
// STUB CONTRACT: return vec4(premultiplied body colour, coverage) and ADD the prop's light to gPrE (the frame zeroes it
// before each call and only calls a stub while its slider is above 0). The frame composites
//   col=col*(1-r.a)+r.rgb;  emis=emis*(1-r.a)+gPrE;  a=r.a+a*(1-r.a);
// so a prop hides everything behind it, its light included. v=(u,ang,px) is the warped view (free-standing scenery, like
// the mountains); vr=(uR,angR,pxR) the raw view (city camera model: cityCam(), prCityView(), gCityT).
// PROPS LAYER (churches, town, bridge, fair, pylons, lamps): over the sea it stands in front of the water down to each prop's
// own waterline, and the mirror pass reflects it about that waterline; so no body or light may reach below its ground
// (prLocal y < 0). Helpers and rnd() layer ids are per prop: see each stub.
// =====================================================================================================================
const float PR_BLOCK=70.;   // metres per city block (world unit); a floor is 3.5 m
const float PR_EYE=6.3;     // eye height above the ground (m) = CEY*70
float gPrEye=PR_EYE;        // eye height used by prEl / prBase / prLocal; the reflection's mirror pass sets -PR_EYE for the props layer
vec3 gPrE=vec3(0.);         // light of the current prop stub (additive, like gEm)
float gCityA=0.;            // the city's alpha in this pixel (with gCityT; valid after city3 in the same pass)
float gIndA=0.;             // the industry's coverage in this pixel (slot b; 0 when off): it hides the bridge, which stands farther away
vec2 gMtNear=vec2(0.);      // coverage of the two nearest mountain ranges in this pixel: x ranges 3+4 (with their trees), y range 4 alone

float prWd(float a,float b){return fract(a-b+.5)-.5;}                     // signed wrapped azimuth difference a-b (u units, -.5 .. .5)
vec2 prW(float b,float r){return r*vec2(cos(b*TAU),sin(b*TAU));}          // world point (m, horizontal xz) at bearing b, r m from the ring centre
float prEl(float h,float d){return (h-gPrEye)/d;}                         // elevation (rad) of a point h m above the ground, d m away (horizontal)
float prBase(float d){return -gPrEye/d;}                                  // elevation (rad) of the ground at the foot of a prop d m away
vec3 prLocal(vec3 v,float uc,float d){return vec3(prWd(v.x,uc)*TAU*d,v.y*d+gPrEye,v.z*d);}   // the pixel in metres on the vertical plane d m away facing the camera, centred on azimuth uc: x (toward larger u), y (above the ground), pixel size
vec2 prCityView(vec2 w){vec2 q=w-cityCam()*PR_BLOCK;return vec2(fract(atan(q.y,q.x)/TAU),length(q));}   // a world point (m) seen from the city camera: raw azimuth, distance (m)
float prCityHide(float d){return d>gCityT?gCityA:0.;}                     // share of this pixel hidden by a city surface nearer than d m (slots c, d only)
float prMtD(float k){return 5000.*pow(6.,(4.-k)*.25);}                    // nominal distance (m) of mountain range k: 4 (nearest) 5 km, 3 7.8 km, 2 12.2 km, 1 19 km, 0 30 km
float prMtHide(float d){return d>prMtD(3.)?gMtNear.x:(d>prMtD(4.)?gMtNear.y:0.);}   // share of this pixel hidden by a mountain range nearer than d m (slots c, d)

// Body colour of an unlit prop d m away, in the night tonal order: at 400 m as black as the front treeline (sil*.6), at the
// nearest range's distance (5 km) and beyond exactly the tone of the range tops there, so a prop is never lighter than the
// range behind it. Lights never use it.
vec3 prTone(float d){
  vec2 tn=clamp(log(d/vec2(prMtD(4.),400.))/log(vec2(6.,12.5)),0.,1.);   // x: from the nearest range out, y: the near ramp from 400 m
  float t=tn.x, nk=tn.y;
  float hz2=uHaze*uHaze*.35;
  float fTop=clamp(mix(.012+.01*t,.30*t*t+.06*t+.02,hz2),0.,1.);
  vec3 fogc=mix(uHazeCol*(.7+.25*t),uHazeCol*(1.6+1.6*t)+vec3(.06,.07,.09)*t,hz2);
  return mix(uSil*mix(.6,1.,nk),fogc,fTop*nk);
}
vec3 prLightC(float kMul){return kelvin(uTemp*kMul);}                     // light colour: the scene's colour temperature times kMul (<1 warmer, >1 cooler)
float prFogL(float d){return 1.-.6*(1.-exp(-d/PR_BLOCK*(.0015+.0075*uHaze)));}   // haze dimming of a light d m away (the city windows' rule)
// Intensity profile of a small point light: core radius r, offset q from its centre, pixel size pxm (all m). A core under
// ~.7 px is widened to that and dimmed in proportion (a far lamp stays a 1-px point); a modest halo of ~3 core radii
// (at least 2.5 px) at 6%. Peak 1 for a resolved core.
float prGlow(vec2 q,float r,float pxm){
  float rr=max(r,.7*pxm),hr=max(3.*r,2.5*pxm),q2=dot(q,q);
  return min(1.,r/rr)*(exp(-2.*q2/(rr*rr))+.06*exp(-q2/(hr*hr)));

// THIN-LINE RULE: coverage of a line (wire, blade, jib, spoke, cable, hanger) of half-width w at distance dist (same units as
// pxm). Under half a pixel it is widened to ~1 px and its coverage reduced in proportion: a continuous faint line, never dashes.
// (The props engine evaluates it for two lines at once; lattices and red beacons live in its evaluator too.)
float prLine(float dist,float w,float pxm){float ww=max(w,.5*pxm);return cover(ww-abs(dist),pxm)*min(1.,w/ww);}

// ---- placement zones ------------------------------------------------------------------------------------------------
// Per-frame constants computed in JS (propZones(), an exact port of region()/rnd()) and passed as uniforms. Each zone is
// vec4(centre azimuth u, half-width in u, nearest distance m, farthest distance m); half-width 0 = absent. Seed-deterministic,
// periodic in u, kept apart from each other.
uniform vec4 uZCity,uZCrane,uZInd,uZTown,uZChurch,uZFair,uZBridge,uZLampT,uZLampC;
uniform vec4 uZPyl0,uZPyl1,uZPyl2;      // power lines: (bearing of the line's nearest point, its distance m, farthest pylon m, 1)
uniform vec4 uZTurb0,uZTurb1;           // wind farms: (centre, half-width, mountain range k they stand on, 1)
uniform vec4 uZIndX;                    // x: side of the city the industry is on (+1 toward larger u, -1 smaller, 0 no city)
uniform vec4 uZTownX;                   // x: shore azimuth, y: sea side of the town (+1 sea toward larger u, -1 smaller, 0 inland town)
uniform vec4 uZFairX;                   // x: 1 on a pier at the sea, 0 at the town edge; y: direction from the town (+1/-1)
uniform vec4 uZBridgeX;                 // x: 1 over water, 0 across a valley on land; y: shore azimuth; z: sea side (+1/-1)
uniform vec4 uZMastU,uZMastK,uZMastD,uZMastH;   // up to four masts: azimuth (-1 none), mountain range k (-1 open land), distance m, height m
uniform vec4 uZShore;                   // the two real shorelines: x where the sea begins toward larger u, y toward smaller u; z: 1 when there are both land and sea
float prIn(float u,vec4 z){return z.y>0.?1.-smoothstep(z.y-.004,z.y+.004,abs(prWd(u,z.x))):0.;}   // soft membership of azimuth u in zone z

// Own helpers: prefix 'refl' (e.g. reflPart()); own rnd() layer ids: 2000..2099.
// Water reflections (sliders uPropC.y strength, uPropC.z ripple). Called only for water pixels below the horizon (ang<0, sea>.01,
// lights on). propReflSample returns x: azimuth offset du (u units, added to u and uR), y: elevation factor k (the mirror pass
// looks at elevation -ang*k), z: weight (0 = no mirror pass, nothing reflected; keep it 0 where nothing bright can be mirrored,
// it bounds the cost), w: free, handed back to propReflLight. propReflLight turns the mirror pass's light E (already occluded by
// the mirrored silhouettes) into the light the water shows; the frame adds it where the water is visible.
// Model: a water pixel al rad below the horizon mirrors the elevation al. Small waves tilt the surface: a facet sloping toward
// the viewer sends the ray higher, a sideways slope turns it. The water is cut into wave rows (logarithmic in depth: thin near
// the horizon, taller toward the viewer) and, along each row, into cells around the circle (an integer count: it tiles).
// Each row cell mirrors a thin horizontal slice of the sky whose height is shifted at random within +-A of the mirror point.
// Calm water: a small A on long, smoothly blended cells, and a mirror that stretches with depth (e = al/(1+al/aS)): the floors
// of a lit facade merge into vertical smears that lengthen and fade downward. Ripple: a large A on short hard-edged cells
// that are also stretched sideways and jittered: every light breaks into a column of thin horizontal streaks.

// Instance header (3 texels): H0 plane (bearing, distance m, foot elevation above the flat ground rad, flags) or line (-, margin
// m along the line, -, flags); H1 (first part, part count, top m, body tone distance m or 0); H2 plane (half-width m) or line
// (O.xy plan m, direction angle, length m). Flags: slot 0-1, range 2-4, raw view 5, hidden by the city 6 / mountains 7,
// line 8, hidden by the industry 9, is industry 10, seed from bit 11.
// Every prop of a slot at this pixel, farthest first, over col / a / emis: slots 0 (wind turbines, the mountain pass puts them
// behind their range) and 1 (behind the city) and 2 (the props layer) alike.
void pkDraw(int slot,vec3 v,vec3 vr,inout vec3 col,inout float a,inout vec3 emis){
  if(uPkN.x<1)return;
  vec4 B=pkT(slot*uPkN.x+int(fract(vr.x)*float(uPkN.x)));   // this slot's bucket table
  int n=int(B.y), l0=uPkN.y+int(B.x);
  for(int e=uZero;e<256;e++){
    if(e>=n)break;
    int ib=uPkN.z+3*int(pkT(l0+e).x);
    vec4 H0=pkT(ib),H1=pkT(ib+1),H2=pkT(ib+2);
    int fl=int(H0.w), np=int(H1.y), p0=uPkN.w+3*int(H1.x);
    vec3 w=(fl&32)!=0?vr:v;                       // raw view (city camera model) or the warped scenery view
    bool line=(fl&256)!=0;
    vec2 an=vec2(w.x*TAU,H2.z), cn=cos(an), sn=sin(an), e2=vec2(cn.x,sn.x), dl=vec2(cn.y,sn.y);   // the pixel's ray, the line
    float den=dl.x*e2.y-dl.y*e2.x, mi=0.; vec3 Ei=vec3(0.);
    uint h=uint(fl>>11)*0x9E3779B1u;              // the instance's own seed
    FR F=FR(0.,0.,1.,1.,0.,1.);
    for(int i=uZero-1;i<160;i++){                 // i=-1: the instance's own frame (culling, haze), then its parts (a fair coaster has 104)
      if(i>=np)break;
      vec4 c=pkT(p0+3*i);

      if(!line&&i<0){                             // facing plane H0.y m away at bearing H0.x, foot H0.z above the flat ground (rad)
        G.dist=H0.y; G.s=prWd(w.x,H0.x)*TAU*G.dist; G.y=(w.y-H0.z)*G.dist+gPrEye; G.p=G.dist; G.sf=0.; cut=abs(G.s)>H2.x+3.*w.z*G.dist;
      }else if(line&&(i<0||c.y!=0.)){             // line O = H2.xy (plan m), direction angle H2.z, s from 0 to H2.w; a part on its own
        vec2 O=H2.xy+(i<0?0.:c.y)*vec2(-dl.y,dl.x);   // parallel line c.y m to its left
        G.s=(e2.x*O.y-e2.y*O.x)/den; vec2 X=O+G.s*dl; G.dist=length(X); G.p=abs(O.x*dl.y-O.y*dl.x); G.sf=dot(X,dl)/G.dist; G.y=w.y*G.dist+gPrEye;

// ===================================================================================================================
// PASSES. The scene is drawn by four small programs (plus the tree program TVS/TFS, which draws the single trees as geometry) built from this one source (the page defines PASS_P, PASS_M, PASS_C
// or none for the final pass), so the Direct3D compiler builds four small shaders in parallel instead of one big one
// (its time grows with about the square of a shader's size). Each pass writes layers (RGBA16F textures, premultiplied):
//   P slot 0  the wind turbines: colour+coverage, light+the range they stand on (the mountain pass puts them behind it)
//   M         the mountain ranges with their trees and turbines: colour+alpha, light+the front treeline's coverage,
//             (gMtNear.xy, land envelope, near ground rise)
//   C         the city: colour+alpha, light+the depth of its nearest surface (m)
//   P slot 1  the props behind the city (industry, far cranes), slot 2 the props layer, and slot 2 again seen from the
//             mirrored eye (for the water reflections); they hide behind the mountains and the city through M and C
//   final     composites them with the front treeline and the ground, pulls the props layer through over the sea and adds
//             the reflections by looking the layers up at the mirrored point.
// ===================================================================================================================
// The pixel's two views: the warped scenery view v = (u, ang, px) and the raw view vr = (uR, angR, pxR). Off-centre camera:
// the scenery is a ring of radius 1, the camera stands uOff away from its centre toward azimuth uOffDir; each pixel is
// re-aimed at the world azimuth it really sees, and heights and pixel sizes are scaled by the distance to that point (the
// near side grows, the far side shrinks). The 3D city uses the raw view with a real camera offset instead.
// Layer codes: on GPUs that cannot render to half floats the layers are 8 bits: colours stored as square roots, light / 16,
// the near ground rise x 50, depths as the square root of depth / 60 km, ranges / 8.
uniform float uEnc;
vec4 encC(vec4 c){return uEnc>.5?vec4(sqrt(max(c.rgb,0.)),c.a):c;}
vec4 encE(vec3 e,float x){return uEnc>.5?vec4(sqrt(max(e,0.)*.0625),x):vec4(e,x);}
vec4 decC(vec4 c){return uEnc>.5?vec4(c.rgb*c.rgb,c.a):c;}
vec3 decE(vec3 e){return uEnc>.5?e*e*16.:e;}
void pixView(out vec3 v,out vec3 vr){
  vec2 fc=vec2(gl_FragCoord.x,uRes.y-gl_FragCoord.y);   // top-left origin, pixels
  float u=fract(uView.x+fc.x/uRes.x*uView.y), px0=uView.y*TAU/uRes.x, ang=(uHorizon*uRes.y-fc.y)*px0, px=px0;
  vr=vec3(u,ang,px0);
  float th=u*TAU; vec2 d=vec2(cos(th),sin(th)), c=uOff*vec2(cos(uOffDir*TAU),sin(uOffDir*TAU));
  float cd=dot(c,d), t=-cd+sqrt(max(cd*cd-dot(c,c)+1.,1e-4));
  vec2 q=c+t*d;
  v=vec3(fract(atan(q.y,q.x)/TAU),ang*t,px*t);
}

// ---------- props: generated here, drawn by the shader's interpreter (pkDraw) ----------

  // (O plan point m, ang direction, len, smar margin m); top m; td: body tone distance (0: per pixel)

// ---- wind turbines: slot 0, standing on mountain range k (or flat land, or offshore) ----
// A farm is one turbine model (hub 85-120 m, rotor diameter ~0.95-1.1 x hub height) in rows: row 0 on the crest (its foot at
// the ridge line), rows 1-2 ~9% / 18% farther behind it, so the range hides their lower parts; flat farms 4.5 km out on open
// land, offshore farms 8 km out at sea, rows 14% apart. Cells of 3-3.6 rotor diameters, most occupied, ragged farm ends.
// The rotors face the farm's wind bearing (their yaw follows each turbine's bearing); each has its own blade angle; most
// nacelles carry a small red beacon. prTurb: farm width (zone), rows (1, 2 above .2, 3 above .55), occupancy, the second farm
// above .45.
function pkTurbines(c){
  const {Z,L,TAU,add,part,fract}=c, am=P.prTurb;

  for(let f=0;f<2;f++){
    const z=f?Z.uZTurb1:Z.uZTurb0;
    if(z[1]<=0||(f===1&&am<=.45))continue;
    const k=Math.round(z[2]), mode=z[3], R=pkR(pkHash(f,1200));
    const H0=85+35*R[0], R0=H0*(.47+.08*R[1]), C=2*R0*(3+.6*R[2]);
    const dz=mode>1.5?(mode<2.5?4500:8000):c.mtD(k);

      const d=dz*(1+(mode>1.5?.14:.09)*fr), ly=1201+4*f+fr, off=.37*fr, jit=1-2.3*R0/C, xm=(z[1]+.003)*TAU*d;

        else if(mode>1.5||P.mtW<.04){if(L.open(uc)<.5)continue;}       // big open flat land
        else{const h0=L.ridges(uc)[k];if(!L.turbOk(uc,k,d,h0))continue;       // gentle ground, lower half of the range only
          base=Math.max(h0-(fr<.5?1.5:8+25*r1[0])/d,base);}                // on the crest / behind it

// ---- street lamps: props layer, nearest. Rows are straight roads in the plan (see lampRow below), a lamp every sp m, each

// at the town's distance (seen side-on like the rest of the scene; a pier coming toward the camera drew the eye with its
// perspective and reflection) (else a second approach road), 3 an expressway with tall twin-arm masts. The nearest lamp of
// every row is at least 420 m away; a land road stops at the shore. Every road is a distant one seen mostly side-on (its

// ---- power lines: props layer. Lines uZPyl0..2 = (bearing of the nearest point, its distance p, farthest pylon, 1). Each is a

// along its length the full arms. Conductors are parallel plan lines (their arm offsets) with parabolic sag (3-4% of the
// span). One tower model per line, 32-54 m: a double-circuit tower (three crossarms, six conductors, earth wire) or a
// single-circuit 'cat-head' (V head, one wide crossarm, three conductors, two earth wires). Unlit. prPyl: 1 line, 2 above

// ---- town group: cranes, churches, town. Shared helpers (prefix town): the city's lot hash (the shader's hcell), the town's
// site and ground (the old churchSite / churchGround), a part writer that grows its instance's extent, and a tone factor
// expressed as the distance whose body tone it is (the interpreter's tone takes a distance).
function townHcell(L,x,y,k){return L.hu((Math.imul((Math.trunc(x)+8192)|0,0x9E3779B1)^((Math.imul((Math.trunc(y)+8192)|0,0x85ebca6b)+Math.imul(k|0,0xc2b2ae35)+Math.imul(Math.trunc(P.seed)|0,0x27d4eb2f))>>>0))>>>0);}
// the town's site: distance of the front row (m), row spacing (m), rise toward the back (m), rise inland (m); some waterfront
// towns are level (a lagoon town), the others climb a hillside
function townSite(c){const r=k=>c.L.rnd(k,1,1600),lev=c.Z.uZTownX[1]!==0&&r(3)<=.35,mix=c.mix;
  return [mix(1250,1800,r(1)),mix(46,64,r(2)),lev?mix(2,6,r(4)):mix(18,50,r(4)),lev?mix(5,9,r(3)):mix(10,20,r(3))];}
// ground (m above the water / plain) of the town's site at azimuth u, kf rows back: a 1.8 m quay plinth, the hillside rising
// inland and toward the back, an uneven wobble; fixed widths in u, so the site under an azimuth does not change when the town
// grows (only its ends move out)
function townGround(c,u,kf,S){
  const {L,Z}=c, sm=L.smooth; u=L.fract(u);

  const te=sm(hw,Math.max(hw-.022,hw*.45),adu), li=Z.uZTownX[1]!==0?sm(0,.012,-L.wd(u,Z.uZTownX[0])*Z.uZTownX[1]):1;
  const wob=(L.pn(u*120,120,1601)-.5)*.5+(L.pn(u*420,420,1602)-.5)*.25, back=Math.pow(c.clamp(kf/3,0,1.4),1.25);
  return 1.8*sm(hw,hw-.004,adu)+te*(S[3]*li*(1+.4*wob)+S[2]*back*c.mix(.45,1,li)*(1+wob));
}
function townTd(d,f){const nk=Math.min(Math.max(Math.log(d/400)/Math.log(12.5),0),1);   // prTone's near ramp (fog share ~1%)
  return f===1?0:400*Math.pow(12.5,Math.min(Math.max((f*(.6+.4*nk)-.6)/.4,0),1));}
// part writer: y in m above the plain (or the city's ground); an instance may stand on a foot (its base), so the interpreter
// skips it below that, and may be centred xo m to the side of the azimuth it is given (parts keep the caller's x); its
// half-width and top grow with its parts
function townKit(c){
  let I=null,X=0,Y=0,y0=0,x0=0;
  const g=(x,y)=>{X=Math.max(X,Math.abs(x));Y=Math.max(Y,y);};
  return {
    begin(o,foot,xo){y0=foot||0;x0=xo||0;if(foot)o.base=(foot-c.EYE)/o.d;if(xo)o.uc=c.fract(o.uc+xo/(c.TAU*o.d));I=c.add(o);X=0;Y=0;return I;},
    end(mx,my){I.hw=X+(mx===undefined?.5:mx);I.top=Y+(my===undefined?.5:my);},
    p(t,a,b){a=a.slice();b=b.slice();a[1]-=y0;a[0]-=x0;
      if(t===PT.SEG||t===PT.LAT||t===PT.GPROF){a[3]-=y0;a[2]-=x0;}
      if(t===PT.GPROF||t===PT.WASH)b[0]-=y0;
      c.part(t,a,b);
      if(t===PT.SEG||t===PT.LAT){const w=Math.max(b[0],b[1]);g(Math.abs(a[0])+w,a[1]+w);g(Math.abs(a[2])+w,a[3]+w);}
      else if(t===PT.TRAP){g(Math.abs(a[0])+Math.max(a[2],a[3]),a[1]+b[0]);}

      else if(t===PT.BEACON){g(Math.abs(a[0])+1,a[1]+1);}
      else if(t===PT.GPROF){g(Math.abs(a[0]),Math.max(a[1],a[3]));g(Math.abs(a[2]),0);}}

}

// ---- tower cranes: seen with the city camera (view 1). Each crane stands on a city lot that the city certainly leaves empty
// (its lot test at the largest share it can have), at the sector's edges or among the low blocks of its inner and outer rings;
// most stand beside an unfinished concrete frame. Beyond 1.25 x the downtown distance: slot 1, before the city (downtown hides
// them); nearer: props layer, hidden behind nearer city surfaces. A crane: lattice mast, slewing unit, cab, a hammerhead,
// flat-top or luffing jib slewed in 3D (its apparent length L x the sideways share), counter-jib with ballast, trolley and
// hook, red lights on top and at the jib tip, sometimes a work light. A frame: open floors (slab undersides seen from below),
// the columns of all four faces, a core shaft a storey ahead, often a climbing screen, a few work lights.
function pkCranes(c){
  const {Z,L,TAU,fract,mix,clamp}=c, am=P.prCrane, z=Z.uZCrane;

  const empty=(cx,cy,bu)=>{const rr=Math.hypot(cx+.5,cy+.5)/cD, dA=Math.abs(L.wd(bu,P.ctC));   // city3 never builds on lot (cx,cy)
    const aEnv=Math.max(1-sm(hsec-.04,hsec+.04,dA),P.ctW>=.999?1:0)*sm(0,.02,P.ctW), radl=sm(.5,.75,rr)*(1-sm(1.2,1.55,rr));
    return hb(hc(cx,cy,1),0)>=clamp(.03+P.ctD,0,.98)*1.15*aEnv*radl;};
  const view=w=>{const q=[w[0]-cam[0],w[1]-cam[1]], th=Math.atan2(q[1],q[0]);   // bearing, distance, ray and its tangent
    return {u:fract(th/TAU),d:Math.hypot(q[0],q[1]),dh:[Math.cos(th),Math.sin(th)],tg:[-Math.sin(th),Math.cos(th)]};};
  const cnt=Math.max(1,Math.floor(.5+12*am));
  for(let fi=0;fi<cnt;fi++){
    const h0=hc(fi,0,1300), r1=hb(h0,0), r2=hb(h0,1), r3=hb(h0,2), edge=r1<=.55;
    const b=edge?z[0]+(r2<.5?-1:1)*(hsec+(fract(r2*7.31)-.6)*.05):z[0]+(2*r2-1)*hsec*.85;
    const rad=D*(edge?mix(.62,1.45,r3):(r3<.5?mix(.58,.85,r3*2):mix(1.15,1.48,r3*2-1))), near=rad<=1.25*D;

    for(const o of [[0,0],[1,0],[0,1],[-1,0],[0,-1]]){
      const cx=Math.floor(w[0]/70)+o[0], cy=Math.floor(w[1]/70)+o[1], cm=[(cx+.5)*70,(cy+.5)*70];
      if(empty(cx,cy,b+(w[0]*cm[1]-w[1]*cm[0])/((w[0]*w[0]+w[1]*w[1])*TAU))){cell=[cx,cy];break;}}
    const onLand=Math.abs(L.wd(b,P.landC))<P.land*.5-.11&&P.land>.04?1:L.land(fract(b));

    const F=[S[0]+(hb(h1,3)-.5)*(26-hx),S[1]+(hb(h2,0)-.5)*(26-hz)], k4=Math.floor(hb(h2,1)*3.99), jt=hb(h2,2)-.5;
    const M=hasF?[F[0]+[hx+3.5,-hx-3.5,jt*hx,jt*hx][k4],F[1]+[jt*hz,jt*hz,hz+3.5,-hz-3.5][k4]]:[S[0]+(hb(h0,1)-.5)*30,S[1]+(hb(h0,2)-.5)*30];
    const tyr=hb(h2,3), ty=tyr<.5?0:(tyr<.85?1:2);       // hammerhead, flat-top, luffing

    const sa=Math.abs(sj), ca=Math.abs(cj), sg=sj<0?-1:1, mw=Math.abs(vm.tg[0])+Math.abs(vm.tg[1]), yj=Hm+3;
    const slot=near?2:1, hideC=near?1:0, BX=(x,y,hx,hy)=>p(PT.BOX,[x,y,hx,hy],[0,0,1,0]);
    // three instances with tight bounds: the mast; the head (cab, jib, counter-jib, A-frame, ties, lights); the hook
    const I0={slot,view:1,uc:vm.u,d:vm.d,hideC,glow:1.5}, beg=(foot,xo)=>K.begin(Object.assign({},I0),foot,xo);

// ---- churches: props layer, behind the town's back row on the slope it climbs. Type by the town's style (southern:
// campanili, domes; northern: spires): 0 a village church seen side-on (nave, lower apse, west tower with an octagonal spire),
// 1 a campanile beside a basilica, 2 a domed church; the second church is another type. Each stands level on a churchyard
// terrace, a smooth knoll (shoulders at most ~27 deg). Floodlit (60%): a faint warm wash up the tower; an evening service: its
// windows glow; a lit clock face (cooler white) and lit belfry openings (as bright as a lit window).
function pkChurches(c){
  const {Z,L,fract,mix}=c, z=Z.uZChurch;

  const K=townKit(c), p=K.p, rnd=L.rnd, S=townSite(c), sty=rnd(5,1,1600), nC=P.prChurch>=.55?2:1;

      box(-sg*(nl+2),y0,3,G+nh-1); tri(-sg*nl,G+nh-1,5,3.5);                   // the lower apse at the east end
      if(lit)for(let xn=5-nl;xn<=nl-2;xn+=5)LT(sg*xn,G+5.575,.75,2.575,-.75,.3,.8);   // tall arched nave windows

      BX(xt,ys+sp+.85,.13,1.85); BX(xt,ys+sp+1.8,.8,.13);                      // the cross

    }else if(t===1){

      const bl=mix(13,18,r[5]),wh=mix(15,19,r[3]),xb=sg*(cw+3+bl);           // the basilica beside the campanile

      box(xb,y0,bl,G+wh*.62); tri(xb,G+wh*.62,bl,bl*.25);                     // lower aisles
      if(r[4]>.55)p(PT.ELL,[xb,G+wh+2,7,7/1.15],[0,0,1,0]);                   // a small dome over the crossing
      if(lit)LT(xb,G+wh*.62,1.4,1.4,1.4,.3,.8);                               // the rose window
      grp(0);
      box(0,y0,cw,ch); box(0,ch-.4,cw+.5,ch+.5); box(0,ch,cw-.2,ch+bh); box(0,ch+bh-.2,cw+.5,ch+bh+.9);
      box(0,ch+bh,cw*.9,ya); tri(0,ya,cw*.95,sp); BX(0,ya+sp+1.1,.22,2.1);     // campanile, pyramidal spire, statue
      wash(90);
      if(flood){const bw=2*(cw-.2)/3;                                          // three arched belfry openings, lit inside
        for(let j=0;j<3;j++)LT(-(cw-.2)+bw*(j+.5),ch+(.9*bh+.27*bw)/2,.27*bw,(.6*bh+.27*bw)/2,-.27*bw,.36,.8);}
    }else{
      const bw=mix(14,19,r[1]),bh=mix(17,23,r[2]),dw=mix(8,11,r[3]),dh=mix(8,12,r[4]),ph=mix(1,1.3,r[5]);
      const rw=dw*1.06,y1=G+bh+dh,dt=y1+rw*ph,lw=mix(1.6,2.2,r[1]);
      K.begin({uc,d,glow:2},y0);
      box(0,y0,bw,G+bh); tri(0,G+bh,bw*.45,bw*.45*.35); box(0,y0,bw+9,G+bh*.62);   // body, pediment, side wings
      if(r[2]>.45){const bt=G+bh+mix(12,18,r[4]);                              // two small bell towers at the back
        for(const s of [-1,1]){box(s*(bw-2.8),y0,2.6,bt);tri(s*(bw-2.8),bt,2.7,4.5);}}
      if(lit)for(let xc=2-bw;xc<=bw-1.5;xc+=4)if(Math.abs(xc)>bw*.45)LT(xc,G+bh*.5,.7,2,0,.3,.8);
      grp(0);
      box(0,y0,dw,y1); p(PT.ELL,[0,y1,rw,rw*ph],[0,1,1,0]);                    // drum and dome
      box(0,dt-1.5,lw,dt+6.5); p(PT.ELL,[0,dt+6.5,lw*1.1,lw*1.1/1.4],[0,0,1,0]);   // lantern and cupola
      BX(0,dt+9,.15,2); BX(0,dt+9.8,.8,.15);                                   // the cross

}

// ---- town: props layer. Four rows of houses, back to front, on the shared site (level along a quay, climbing a hillside inland
// and toward the back), each a line of houses on a lateral grid in metres at its own distance (true perspective between rows),
// with its own band of ground. Houses: cells of C m, pairs of cells sometimes one larger block; whole houses inside the zone;
// on the quay terraced. Roofs by the town's style (southern: flat and low, Venetian funnel chimneys; northern: steep gables).
// Windows: whole cells inside the wall with solid margins, floors of fh, sills .9 m up, rooms of one or two windows sharing a
// state, 10% cooler, a lit shop floor, attic and dormer windows. Street lamps in front of each row (sodium or white LED) and
// along a waterfront a string of quay lamps; they wash the walls behind them.
function pkTown(c){
  const {Z,L,TAU,fract,mix,clamp}=c, z=Z.uZTown;
  if(P.prTown<=0||z[1]<=0)return;
  const K=townKit(c), p=K.p, rnd=L.rnd, sm=L.smooth, S=townSite(c), sty=rnd(5,1,1600), sea=Z.uZTownX[1], shore=Z.uZTownX[0];
  const wp=P.winD*mix(.5,.9,rnd(6,1,1600)), sod=rnd(7,1,1600)<.65?.75:1.6, dens=.5+.5*P.prTown;
  const inland=u=>sea!==0?sm(0,.012,-L.wd(u,shore)*sea):1;   // 0 on the waterfront .. 1 inland
  const lamp=(l,x)=>{const hl=l.quay?4.3:5.5;              // street lamp: pole and light (the quay's lower, brighter, every 17 m)
    p(PT.TRAP,[x,l.Gl,.06,.06],[hl,0,1,0]); p(PT.LIGHT,[x,l.Gl+hl,l.quay?.16:.2,1],[0,l.quay?1.8:1.3,0,l.kw]);};
  for(let k=3;k>=0;k--){
    const d=S[0]+k*S[1], ly=k*8, X=z[1]*TAU*d, xu=x=>z[0]+x/(TAU*d);
    // its band of ground: columns between samples every 1/1680 turn (four per cell of the finer wobble; within ~.4 m), eight
    // per instance
    const n0=Math.floor((z[0]-z[1])*1680), n1=Math.ceil((z[0]+z[1])*1680), gs=[];
    for(let j=n0;j<=n1;j++){const u=Math.min(Math.max(j/1680,z[0]-z[1]),z[0]+z[1]);gs.push([(u-z[0])*TAU*d,townGround(c,u,k,S)]);}
    for(let j=0;j+1<gs.length;j+=8){
      const seg=gs.slice(j,Math.min(j+9,gs.length));
      if(seg.every(s=>s[1]<.02))continue;
      const xc=.5*(seg[0][0]+seg[seg.length-1][0]);
      K.begin({uc:fract(xu(xc)),d,td:townTd(d,.9)});
      for(let i=0;i+1<seg.length;i++)if(seg[i+1][0]>seg[i][0]+1e-3)p(PT.GPROF,[seg[i][0]-xc,seg[i][1],seg[i+1][0]-xc,seg[i+1][1]],[0,0,1,0]);
      K.end(.5,.5);
    }
    // the street in front of this row: its lamps (a continuous string along the quay)
    const C=mix(9,13.5,rnd(k,1,1610)), off=rnd(k,2,1610)*2*C, Ls=k===0?17:mix(24,34,rnd(k,3,1610)), offL=rnd(k,4,1610)*Ls, lamps=[];
    for(let jl=Math.ceil((offL-.94*X)/Ls);jl*Ls-offL<=.94*X;jl++){
      const xl=jl*Ls-offL, ul=xu(xl), quay=k===0&&inland(ul)<=.5, cn=1-sm(0,Math.max(z[1],.03),Math.abs(xl/(TAU*d)));
      if(quay||rnd(jl,4*k+20,1612)<=.75*mix(.5,1,cn))lamps.push({xl,ul,Gl:townGround(c,ul,k-.12,S),quay,kw:quay||sod<1?.75:sod});
    }
    // houses: where they stand
    const hs=[];
    for(let ci=Math.floor((off-X)/C)-1;ci<=Math.floor((off+X)/C)+1;ci++){
      const ce=ci-(((ci%2)+2)%2), blk=rnd(ce,ly+3,1611)<=mix(.3,.12,sty);
      if(blk&&ci!==ce)continue;                            // a block over a pair of cells: once
      const hid=blk?ce:ci, rw=rnd(hid,ly+4,1611), rj=rnd(hid,ly+5,1611);
      let hw,xh;
      if(blk){hw=C*mix(.8,.98,rw);xh=(ce+1)*C+(rj-.5)*(2*C-2*hw);}
      else{const wfc=k===0&&sea!==0?1-inland(xu((ci+.5)*C-off)):0;   // a quay cell: terraced
        hw=.5*C*mix(mix(.55,.85,wfc),1,rw*rw*(3-2*rw));xh=(ci+.5)*C+(rj-.5)*(C-2*hw);}
      xh-=off;
      const duh=xh/(TAU*d), cn=1-sm(0,Math.max(z[1],.03),Math.abs(duh)), wf=k===0?1-inland(xu(xh)):0;
      if(rnd(hid,ly+6,1611)<=dens*mix(.35,1,Math.sqrt(cn))+.4*wf&&Math.abs(duh)+(hw+1)/(TAU*d)<=z[1])hs.push({blk,hid,hw,xh,cn,wf,lamps:[]});   // whole houses inside the zone
    }
    // a lamp goes with the house it stands in front of, else the next one to its right (drawn after the house on its left), else
    // the one on its left: its pole and light come after that house's parts, over the row; lone lamps get their own instance
    const lone=[];
    for(const l of lamps){
      let h=hs.find(q=>Math.abs(l.xl-q.xh)<=q.hw+.5)||hs.find(q=>q.xh-q.hw>l.xl&&q.xh-q.hw-l.xl<15);
      if(!h){for(let i=hs.length-1;i>=0;i--)if(hs[i].xh+hs[i].hw<l.xl){if(l.xl-hs[i].xh-hs[i].hw<15)h=hs[i];break;}}
      (h?h.lamps:lone).push(l);
    }
    for(const H of hs){
      const {blk,hid,hw,xh,cn,wf}=H, uh=xu(xh);
      const Gh=townGround(c,uh,k,S);                       // level, on the ground at its centre (foundations 4 m into the slope)
      const ns=clamp(Math.floor(1.2+2*cn+1.6*rnd(hid,ly+7,1611)+wf*(.6+1.2*rnd(hid,ly+12,1611))+(blk?.8:0)),1,5);
      const rr=rnd(hid,ly+8,1611), pF=mix(.38,.06,sty)+wf*.12+(blk?.2:0);
      const rt=rr<pF?(sty<.5&&fract(rr*91.7)<.45?4:3):(hw<6.5&&fract(rr*37.3)<mix(.25,.6,sty)?0:(fract(rr*53.1)<mix(.65,.4,sty)?1:2));
      const sh=rnd(hid,ly+9,1611)<=wf*.6+(1-wf)*.25*cn*(k<=1?1:0), wpH=wp*mix(.3,1.3,rnd(hid,ly+10,1611));
      const id=hid+k*300+2000, r1=rnd(id,1,1620),r2=rnd(id,2,1620),r3=rnd(id,3,1620),r4=rnd(id,4,1620);
      const fh=2.85+.35*r1, hW=ns*fh+.6, he=hw+.35, pit=mix(.62,1.05,r2), rise=rt===0?he*pit:(rt<=2?Math.min(mix(2.6,4.4,r3),he*.95):.9);
      const yr=Gh+hW-.2, roofY=ax=>rt===0?rise*(1-ax/he):(rt===1?Math.min(rise,(he-ax)*1.25):(rt===2?rise:1.1));
      const yf=Math.min(Math.max(Gh-4,0),...H.lamps.map(l=>l.Gl));
      K.begin({uc:fract(uh),d,td:townTd(d,mix(.8,1.15,rnd(hid,ly+11,1611))),glow:H.lamps.length?1.5:0},yf);
      p(PT.TRAP,[0,yf,hw,hw],[Gh+hW-yf,0,1,0]);                                   // wall
      for(const l of lamps)if(Math.abs(l.xl-xh)<hw+14)p(PT.WASH,[l.xl-xh,l.Gl,6.325,2.5],[0,l.quay?.014:.008,0,l.kw]);   // lamp-lit wall
      if(rt===0)p(PT.TRAP,[0,yr-.05,he*(1+.05/rise),0],[rise+.05,0,1,0]);            // gable to the front
      else if(rt===1)p(PT.TRAP,[0,yr-.05,he+.04,he-rise/1.25],[rise+.05,0,1,0]);    // hipped
      else if(rt===2)p(PT.TRAP,[0,yr-.05,he,he],[rise+.05,0,1,0]);                  // gabled to the side (seen eave-on)
      else p(PT.TRAP,[0,yr-.05,hw,hw],[1.15,0,1,0]);                                // flat with a parapet
      const cx=(r4*2-1)*hw*.55, chw=mix(.3,.45,fract(r4*3.3)), yc=Gh+hW-1;
      const chim=(x,top)=>p(PT.TRAP,[x,yc,chw,chw],[top-yc,0,1,0]);
      if(rt<=2){
        if(r3>.25)chim(cx,yr+roofY(Math.abs(cx))+mix(.9,1.6,fract(r4*7.7)));
        if(hw>5.5&&r1>.5){const c2=-cx*.8+Math.sign(-cx+1e-3)*1.5;chim(c2,yr+roofY(Math.abs(c2))+1);}
      }else if(rt===4){const ct=Gh+hW+2.6;                // Venetian funnel chimneys
        chim(cx,ct-1.4);p(PT.TRAP,[cx,ct-1.4,chw,2.4*chw],[1.4,0,1,0]);
        if(hw>5){chim(-.7*cx,ct-1.6);p(PT.TRAP,[-.7*cx,ct-1.6,chw,2.4*chw],[1.4,0,1,0]);}
      }else if(r3>.55)p(PT.TRAP,[cx*.6,yc,1.7,1.7],[3.4,0,1,0]);                   // a stair house on the flat roof
      // windows: whole cells inside the wall with a solid margin at both ends, floors of fh, sills .9 m up; only the lit ones exist
      const mg=Math.max(.9,.18*hw), Wi=2*hw-2*mg, nc=Math.max(1,Math.floor(Wi/mix(2.6,3.4,r3)+.5)), cw=Wi/nc, gsz=r2>=.55?2:1;
      for(let fi=0;fi<ns;fi++)for(let ci2=0;ci2<nc;ci2++){
        const shop=sh&&fi===0, rl=rnd(id,10+fi*16+Math.floor(ci2/gsz),1621), rc=rnd(id,11+fi*16+ci2,1621);   // rooms of one or two windows share a state
        if(rl+1e-4>wpH*(shop?1.8:1))continue;
        const wb=.3+fi*fh+(shop?.55:.9), wt=wb+(shop?2:1.45), wwh=Math.max(Math.min(mix(.55,.7,r1)+(shop?.4:0),.5*cw-.32),.1);
        p(PT.BOX,[-hw+mg+(ci2+.5)*cw,Gh+.5*(wb+wt),wwh,.5*(wt-wb)],[0,.5*(.55+.55*fract(rc*13.7)),0,rc>=.9?1.5:.8]);   // 10% cooler
      }
      if(rt===0&&rise>2.2){if(rnd(id,5,1621)+1e-4<=wpH*.6)p(PT.BOX,[0,yr+rise*.3,.42,.5],[0,.4,0,.8]);}   // attic window in a gable that faces us
      else if(rt<=2&&rise>3)for(let ci2=0;ci2<nc;ci2++){const x=-hw+mg+(ci2+.5)*cw;                      // dormers in a roof that slopes away
        if(Math.abs(x)<=he-2.2&&rnd(id,6+ci2,1621)+1e-4<=wpH*.45)p(PT.BOX,[x,Gh+hW+.75,.45,.5],[0,.4,0,.8]);}
      for(const l of H.lamps)lamp(l,l.xl-xh);
      K.end(.5,.5);
    }
    for(const l of lone){K.begin({uc:fract(l.ul),d,glow:1.5},l.Gl);lamp(l,0);K.end(.5,.5);}
  }
}


// ---- bridge: props layer, one per circle (zone uZBridge; uZBridgeX = (1 over water / 0 across a valley, shore azimuth, sea
// side); prBridge: the zone's width, i.e. the bridge's length). A straight line in the world, its middle at bearing uZBridge.x
// and d0 (2.5-3.6 km) away, turned by beta from lateral, so it recedes in real perspective (the far tower smaller, every deck
// level in the world): one line frame along the axis, parts beside it on their own parallel lines (deck edges, cable planes).
// Headlands (or the valley sides) rise at both ends of the zone and carry the ends of the deck. Types by seed: suspension,
// steel through-arch (deck arch over a valley), girder / truss, cable-stayed. Lights: deck lamps (both edges), car lights,
// small red beacons on tower tops / the arch crown. The industry in front hides it (hideI). Parts: the hills as profiles
// (PROF), deck, bars, trusses (PBAND), cables (ARC), stays (FAN), towers and piers (TRAP, SEG), lights (SLR). Instances: the
// spine (deck and the long parts), the towers and piers in short chunks, the stay fans, the hills in chunks, and one for
// every light, a few metres nearer than the axis so the bridge's own body never dims its lights.
Object.assign(PT,{PROF:40,PBAND:41,SLR:42,FAN:43});
function pkBridge(c){
  const {Z,L,TAU,add,part,mix,clamp}=c, z=Z.uZBridge, zx=Z.uZBridgeX;
  if(P.prBridge<=0||!(z[1]>0))return;
  const smooth=L.smooth, pn=L.pn, [r0,r1,r2,r3,r4,r5,r6,r7]=[0,1,2,3,4,5,6,7].map(i=>L.rnd(i,1,1800));
  const wat=zx[0]>=.5?1:0;
  const ty=wat?(r0<.28?0:(r0<.52?1:(r0<.78?3:2))):(r0<.35?1:(r0<.7?3:2));   // 0 suspension, 1 arch, 2 girder / truss, 3 cable-stayed
  const d0=2500+1100*r1;
  const beta=(r3<.5?-1:1)*.0174533*(ty<.5?mix(10,22,r2):(ty<1.5?mix(3,16,r2):mix(0,12,r2)));   // mostly lateral: far decks read level
  // the axis: s (m) along it from its middle M (bearing z.x, d0 away), toward larger bearings
  const u0=z[0]*TAU, er=[Math.cos(u0),Math.sin(u0)], et=[-er[1],er[0]], sb=Math.sin(beta), cb=Math.cos(beta);
  const tv=[sb*er[0]+cb*et[0],sb*er[1]+cb*et[1]], lf=[-tv[1],tv[0]], ang=Math.atan2(tv[1],tv[0]), pp=d0*cb;   // lf: toward the camera
  const X=s=>[d0*er[0]+s*tv[0],d0*er[1]+s*tv[1]];
  // the view at s: cv = cos(th+beta) (a length along the axis shows x cv), sv = sin(th+beta); a part n m beside the axis (n > 0 away
  // from the camera) at s0 is seen where the axis has s0 - n tph: in the axis' local frame at x = -n sv
  const fr=s=>{const x=X(s),D=Math.hypot(x[0],x[1]),sv=(x[0]*tv[0]+x[1]*tv[1])/D,cv=pp/D;return {cv,sv,asv:Math.abs(sv),tph:sv/cv};};
  // ---- layout along the axis: hills at both ends, the water (or valley) between their feet
  const A=z[1]*TAU, sL=-d0*Math.sin(A)/Math.cos(beta-A), sR=d0*Math.sin(A)/Math.cos(beta+A), Lt=sR-sL;
  let wFL=.2,wFR=.2;
  if(wat){const tsh=L.wd(zx[1],z[0])*TAU, ssh=d0*Math.sin(tsh)/Math.cos(tsh+beta);
    wFL=.14;wFR=.14;
    if(zx[2]>0)wFL=clamp((ssh-sL)/Lt+.03,.12,.34); else wFR=clamp((sR-ssh)/Lt+.03,.12,.34);}   // the land end straddles the shore
  wFL*=mix(.85,1.15,r4); wFR*=mix(.85,1.15,r5);
  const sFL=sL+wFL*Lt, sFR=sR-wFR*Lt, Lw=sFR-sFL, sm=.5*(sFL+sFR);
  const sCL=sL+.58*(sFL-sL), sCR=sR-.58*(sR-sFR);   // hill crests: the deck runs between them
  // ---- type parameters (m)
  let Hd,dDep,Wd,Hmax,Lm=0,sT1=0,sT2=0,Ht=0,sA1=0,sA2=0,La=0,Hcr=0,ySp=0,De=0,Dc=0,hump=0;
  const sty=r6>=.5?1:0, Sp=60+70*r6, trs=(r7>=.45?1:0)*wat;   // arch: springing at the water with pylons; girder spans, truss over the deck
  let csNP=1,csT1=0,csT2=0,csRm=0,csRb=0,csHp=0,csShp=0,csNC=8,csHarp=0;
  if(ty===0){
    const dl=clamp(.05*Lw,25,90);
    Lm=Math.min(Lw-2*dl,1300); sT1=sm-.5*Lm; sT2=sm+.5*Lm;
    Hd=clamp(22+.036*Lm,28,70); Ht=Hd+.105*Lm+14; Wd=18+.008*Lm; dDep=3+.004*Lm;
    const Ls=clamp(.33*Lm,60,Math.max(sT1-sCL-15,40)); sA1=sT1-Ls; sA2=sT2+Ls; Hmax=Ht+4;
  }else if(ty===1){
    La=clamp(Lw-40,150,550);
    if(wat){Hd=clamp(18+.05*La,25,50); dDep=3.5; ySp=sty?6:Hd-dDep; De=sty?.1*La+4:.018*La+3; Dc=sty?.032*La+3:.018*La+3; Hcr=sty?Hd+.17*La+8:Hd+.2*La;}
    else{Hd=55+50*r7; dDep=4; ySp=0; De=.06*La+3; Dc=.025*La+2.5; Hcr=Hd-dDep-.5;}   // deck arch: springs low on the valley sides, crown under the deck
    Wd=20+.01*La; Hmax=Math.max(Hcr,Hd+38*sty*wat)+4;
  }else if(ty===3){
    csHarp=r7<=.35?1:0; csShp=Math.floor(r5*2.999);   // 0 H pylons, 1 A pylons, 2 inverted Y
    if(Lw>650&&r6>.3){csNP=2; Lm=Math.min(.56*Lw,900); csT1=sm-.5*Lm; csT2=sm+.5*Lm;   // long crossings: two pylons, a main span between them
      csRm=.47*Lm; csRb=clamp(Math.min(.42*Lm,csT1-sCL-20),60,.42*Lm); csHp=.21*Lm+10;}
    else{csRm=Math.min(.52*Lw,330); csRb=.7*csRm; csT1=sm-.5*(csRm-csRb); csT2=csT1; csHp=.5*csRm+10; Lm=2*csRm;}   // one pylon, an unequal back span
    csHp*=mix(1,1.2,csHarp);   // harps need taller pylons
    Hd=wat?clamp(20+.03*Lm,24,55):55+50*r7; dDep=2.5+.002*Lm; Wd=20+.008*Lm;
    csNC=clamp(Math.floor(csRm/14),8,22); Hmax=Hd+csHp+6;
  }else{
    Hd=wat?18+17*r7:55+50*r7; hump=wat*(2+4*r5);
    dDep=3+.035*Sp; Wd=16+6*r4; Hmax=Hd+hump+(trs?clamp(.14*Sp,9,18):0)+12;
  }
  const pkL=(Hd+12)*mix(1.1,1.35,r4)+(1-wat)*25, pkR=(Hd+12)*mix(1.1,1.35,r5)+(1-wat)*25;
  // deck line: level, or (girder over the water) a gentle rise over the middle, hump*exp(-hx^2) with hx=(s-sm)/(.45Lw), here fitted
  // by one parabola over the deck (least squares) so the deck and everything on it stay parabolas
  let q0=0,q2=0;
  if(hump>0){const xm=Math.max(sm-sCL,sCR-sm)/(.45*Lw);let S2=0,S4=0,G0=0,G2=0,n=0;
    for(let i=0;i<=64;i++){const x=xm*(i/32-1),x2=x*x,g=Math.exp(-x2);n++;S2+=x2;S4+=x2*x2;G0+=g;G2+=g*x2;}
    const det=n*S4-S2*S2; q0=(G0*S4-G2*S2)/det; q2=(n*G2-S2*G0)/det;}
  const yD=s=>{const x=(s-sm)/(.45*Lw);return Hd+hump*(q0+q2*x*x);}, dTop=s=>yD(s)+1, dBot=s=>yD(s)-dDep, dT=Hd+1, dB=Hd-dDep;
  const par=(f,a,b)=>{const ya=f(a),yb=f(b);return [ya,yb,.5*(ya+yb)-f(.5*(a+b))];};   // a parabola over [a,b]: end heights, sag
  // end hills: rise from the zone's edge, crest, fall to the foot; relief noise and a ragged woodland edge (the old shader's
  // bridgeHillH, exactly)
  const hill=x=>{
    const w=x<sFL?(x-sL)/(sFL-sL):(x>sFR?(sR-x)/(sR-sFR):-1);
    if(w<=0||w>=1)return 0;

      if(grid(0,8,a,b,last).length)rep(...row(S,8,0),[BOX(0,0,.35,yG-1.3)]);
      if(grid(0,25,a,b,last).length)rep(...row(S,25,0),[BOX(0,yG,.08,4.4)]);
    }]);
    if(grid(0,25,a,b,last).length)FL[j].push([yG+5.9,S=>rep(...row(S,25,0),[LIG(0,yG+4.5,.22,1.6,WARM)])]);
  }
  // ---- drop tower: mast, top cap, ride ring, base; bulbs up both edges and around the ring; a beacon
  if(tOn){
    const Hdt=yG+55+35*r[15], yR=yG+6+(Hdt-yG-22)*r[9], n=Math.floor((Hdt-5-yG)/2.6)-1;
    inst(BODY,xT,5.5,Hdt+1.5,()=>{
      put(BOX(0,yG,1.8,Hdt-yG));put(BOX(0,Hdt-5,3.2,5));put(BOX(0,yR-1.2,4.5,2.4));put(BOX(0,yG,5,4));
      if(n>0)rep([0,yG+5.2,0,2.6],[n,0],[LIG(-1.95,0,.1,.6,COOL),LIG(1.95,0,.1,.6,COOL)]);
      part(PT.LROW,[-3,yR-1.25,3,.1],[1.5,0,.8,WARM]); part(PT.BEACON,[0,Hdt+.8,0,0],[0,0,0,0]);
    });
  }
  // ---- carousel: drum, conical roof, finial; bulbs round the roof's rim and down the cone
  if(kOn){
    const xK=r[8]<.5?-W+12:W-12, Rk=7+3*r[9], sl=5/(Rk+1), nb=Math.floor((Rk+.7)/2), n=Math.floor((Rk+.8)/1.2);
    inst(BODY,xK,Rk+1.5,yG+10.8,()=>{
      put(BOX(0,yG,Rk,4.2));put(BOX(0,yG+3.9,Rk+1,5.3,0));put(BOX(0,yG+8,.12,2.6));
      part(PT.LROW,[-1.2*n,yG+4.25,1.2*n,.1],[1.2,0,.8,WARM]);
      rep([0,yG+8.95,-2,-2*sl],[nb+1,0],[LIG(0,0,.09,.5,WARM)]);
      if(nb>0)rep([2,yG+8.95-2*sl,2,-2*sl],[nb,0],[LIG(0,0,.09,.5,WARM)]);
    });
  }
  // ---- Ferris wheel: rims, spokes and hub drawn in x/ex (the plane turned from the view: c = [0, 0, 1/ex]); gondolas hang
  // upright below their pivots on the rim; A-frame legs, their brace, the boarding platform
  {
    const ex=mix(.82,1,r[10]), nS=16+4*Math.floor(r[11]*2.999), ph=fs>0?r[12]*TAU:Math.PI-r[12]*TAU, gs=.055*Dw+.8, cw=[0,0,1/ex];
    const fx=.62*Rw*ex, yb=yG+.32*(yH-yG), al=Math.PI/nS;
    inst(BODY,xW,Rw*ex+.5*gs+1,yH+Rw+1.2,()=>{
      part(PT.RING,[0,yH,Rw,1],[.32+.004*Dw,0,0,0],cw);
      if(Dw>=36)part(PT.RING,[0,yH,.91*Rw,1],[.22,0,0,0],cw);
      const sp=[SEG(.06*Rw,0,Rw,0,.16)]; for(let rk=1.6;rk<=Rw-1;rk+=3.2)if(rk>=.12*Rw)sp.push(LIG(rk,0,.12,.6,WARM));
      rep([0,yH,0,1],[nS,1,ph],sp,cw);                                                           // spokes, bulbs along them
      part(PT.ELL,[0,yH,.065*Rw,.065*Rw],[0,0,1,0],cw);
      rep([0,yH-.7*gs,Rw,ex],[nS,2,ph],[BOX(0,-.5*gs,.42*gs,gs),SEG(0,0,0,.75*gs,.08)]);
      put(SEG(0,yH,-fx,yG,.45)); put(SEG(0,yH,fx,yG,.45)); put(SEG(-.68*fx,yb,.68*fx,yb,.3)); put(BOX(0,yG,.45*Rw,3.4));
      const ca=Rw*Math.cos(al/4), sa=Rw*Math.sin(al/4);                                         // 4 nS bulbs round the rim
      rep([0,yH,0,1],[2*nS,1,ph+al/4],[LIG(ca,-sa,.16,1.05,WARM),LIG(ca,sa,.16,1.05,r[13]<.5?WARM:COOL)],cw);
      put(LIG(0,yH,.45,1.2,WARM));
    });
  }
  // ---- roller coaster: track height prof(x): station 4.5 m, lift hill to H, first drop, three humps; the double rails as
  // parabola pieces (PT.ARC) fitted to it (the lower rail 1.35 m below along the normal); steel columns every 9 m with braces
  // in alternate bays, or a wooden trestle (5 m lattice bays clipped under the track); the station; bulbs every 4 m
  if(Lc){
    const H=30+25*r[14], steel=r[15]<.5, bulbs=r[13]>=.5;
    const sm=(e0,e1,v)=>{const t=clamp((v-e0)/(e1-e0),0,1);return t*t*(3-2*t);};
    const prof=x=>{const f=(x-xC0)/Lc, g1=(f-.53)/.065, g2=(f-.70)/.055, g3=(f-.85)/.045;
      return yG+4.5+(H-4.5)*sm(.07,.30,f)*(1-sm(.30,.41,f))+H*(.62*Math.exp(-g1*g1)+.40*Math.exp(-g2*g2)+.22*Math.exp(-g3*g3));};
    const low=x=>{const s=.5*(prof(x+1)-prof(x-1));return prof(x)-1.35*Math.sqrt(1+s*s);};
    const fit=(f,xa,xb)=>{const ya=f(xa),yb=f(xb),sag=.5*(ya+yb)-f(.5*(xa+xb));let e=0;
      for(let i=1;i<8;i++){const u=i/8;e=Math.max(e,Math.abs(ya+(yb-ya)*u-4*sag*u*(1-u)-f(xa+(xb-xa)*u)));}return [ya,yb,sag,e];};
    const split=(xa,xb,out)=>{const a=fit(prof,xa,xb),b=fit(low,xa,xb);
      if((a[3]>.1||b[3]>.1)&&xb-xa>1){split(xa,.5*(xa+xb),out);split(.5*(xa+xb),xb,out);}else out.push([xa,xb,a,b]);};
    const nc=Math.max(1,Math.round(Lc/18)), cl=Lc/nc, kmax=Math.ceil(Lc/5)-1;
    for(let ci=0;ci<nc;ci++){                      // 18 m chunks: track pieces, the trestle under them or the steel supports
      const c0=xC0+ci*cl, c1=c0+cl, xc=.5*(c0+c1), last=ci===nc-1, segs=[]; split(c0,c1,segs);
      let top=yG+6; for(let x=c0;x<=c1;x+=.5)top=Math.max(top,prof(x));
      inst(BODY,xc,.5*cl+1,top+1.3,S=>{
        for(const [xa,xb,a,b] of segs){
          const sw=fs<0, sA=Math.min(S(xa),S(xb)), sB=Math.max(S(xa),S(xb));
          const arc=(e,w,dy)=>[PT.ARC,[sA,(sw?e[1]:e[0])+dy,sB,(sw?e[0]:e[1])+dy],[e[2],w,1,0]];
          put(arc(a,.28,0)); put(arc(b,.22,0));
          if(!steel){                              // lattice bays every 5 m, under the track less 1.4 m
            const k0=Math.max(0,Math.floor((xa-xC0)/5)), k1=Math.min(kmax,Math.floor((xb-xC0-1e-6)/5));
            part(PT.CLIP,arc(a,0,-1.4)[1],[a[2],0,0,2]);
            rep([S(xC0+2.5+5*k0),0,fs*5,0],[k1-k0+1,0],[[PT.LAT,[0,yG,0,Math.max(a[0],a[1],.5*(a[0]+a[1])-a[2])],[2.5,2.5,5,.18]]]);
          }
        }
        if(steel){                                 // columns every 9 m; braces every 9 m up in alternate bays, 6 m under the track
          for(const x of grid(xC0,9,c0,c1,last))put(BOX(S(x),yG,.32,prof(x)-1.4-yG));
          for(let m=Math.floor((c0-xC0)/18);xC0+18*m<c1;m++){
            const bA=Math.max(xC0+18*m,c0), bB=Math.min(xC0+18*m+9,c1); if(bB<=bA)continue;
            const N=Math.ceil((bB-bA)/.25), xs=[]; for(let i=0;i<=N;i++)xs.push(Math.min(bA+i*.25,bB));
            for(let y=yG+9;y<yG+H;y+=9){let i0=-1;
              for(let i=0;i<=N+1;i++){const ok=i<=N&&prof(xs[i])-6>y;
                if(ok&&i0<0)i0=i; else if(!ok&&i0>=0){if(i-1>i0)put(SEG(S(xs[i0]),y,S(xs[i-1]),y,.2));i0=-1;}}}
          }
        }
        if(ci===0)put(BOX(S(xC0+.035*Lc),yG,.035*Lc,6));   // station
        if(bulbs)for(const x of grid(xC0,4,c0,c1,last))put(LIG(S(x),prof(x)+.6,.1,.7,COOL));
      });
    }
  }
  // ---- booths along the front, one per 9 m cell (fewer when the slider is low), bulb strings under the eaves
  for(let cc=Math.floor(-W/9);cc<=Math.floor(W/9);cc++){
    const bx=(cc+.5)*9+(rnd(cc,1,1901)-.5)*2;
    if(rnd(cc,2,1901)>.25+.55*am||bx<-W+3||bx>W-3)continue;
    const bw=2+1.5*rnd(cc,3,1901), bh=3.2+1.6*rnd(cc,4,1901), tent=rnd(cc,5,1901)>=.6, kw=rnd(cc,6,1901)<.5?WARM:COOL, n=Math.floor((bw-.2)/.9);
    GB[chunkOf(bx)].push([yG+bh+(tent?2:.2),S=>{put(BOX(S(bx),yG,bw,bh));if(tent)put(BOX(S(bx),yG+bh,bw,1.8,0));}]);
    FL[chunkOf(bx)].push([yG+bh+.2,S=>{const s=S(bx);part(PT.LROW,[s-.9*n,yG+bh-.35,s+.9*n,.08],[.9,0,1.1,kw]);}]);
  }
  for(let j=0;j<nF;j++){const xc=xe+(j+.5)*cF;
    if(GB[j].length)inst(GROUND,xc,.5*cF+5,Math.max(...GB[j].map(e=>e[0])),S=>{for(const e of GB[j])e[1](S);});
    if(FL[j].length)inst(LIT,xc,.5*cF+5,Math.max(...FL[j].map(e=>e[0])),S=>{for(const e of FL[j])e[1](S);});}
  for(const f of GROUND)f(); for(const f of BODY)f(); for(const f of LIT)f();
}


// ---- extras: radio / TV masts, distant lights, farms, the coast (a lighthouse, ships). Props layer (slot 2), scenery view.
// Ports of the old shader stubs; they keep its rnd() layers (1900-1932), so every seed keeps its layout. Distant things stand
// on the near ground band's top line (exRise), which otherwise hides everything low and far away; feet are sunk 1-2 m into
// it. Bodies are TRAP / ELL / SEG parts; lights LIGHT and WIN, and the extras' own BEAM, LBOX and CLIGHT.
function exRise(L,u){u=L.fract(u);return (.0035+.0025*L.fbm(u,24,500))*L.land(u);}   // elevation (rad) of the near ground rise (main's gh)
// a box from y0 up to y1, centre x, half-width w (opacity op)
function exBox(part,x,y0,y1,w,op){part(PT.TRAP,[x,y0,w,w],[y1-y0,0,op===undefined?1:op,0]);}
// a building seen side-on, centre x: walls up to Hw, a gable roof up to Hr (continued .3 m down into the walls: no seam at
// the eaves, which overhang a little)
function exGable(part,x,W,Hw,Hr){const hw=.5*W,o=.3;exBox(part,x,0,Hw,hw);part(PT.TRAP,[x,Hw-o,hw*(1+o/(Hr-Hw)),0],[Hr-Hw+o,0,1,0]);}
// red aviation light s times the city's beacons (the beacon's haze dimming folded into the amplitude), d m away
function exBeacon(part,x,y,s,d){part(PT.CLIGHT,[x,y,0,s*.07*(1-.6*(1-Math.exp(-d/70*(.004+.0185*P.haze))))],[1,.08,.03,0]);}

// ---- radio / TV masts: guyed lattice masts with red lights up their height, or a concrete TV tower with a pod. Sites from
// propZones (uZMast*): on the skyline ridge (range 3 or 4) or on open treeless land.
function pkMasts(c){
  const {Z,L,add,part}=c;
  if(P.prMast<=0)return;
  for(let i=0;i<4;i++){
    const uc=Z.uZMastU[i]; if(uc<0)continue;
    const k=Z.uZMastK[i], d=Z.uZMastD[i], H=Z.uZMastH[i];
    const base=k<-.5?Math.max(-c.EYE/d,exRise(L,uc))-1.5/d:Math.max(L.ridges(uc)[k],-c.EYE/d)-2/d;   // feet sunk 1.5 m (land) / 2 m (ridge)
    add({uc,d,base,hw:.75*H+15,top:1.05*H+3,hideC:1,hideM:1});
    if(L.rnd(i,3,1900)<=.3&&k<-.5){              // a concrete TV tower on open land
      part(PT.TRAP,[0,0,8,3.5],[.72*H,0,1,0]);  // the tapering shaft
      exBox(part,0,.7*H,.86*H,3.5);
      part(PT.ELL,[0,.72*H,13,6],[0,0,1,0]);     // the pod (observation deck)
      exBox(part,0,.8*H,H,1);                    // antenna
      if(P.winD>0)part(PT.LBOX,[0,.72*H,12,.8],[0,.3*P.winD,0,.8]);   // lit pod windows
      exBeacon(part,0,H+1,1,d); exBeacon(part,0,.86*H,.8,d);
    }else{                                       // a guyed mast
      exBox(part,0,0,H,1.2);
      for(let g=0;g<3;g++){const yk=H*(.32+.31*g), xk=H*(.30+.12*g);   // guy wires down to anchors on both sides, red lights up the mast
        part(PT.SEG,[0,yk,xk,0],[.05,.05,1,0]); part(PT.SEG,[0,yk,-.85*xk,0],[.05,.05,1,0]); exBeacon(part,0,yk,.9,d);}
      exBeacon(part,0,H+.8,1.3,d);               // masts are known by their red lights: a little stronger than the city's
    }
  }
}

// ---- distant lights: villages far off as clusters of small lights on the horizon, some linked by a road of lamps. Cells of
// 5 deg (72), each a road (20% x amount), a village (55% x amount on land, half that at sea) or nothing; 5.5-12 km out, across
// the water up to 1.6 times farther. Every lamp stands on the near rise at its own bearing; lights only, a few per instance.
function pkFar(c){
  const {L,TAU,add,part,fract,mix}=c, am=P.prFar, rnd=L.rnd, N=72;
  if(am<=0)return;
  for(let ci=0;ci<N;ci++){
    const r1=rnd(ci,1,1910),r2=rnd(ci,2,1910),r3=rnd(ci,3,1910),r4=rnd(ci,4,1910);
    const uc=fract((ci+.5+(r2-.5)*.25)/N), sea=1-L.land(uc);
    const road=r1<=.2*am, vill=!road&&r1<=.2*am+.55*am*mix(1,.5,sea);
    if(!road&&!vill)continue;
    const d=mix(5500,12000,r3)*mix(1,1.6,sea);                 // across the water the far shore can be farther
    const halfW=(road?.48:mix(.12,.42,r4*r4))*TAU*d/N, hv=road?9:mix(12,45,r4);   // lamp height / the village's spread up its hillside
    const sp=road?mix(32,45,r2):mix(22,40,r3), b0=-c.EYE/d, lt=[];
    for(let j=Math.floor(-halfW/sp)-1;j<=Math.ceil(halfW/sp);j++){
      const id=ci*1000+j, lx=(j+.2+.6*rnd(id,6,1911))*sp;
      const pr=road?.9:.62*(1-.7*L.smooth(.4,1,Math.abs(lx)/halfW));   // villages thin out toward their edges
      if(rnd(id,5,1911)>pr||Math.abs(lx)>halfW)continue;
      const ly=road?hv:hv*rnd(id,7,1911)*rnd(id,8,1911)*(1-.5*Math.abs(lx)/halfW);   // most lights low, a few up the slope
      const kk=road?.72:(rnd(id,9,1911)<.6?.7:1.35);          // sodium orange or white
      lt.push([lx,ly,Math.max(b0,exRise(L,uc+lx/(TAU*d))),kk,3.2*mix(.45,1,rnd(id,10,1911))]);
    }
    for(let s=0;s<lt.length;s+=12){const ch=lt.slice(s,s+12), xc=.5*(ch[0][0]+ch[ch.length-1][0]);
      const base=Math.min(...ch.map(l=>l[2])), top=Math.max(...ch.map(l=>(l[2]-base)*d+l[1]));
      add({uc:fract(uc+xc/(TAU*d)),d,base,hw:.5*(ch[ch.length-1][0]-ch[0][0])+2,glow:40,top:top+4,hideC:1,hideM:1});
      for(const l of ch)part(PT.LIGHT,[l[0]-xc,(l[2]-base)*d+l[1],.6,1],[0,l[4],0,l[3]]);}
  }
}

// ---- farms on open treeless land: a farmhouse with a lit window, a barn, a silo, sometimes a water tower, a yard light on
// its pole. Cells of 4 deg (90), 900-2600 m out, only where the land is open and has no front treeline.
function pkFarms(c){
  const {L,TAU,add,part,fract,mix}=c, am=P.prFarm, rnd=L.rnd, N=90;
  if(am<=0)return;
  for(let ci=0;ci<N;ci++){
    const r1=rnd(ci,1,1920),r2=rnd(ci,2,1920),r3=rnd(ci,3,1920),r4=rnd(ci,4,1920),r5=rnd(ci,5,1920),r6=rnd(ci,7,1920);
    const uc=fract((ci+.5+(r2-.5)*.5)/N);
    if(r1>am*.7*L.open(uc)*(1-L.trN(uc)))continue;
    const d=mix(900,2600,r3), base=Math.max(-c.EYE/d,exRise(L,uc))-1.5/d;   // the foot sunk 1.5 m
    const sg=r4<.5?-1:1, Wh=mix(9,14,r5), Hw=mix(5,6.5,r2);
    const xb=sg*mix(24,38,r6), Wb=mix(16,28,r4), Hb=mix(5.5,8,r5), xs=xb+sg*(.5*Wb+5), Rs=mix(2.6,3.8,r3), Hs=mix(12,22,r4);
    const wt=r5>.75, xt=-sg*mix(30,55,r2), Ht=mix(24,34,r3);
    add({uc,d,base,hw:Math.max(Math.abs(xb)+.5*Wb,Math.abs(xs)+Rs,wt?Math.abs(xt)+7:0)+2,top:wt?Ht+9:Math.max(Hs+Rs,Hb+6.5,11.2)+1,hideC:1});
    exGable(part,0,Wh,Hw,Hw+mix(3,4.5,r3));                    // farmhouse
    exBox(part,.25*Wh,Hw+1.4,Hw+4.6,.5);                        // its chimney
    exGable(part,xb,Wb,Hb,Hb+mix(4,6.5,r2));                    // barn
    exBox(part,xs,0,Hs,Rs); part(PT.ELL,[xs,Hs,Rs,Rs/1.6],[0,0,1,0]);   // silo and its dome
    if(wt){exBox(part,xt,0,Ht,1.5); part(PT.ELL,[xt,Ht+3.5,7,4.5],[0,0,1,0]);}   // sometimes a water tower
    if(rnd(ci,6,1920)<=1.3*P.winD){                             // a lit window or two (Lit windows)
      part(PT.LBOX,[-.2*Wh,2.6,.6,.6],[0,.35,0,.8]); if(r3>=.5)part(PT.LBOX,[.18*Wh,2.6,.6,.6],[0,.35,0,.8]);}
    if(r2>=.3){part(PT.TRAP,[.5*xb,0,.08,.06],[6.9,0,1,0]); part(PT.LIGHT,[.5*xb,7,.35,1],[0,1.4,0,.72]);}   // a sodium yard light on its pole
  }
}

// ---- coast: a lighthouse on a headland (lantern, a faint beam in the haze) 40 m inland of a real shoreline, and ships with
// their lights out at sea (one per 10 deg cell of open sea at most, 2.5-11 km out).
function pkCoast(c){
  const {Z,L,TAU,add,part,fract,mix}=c, am=P.prCoast, rnd=L.rnd;
  if(am<=0)return;
  if(Z.uZShore[2]>.5){
    const pick=rnd(1,1,1930)>=.5, us=pick?Z.uZShore[0]:Z.uZShore[1], side=pick?-1:1;   // land lies toward smaller u from uZShore.x
    const d=mix(1800,3200,rnd(2,1,1930)), uc=fract(us+side*40/(TAU*d)), H=mix(24,40,rnd(3,1,1930)), bd=rnd(4,1,1930)<.5?-1:1;
    add({uc,d,base:Math.max(-c.EYE/d,.6*exRise(L,uc))-1/d,hw:800,top:H+80,hideC:1});
    part(PT.TRAP,[0,0,3.6,2.2],[H,0,1,0]);                     // the tapered tower
    exBox(part,0,H-.3,H+1,3.3);                                 // gallery
    exBox(part,0,H+.8,H+4.7,1.9,.55);                           // glazed lantern room
    part(PT.ELL,[0,H+4.6,2.1,1.5],[0,1,1,0]);                   // cap
    exGable(part,-side*9,9,4,7);                                // keeper's house
    part(PT.LIGHT,[0,H+2.8,1,1],[0,7,0,1.25]);                  // the lantern
    part(PT.BEAM,[0,H+2.8,bd/260,-.03/260],[1.2/260,.08,.10*(.3+.7*P.haze),1.25]);   // a beam frozen mid-sweep, seen in the haze
  }
  const N=36;
  for(let ci=0;ci<N;ci++){
    const s1=rnd(ci,1,1931),s2=rnd(ci,2,1931),s3=rnd(ci,3,1931),s4=rnd(ci,4,1931),s5=rnd(ci,5,1931),s6=rnd(ci,6,1931);
    const uc=fract((ci+.5+(s2-.5)*.5)/N);
    if(!(s1<am*.6*(1-L.land(uc))*(1-L.inZ(uc,Z.uZBridge))*(1-L.inZ(uc,Z.uZFair))))continue;
    const d=mix(2500,11000,s3*s3), ty=s4<.45?0:(s4<.8?1:2);   // 0 cargo / tanker, 1 ferry / cruise ship, 2 small boat
    const Ln=(ty===0?mix(120,240,s5):(ty===1?mix(140,280,s5):mix(14,30,s5)))*mix(.35,1,s6);   // foreshortened by its heading
    const fb=ty===0?mix(8,13,s2):(ty===1?10:2.5), g=s6<.5?-1:1, hl=.5*Ln, o=.5;   // g: heading (bow toward +x or -x)
    let top=fb+3, xm=0, hm=0;
    const hs=fb+(ty===0?mix(12,20,s5):mix(18,32,s5));
    if(ty<2){top=hs;xm=.25*Ln;hm=top+8;}else hm=top+5;
    add({uc,d,hw:hl+15,top:hm+2,hideC:1,hideM:1,seed:ci*5+3});
