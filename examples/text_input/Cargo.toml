[package]
name = "makepad-example-text-input"
version = "1.0.0"
edition = "2021"

[features]
default = ["hotreload"]
hotreload = ["makepad-widgets/hotreload"]

[dependencies]
makepad-widgets = { path = "../../widgets", version = "2.0.0" }

[dev-dependencies]
makepad-test = { path = "../../libs/makepad_test", version = "0.1.0" }

[profile.dev]
opt-level = 1
lto = "off"
[profile.dev.package."*"]
opt-level = 0
