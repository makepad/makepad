[package]
name = "makepad-example-spritelab"
version = "0.1.0"
edition = "2021"
description = "Working-tree sprite-pass lab: one immobile billboard per recipe, in an empty world"
license = "MIT OR Apache-2.0"

[features]
default = ["tweaker"]
# The design overlay (Shift+F10 with the dev overlays on). On for development
# builds; the Builder's releases build without it (--no-default-features).
tweaker = ["dep:makepad-widgets-tweaker"]

[dependencies]
makepad-widgets = { path = "../../widgets", version = "2.0.0" }
makepad-widgets-tweaker = { path = "../../widgets/families/tweaker", version = "2.0.0", optional = true }
makepad-draw = { path = "../../draw", version = "2.0.0" }
makepad-render = { path = "../../libs/render", version = "0.1.0" }
makepad-render-graph = { path = "../../libs/render_graph", version = "0.1.0" }

[dev-dependencies]
makepad-test = { path = "../../libs/makepad_test", version = "0.1.0" }
makepad-zune-png = { path = "../../libs/zune/zune-png", version = "0.5.2" }
